<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelaciones - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh}
:root{--rojo:#B70A1A}
.main{flex:1;background:#FBFBFD;min-height:100vh}
.header{height:72px;background:white;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:14px}
.btn-x{width:38px;height:38px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer;text-decoration:none;font-size:20px;font-weight:800;flex-shrink:0}
.header h1{font-size:22px;font-weight:800;color:#111}
.header p{font-size:12.5px;color:#6b7280;margin-top:2px}
.h-right{display:flex;align-items:center;gap:12px}
.admin-chip{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:999px;padding:5px 12px 5px 5px}
.admin-avatar{width:32px;height:32px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.btn-cerrar{background:var(--rojo);color:white;border:none;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer}
.content{padding:20px 24px 40px;max-width:900px;margin:0 auto}
.total-box{background:white;border:1px solid #eee;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.total-titulo{font-size:15px;font-weight:800;text-align:center;margin-bottom:14px}
.total-fila{display:flex;align-items:center;justify-content:space-between;gap:16px}
.total-item{display:flex;flex-direction:column;gap:4px}
.total-item span{font-size:12px;color:#6b7280;font-weight:600}
.total-item b{font-size:22px;font-weight:900;color:#111}
.total-num{background:#B70A1A;color:white;min-width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;padding:0 10px}
.total-sep{width:1px;height:44px;background:#eee}
.lista{display:flex;flex-direction:column;gap:12px}
.card-rest{background:white;border:1px solid #eee;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.logo-rest{width:52px;height:52px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:900;flex-shrink:0;overflow:hidden}
.logo-rest img{width:100%;height:100%;object-fit:cover}
.info-rest{flex:1;min-width:0}
.info-rest b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-rest span{font-size:12px;color:#6b7280}
.count-rest{background:#FEF2F2;border:1px solid #FECACA;color:#B70A1A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.btn-abrir{background:#111;color:white;border:none;border-radius:999px;padding:10px 18px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.empty{text-align:center;padding:60px 20px;color:#9ca3af}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal-overlay.active{display:flex}
.modal-card{background:white;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border-radius:20px;padding:22px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal-head .logo-rest{width:48px;height:48px;font-size:20px}
.modal-head b{font-size:17px;display:block}
.modal-head span{font-size:12px;color:#6b7280}
.btn-cerrar-modal{margin-left:auto;width:32px;height:32px;border-radius:50%;border:none;background:#f3f4f6;font-size:16px;font-weight:800;cursor:pointer}
.item-cancel{border:1px solid #eee;border-radius:14px;padding:14px;margin-top:12px}
.item-cancel .fila{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.item-cancel .fila span:first-child{color:#6b7280}
.item-cancel .fila b{text-align:right}
.motivo-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px;font-size:13px;font-weight:700;color:#111;margin-top:8px}
.motivo-box b{color:#B70A1A}
.por{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.por.restaurante{color:#B70A1A}
.por.repartidor{color:#111}
@media(max-width:900px){
  .header{padding:0 14px;height:auto;min-height:64px;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px}
  .header h1{font-size:18px}
  .card-rest{flex-wrap:wrap}
  .btn-abrir{width:100%}
}
</style>
</head>
<body>
<div class="main">
  <div class="header">
    <div class="header-left">
      <a href="paneladmin.html" class="btn-x">✕</a>
      <div><h1>Cancelaciones</h1><p>Resumen de pedidos cancelados por restaurante.</p></div>
    </div>
    <div class="h-right">
      <div class="admin-chip"><div class="admin-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div style="line-height:1.1"><b style="font-size:12px;display:block">Administrador</b><small style="font-size:10px;color:#6b7280">DoloYa</small></div></div>
      <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
  <div class="content">
    <div class="total-box">
      <div class="total-titulo">Total cancelaciones</div>
      <div class="total-fila">
        <div class="total-item"><span>Restaurantes</span><b id="totalRestaurantes">0</b></div>
        <div class="total-sep"></div>
        <div class="total-item" style="text-align:right"><span>Cancelaciones en total</span><b id="totalGlobal">0</b></div>
        <span class="total-num" id="totalGlobalCirculo">0</span>
      </div>
    </div>
    <div class="lista" id="listaRestaurantes"><div class="empty">Cargando cancelaciones...</div></div>
  </div>
</div>

<div class="modal-overlay" id="modalDetalle">
  <div class="modal-card">
    <div class="modal-head">
      <div class="logo-rest" id="modalLogo">?</div>
      <div><b id="modalNombre">Restaurante</b><span id="modalSub">0 cancelaciones</span></div>
      <button class="btn-cerrar-modal" onclick="cerrarModal()">✕</button>
    </div>
    <div id="modalLista"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);
const listaEl = document.getElementById('listaRestaurantes');
const totalEl = document.getElementById('totalGlobal');
const totalCirculoEl = document.getElementById('totalGlobalCirculo');
const totalRestEl = document.getElementById('totalRestaurantes');
let grupos = new Map();
function logoRestaurante(d){
  return d.restaurante?.logo || d.restaurante?.imagen || d.restaurante?.foto || d.restaurante?.img || d.restauranteLogo || d.logo || d.imagen || '';
}
function nombreRestaurante(d){
  return d.restauranteNombre || d.restaurante?.nombre || d.restaurante?.nombreReal || d.nombreRestaurante || 'Sin nombre';
}
function fechaTexto(d){
  let ts = d.canceladoEn || d.actualizadoEn || d.fechaCancelacion || d.timestamp;
  let fecha = null;
  if(ts?.seconds) fecha = new Date(ts.seconds * 1000);
  else if(ts?.toDate) fecha = ts.toDate();
  else if(typeof ts === 'string') fecha = new Date(ts);
  else if(d.fecha) fecha = new Date(d.fecha);
  if(!fecha || isNaN(fecha)) return 'Sin fecha';
  return fecha.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + fecha.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});
}
function clienteNombre(d){
  return d.nombre || d.cliente?.nombre || d.clienteNombre || 'Cliente';
}
function renderLista(){
  if(grupos.size === 0){
    listaEl.innerHTML = '<div class="empty">Aún no hay cancelaciones.</div>';
    return;
  }
  const arr = [...grupos.values()].sort((a,b)=> b.lista.length - a.lista.length);
  listaEl.innerHTML = '';
  arr.forEach(g=>{
    const div = document.createElement('div');
    div.className = 'card-rest';
    const inicial = (g.nombre||'?').charAt(0).toUpperCase();
    div.innerHTML = `<div class="logo-rest">${g.logo ? `<img src="${g.logo}">` : inicial}</div><div class="info-rest"><b>${g.nombre}</b><span>${g.lista.length} cancelaciones</span></div><span class="count-rest">${g.lista.length} canceladas</span><button class="btn-abrir" onclick="abrirDetalle('${g.key}')">Abrir</button>`;
    listaEl.appendChild(div);
  });
}
window.abrirDetalle = function(key){
  const g = grupos.get(key);
  if(!g) return;
  document.getElementById('modalLogo').innerHTML = g.logo ? `<img src="${g.logo}">` : (g.nombre||'?').charAt(0).toUpperCase();
  document.getElementById('modalNombre').textContent = g.nombre;
  document.getElementById('modalSub').textContent = g.lista.length + ' cancelaciones en total';
  const ordenadas = [...g.lista].sort((a,b)=>{
    const ta = a.canceladoEn?.seconds || (a.canceladoEn ? new Date(a.canceladoEn).getTime()/1000 : 0);
    const tb = b.canceladoEn?.seconds || (b.canceladoEn ? new Date(b.canceladoEn).getTime()/1000 : 0);
    return tb - ta;
  });
  document.getElementById('modalLista').innerHTML = ordenadas.map((d,i)=>{
    const por = (d.canceladoPor||'restaurante').toLowerCase();
    const clasePor = por === 'restaurante' ? 'restaurante' : 'repartidor';
    return `<div class="item-cancel"><div style="display:flex;justify-content:space-between;align-items:center"><b>#${ordenadas.length - i}</b><span class="por ${clasePor}">Cancelado por ${por}</span></div><div class="fila"><span>Fecha</span><b>${fechaTexto(d)}</b></div><div class="fila"><span>Código</span><b>${d.codigo || d.idOriginal || 'ST-0'}</b></div><div class="fila"><span>Cliente</span><b>${clienteNombre(d)}</b></div><div class="fila"><span>Teléfono</span><b>${d.telefono || d.cliente?.celular || d.cliente?.telefono || 'Sin teléfono'}</b></div><div class="fila"><span>Dirección</span><b>${d.direccionEntrega || d.cliente?.direccion || 'Sin dirección'}</b></div><div class="motivo-box"><b>Motivo:</b> ${d.motivoCancelacion || 'Sin motivo'}</div></div>`;
  }).join('');
  document.getElementById('modalDetalle').classList.add('active');
};
window.cerrarModal = function(){ document.getElementById('modalDetalle').classList.remove('active'); };
document.getElementById('modalDetalle').addEventListener('click', (e)=>{ if(e.target.id === 'modalDetalle') cerrarModal(); });
onSnapshot(collection(db,"pedidos_cancelados"), (snap)=>{
  grupos.clear();
  const totalGlobalNum = snap.size;
  totalEl.textContent = totalGlobalNum;
  totalCirculoEl.textContent = totalGlobalNum;
  totalRestEl.textContent = 0;
  snap.forEach(docSnap=>{
    const d = docSnap.data();
    const nombre = nombreRestaurante(d);
    const key = (d.restauranteCat || d.restaurante?.cat || nombre).toLowerCase().replace(/\s+/g,'_');
    if(!grupos.has(key)){
      grupos.set(key, { key, nombre, logo: logoRestaurante(d), lista: [] });
    }
    const g = grupos.get(key);
    const logoNuevo = logoRestaurante(d);
    if(logoNuevo) g.logo = logoNuevo;
    g.lista.push({ id: docSnap.id, ...d });
  });
  totalRestEl.textContent = grupos.size;
  renderLista();
});
window.cerrarSesion = function(){
  localStorage.removeItem('doloya_aliado_sesion');
  window.location.href = 'index.html';
};
</script>
</body>
</html>
