<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial - Doloya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Inter',Helvetica,Arial,sans-serif;color:#0f172a}
.header{max-width:1280px;margin:0 auto;padding:10px 18px 8px;display:flex;align-items:center;border-bottom:1px solid #eef2f7}
.header-left{display:flex;align-items:center;gap:8px;cursor:pointer}
.icon-x{width:28px;height:28px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center}
.header h1{font-size:18px;font-weight:800}
.controls{max-width:1280px;margin:10px auto 0;padding:0 18px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.2px solid #e5eaf0;background:white;border-radius:999px;padding:5px 12px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;color:#334155}
.tab.active{background:#E30613;border-color:#E30613;color:white}
.tab .ic{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ic-green{background:#22c55e}.ic-red{background:#E30613}
.search{position:relative;min-width:280px;flex:1;max-width:380px}
.search input{width:100%;border:1.2px solid #e5eaf0;border-radius:9px;padding:7px 10px 7px 30px;font-size:11px;outline:none}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%)}
.filters{max-width:1280px;margin:10px auto 0;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters label{font-size:9px;font-weight:800;color:#475569;text-transform:uppercase;display:block;margin-bottom:3px}
.filters input{border:1.2px solid #e5eaf0;border-radius:8px;padding:6px 10px;font-size:11px;outline:none;min-width:150px}
.btn-search{background:#0f172a;color:white;border:none;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:800;cursor:pointer}
.f-client-wrap{position:relative}
.suggest{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #e5eaf0;border-radius:8px;max-height:160px;overflow:auto;z-index:100;display:none;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.suggest div{padding:6px 10px;font-size:11px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.suggest div:hover{background:#f8fafc}
.suggest.active{display:block}
.list{max-width:1280px;margin:12px auto;padding:0 18px 40px;display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:170px 1px 1fr 1px 210px 115px;gap:0;background:white;border:1px solid #eef2f7;border-radius:10px;padding:8px 12px;align-items:center;min-height:68px}
.card.entregado{background:#f6fbf6;border-color:#d9ecd9}
.card.cancelado{background:#fff7f7;border-color:#ffd6d6}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;margin-bottom:3px}
.badge.entregado{background:#22c55e;color:white}
.badge.cancelado{background:#fecaca;color:#7f1d1d}
.badge .s{width:12px;height:12px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center}
.fecha{font-size:9px;color:#64748b;margin:1px 0 3px}
.cliente{font-size:9.5px;color:#334155;display:flex;gap:3px;margin-top:1px}
.sep{width:1px;background:#eef2f7;height:52px}
.col-recogida{display:flex;flex-direction:column;gap:6px;padding:0 12px}
.item{display:flex;gap:6px}
.item b{font-size:9.5px;display:block}
.item span{font-size:9px;color:#64748b;line-height:1.2}
.col-precios{padding:0 10px;display:flex;flex-direction:column;gap:4px}
.precio-row{display:flex;gap:6px;align-items:center}
.precio-row span{font-size:8.5px;color:#64748b;display:block}
.precio-row .val{font-weight:800;font-size:10.5px}
.total{border-top:1px solid #e2e8f0;padding-top:4px;display:flex;justify-content:space-between}
.total b{font-size:8.5px;color:#64748b}
.total .val{font-size:11px;font-weight:900}
.btn-det{border:1.2px solid #E30613;background:white;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;cursor:pointer;width:100%}
@media(max-width:1024px){.card{grid-template-columns:1fr;gap:8px}.sep{display:none}}
.modal{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:9999;overflow:auto}
.modal.active{display:flex}
.modal-top{position:sticky;top:0;background:white;border-bottom:1px solid #eef2f7;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-top h2{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-close{background:#111;color:white;border:none;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer}
.modal-body{max-width:980px;margin:0 auto;padding:14px 16px 40px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.modal-body{grid-template-columns:1fr}}
.box{border:1px solid #eef2f7;border-radius:10px;padding:10px 12px}
.box h4{font-size:10px;font-weight:800;margin-bottom:6px;text-transform:uppercase;border-bottom:1px solid #f1f5f9;padding-bottom:5px}
.row-s{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;border-bottom:1px dashed #f1f5f9}
.row-s:last-child{border-bottom:none}
.row-s b{color:#475569;font-weight:600}
.row-s span{font-weight:700;text-align:right;max-width:62%;word-break:break-word}
.presupuesto{grid-column:1/-1}
.pres-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #eef2f7;font-size:10.5px}
.pres-row.total-final{font-weight:900;font-size:12px;background:#f8fafc;padding:8px;border-radius:8px;border:none}
.pres-row.sub{font-weight:800;background:#f1f5f9;padding:6px 8px;border-radius:6px;border:none}
.pres-row.green{color:#15803d;background:#f0fdf4;padding:8px;border-radius:8px;border:1px solid #bbf7d0;font-weight:900;font-size:12px}
.badge-pago{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:0.3px}
.badge-pago.pendiente{background:#FFE1E1;color:#E30613;border:1.5px solid #FF4D4D;box-shadow:0 0 8px rgba(227,6,19,0.45)}
.badge-pago.pagado{background:#D1FFDB;color:#15803d;border:1.5px solid #22c55e;box-shadow:0 0 8px rgba(34,197,94,0.55)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left" onclick="window.location.href='panelaliado.html'">
    <div class="icon-x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <h1>Historial</h1>
  </div>
</div>

<div class="controls">
  <div class="tabs">
    <button class="tab active" data-f="todos" id="tabTodos"><span class="ic" style="background:#E30613;display:flex;align-items:center;justify-content:center"><svg width="8" height="8" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="4"/></svg></span>Todos (0)</button>
    <button class="tab" data-f="entregado" id="tabEnt"><span class="ic ic-green"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>Entregados (0)</button>
    <button class="tab" data-f="cancelado" id="tabCanc"><span class="ic ic-red"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>Cancelados (0)</button>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="6"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    <input id="buscador" placeholder="Filtrar por número de pedido...">
  </div>
</div>

<div class="filters">
  <div><label>Filtrar por mes</label><input type="month" id="fMes"></div>
  <div><label>Filtrar por día</label><input type="date" id="fDia"></div>
  <div class="f-client-wrap"><label>Filtrar por cliente</label><input type="text" id="fCliente" placeholder="Escribe nombre del cliente..." autocomplete="off"><div class="suggest" id="suggest"></div></div>
  <div><button class="btn-search" id="btnBuscar">Buscar</button> <button class="btn-search" style="background:#e2e8f0;color:#0f172a" id="btnLimpiar">Limpiar</button></div>
</div>

<div class="list" id="lista"><div style="text-align:center;padding:30px;font-size:12px;color:#64748b">Cargando historial de tu restaurante...</div></div>

<div class="modal" id="modal">
  <div class="modal-top"><h2 id="modalTitle">Detalles</h2><button class="btn-close" onclick="document.getElementById('modal').classList.remove('active')">Cerrar X</button></div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosPedidos = [];
let filtro = "todos";
let filtroMes = "", filtroDia = "";

const sesionAliado = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
const idAliado = (sesionAliado?.id || sesionAliado?.negocio || '').toLowerCase().trim();
const nombreAliado = (sesionAliado?.nombre || sesionAliado?.restaurante || '').toLowerCase().trim();

function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function toHora(ts){
  if(!ts) return '-';
  try{
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if(isNaN(d.getTime())){
      if(typeof ts==='string' && ts.match(/\d/)) return ts;
      return '-';
    }
    return d.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true});
  }catch{ return typeof ts==='string'?ts:'-'; }
}
function num(v){ if(v==null) return 0; if(typeof v==='number') return v; let s=String(v).replace(/[^0-9.,-]/g,'').replace(',','.'); let n=parseFloat(s); return isNaN(n)?0:n; }
function buscar(raw, palabras){
  if(!raw || typeof raw!=='object') return null;
  for(let k in raw){
    let kl = k.toLowerCase();
    for(let p of palabras){ if(kl.includes(p)) return raw[k]; }
    if(typeof raw[k]==='object'){ let r=buscar(raw[k], palabras); if(r && r!=='-' && r!=='' ) return r; }
  }
  return null;
}
function getEstadoPago(raw){
  let val = buscar(raw, ['estado_pago','estadopago','pago_estado','status_pago']);
  if(val) return String(val).toLowerCase();
  if(raw.pagado===true || raw.pagado==='true' || raw.pagado===1) return 'pagado';
  if(raw.pagado===false || raw.pagado==='false' || raw.pagado===0) return 'pendiente';
  if(raw.pago===true) return 'pagado';
  return 'pendiente';
}

// CORREGIDO: VINCULACION EXACTA SOLO A ESTE RESTAURANTE LOGUEADO
function esDeEsteRestaurante(p){
  if(!idAliado) return false;
  const raw = p.raw || {};
  
  // Todos los posibles campos donde guardas el ID del restaurante en Firestore
  const posiblesIds = [
    raw.restauranteId,
    raw.idRestaurante,
    raw.restaurante?.id,
    raw.negocioId,
    raw.idNegocio,
    raw.restaurante_id,
    raw.id_aliado
  ].map(v => String(v||'').toLowerCase().trim()).filter(Boolean);

  // 1. Coincidencia EXACTA de ID - PRIORIDAD MAXIMA
  for(let rid of posiblesIds){
    let ridNorm = rid.replace(/-/g,'_').replace(/\s+/g,'_');
    let idAliadoNorm = idAliado.replace(/-/g,'_').replace(/\s+/g,'_');
    if(rid === idAliado || ridNorm === idAliadoNorm) return true;
  }

  // 2. Si no hay ID, verifica por nombre EXACTO de tienda logueada
  const tiendaNorm = normalize(p.tienda);
  const nombreAliadoNorm = normalize(nombreAliado);
  const idAliadoNorm2 = normalize(idAliado);

  if(nombreAliadoNorm && tiendaNorm === nombreAliadoNorm) return true;
  if(idAliadoNorm2 && tiendaNorm === idAliadoNorm2) return true;

  // 3. Fallback: si el campo restauranteNombre es EXACTO
  const rNombre = normalize(raw.restauranteNombre || raw.restaurante?.nombre || raw.negocio || '');
  if(nombreAliadoNorm && rNombre === nombreAliadoNorm) return true;

  return false;
}

function parseDoc(docSnap){
  const data = docSnap.data(); const id = docSnap.id;
  const fechaBase = data.fechaCancelacion || data.fechaEntrega || data.fechaFinalizado || data.enviadoAHistorialEn || data.timestamp || data.createdAt || new Date().toISOString();
  const f = fechaBase?.toDate ? fechaBase.toDate() : new Date(fechaBase);
  const estadoRaw = String(data.estado || data.estadoOriginal || '').toLowerCase();
  let estadoVisual = estadoRaw.includes('cancel') ? 'cancelado' : 'entregado';
  let label = estadoVisual==='cancelado' ? 'Cancelado' : 'Entregado';
  let prod = 0, envio = 0, servicio = 0, total = 0;
  if(data.totales){
    prod = num(data.totales.subtotal || data.totales.producto || data.totales.productos || data.totales.valorProducto);
    envio = num(data.totales.envio || data.totales.tarifaEnvio || data.totales.costoEnvio || data.totales.valorEnvio);
    servicio = num(data.totales.servicio || data.totales.tarifaServicio || data.totales.costoServicio);
    total = num(data.totales.total || data.totales.totalPagar);
  }
  if(!prod) prod = num(data.producto || data.valorProducto || data.subtotal);
  if(!envio) envio = num(data.envio || data.tarifaEnvio || data.costoEnvio || data.valorEnvio || data.precioEnvio);
  if(!servicio) servicio = num(data.servicio || data.tarifaServicio);
  if(!total) total = num(data.total || data.valorTotal);
  if(!prod && Array.isArray(data.productos)){ prod = data.productos.reduce((a,p)=> a + num(p.precio||p.price||0)*num(p.cantidad||p.qty||1),0); }
  if(!total) total = prod+envio+servicio;
  return {
    id, codigo: String(data.codigo || data.idOriginal || data.numeroPedido || id).replace('#','').replace('ST-',''),
    cliente: data.nombre || data.cliente?.nombre || data.datosCliente?.nombre || 'Cliente',
    tienda: data.restaurante?.nombre || data.tienda || data.restauranteNombre || data.negocio || 'Tienda',
    telefono: data.telefono || data.cliente?.telefono || '-',
    coloniaEntrega: data.coloniaEntrega || data.cliente?.colonia || 'Col. Centro',
    colTienda: data.restaurante?.colonia || 'Col. Centro',
    direccion: data.direccionEntrega || data.cliente?.direccion || data.direccion || '-',
    gps: data.gps || data.ubicacionCompleta || {lat: data.cliente?.lat||data.lat||null, lng: data.cliente?.lng||data.lng||null},
    ip: data.ip || data.ipCliente || data.cliente?.ip || data.datosCliente?.ip || data.ubicacionCompleta?.ip || data.ipAddress || '-',
    ipEstado: data.ipBloqueada ? 'Bloqueado' : (data.ipEstado || data.estadoIP || (data.bloqueado ? 'Bloqueado' : 'Activo')),
    ciudad: data.ciudad || data.cliente?.ciudad || data.datosCliente?.ciudad || data.municipio || data.ubicacionCompleta?.ciudad || '-',
    dispositivo: data.dispositivo || data.tipoDispositivo || data.tipoIngreso || data.plataforma || data.device || data.userAgent || data.os || '-',
    restDireccion: data.restaurante?.direccion || data.direccionRestaurante || data.restauranteDireccion || '-',
    restTelefono: data.restaurante?.telefono || data.telefonoRestaurante || data.restauranteTelefono || '-',
    restHorario: data.restaurante?.horario || data.horarioRestaurante || data.restaurante?.horarioAtencion || data.horario || '-',
    producto: prod, envio, servicio, total,
    fechaStr: isNaN(f.getTime()) ? '-' : f.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}),
    horaStr: isNaN(f.getTime()) ? '-' : f.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),
    estadoVisual, estadoLabel: label, raw: data,
    repartidor: data.repartidorNombre || data.canceladoPorNombre || '-',
    motivo: data.motivoCancelacion || data.detalleCancelacion || '-',
    _fechaObj: f,
    _mes: isNaN(f.getTime()) ? '' : `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}`,
    _dia: isNaN(f.getTime()) ? '' : `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`
  };
}

function getPedidosDeEsteRestaurante(){
  if(!idAliado) return [];
  return todosPedidos.filter(esDeEsteRestaurante);
}

function actualizarConteos(){
  const base = getPedidosDeEsteRestaurante();
  const todos = base.length;
  const ent = base.filter(p=>p.estadoVisual==='entregado').length;
  const canc = base.filter(p=>p.estadoVisual==='cancelado').length;
  document.getElementById('tabTodos').innerHTML = `<span class="ic" style="background:#E30613;display:flex;align-items:center;justify-content:center"><svg width="8" height="8" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="4"/></svg></span>Todos (${todos})`;
  document.getElementById('tabEnt').innerHTML = `<span class="ic ic-green"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>Entregados (${ent})`;
  document.getElementById('tabCanc').innerHTML = `<span class="ic ic-red"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>Cancelados (${canc})`;
}

function renderLista(){
  const qRaw = document.getElementById('buscador').value.trim();
  const q = normalize(qRaw).replace('#','');
  const qNum = qRaw.replace(/\D/g,'');
  const clienteQ = normalize(document.getElementById('fCliente').value);
  let base = getPedidosDeEsteRestaurante();
  let filtrados = base.filter(p=>{
    if(filtro!=='todos' && p.estadoVisual!==filtro) return false;
    if(filtroMes && p._mes !== filtroMes) return false;
    if(filtroDia && p._dia !== filtroDia) return false;
    if(clienteQ){ if(!normalize(p.cliente).includes(clienteQ)) return false; }
    if(q){
      const codNorm = normalize(p.codigo);
      const idNorm = normalize(p.id);
      const codNumeros = codNorm.replace(/\D/g,'');
      const matchCodigo = codNorm.includes(q);
      const matchId = idNorm.includes(q);
      const matchNumero = qNum && (codNumeros.includes(qNum) || codNorm.includes(qNum));
      if(!(matchCodigo || matchId || matchNumero)) return false;
    }
    return true;
  }).sort((a,b)=> b._fechaObj - a._fechaObj);
  
  actualizarConteos();
  document.getElementById('lista').innerHTML = filtrados.map(p=>`
    <div class="card ${p.estadoVisual}">
      <div>
        <div class="badge ${p.estadoVisual}"><span class="s">${p.estadoVisual==='entregado'?`<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`:`<svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`}</span>${p.estadoLabel}</div>
        <div style="font-weight:800;font-size:11.5px">#${p.codigo}</div>
        <div class="fecha">${p.fechaStr} • ${p.horaStr}</div>
        <div class="cliente">${p.cliente}</div>
        <div class="cliente" style="font-size:9px">${p.coloniaEntrega}</div>
      </div>
      <div class="sep"></div>
      <div class="col-recogida">
        <div class="item"><b>Recogida</b><span> ${p.tienda} - ${p.colTienda}</span></div>
        <div class="item"><b>Entrega</b><span> ${p.direccion}</span></div>
      </div>
      <div class="sep"></div>
      <div class="col-precios">
        <div class="precio-row"><span>Producto</span><b class="val">$${p.producto.toFixed(2)}</b></div>
        <div class="total"><b>Total</b><div class="val">$${p.producto.toFixed(2)}</div></div>
      </div>
      <div style="padding-left:8px"><button class="btn-det" onclick="abrirDetalle('${p.id}')">Ver detalles</button></div>
    </div>
  `).join('') || '<div style="text-align:center;padding:30px;font-size:12px;color:#64748b">Sin pedidos para este restaurante con esos filtros</div>';
}

function renderSuggest(){
  const input = document.getElementById('fCliente');
  const box = document.getElementById('suggest');
  const q = normalize(input.value);
  if(!q){ box.classList.remove('active'); return; }
  const base = getPedidosDeEsteRestaurante();
  const unicos = [...new Set(base.map(p=>p.cliente))].filter(Boolean);
  const coincidencias = unicos.filter(n=> normalize(n).includes(q)).slice(0,8);
  if(coincidencias.length===0){ box.classList.remove('active'); return; }
  box.innerHTML = coincidencias.map(n=>`<div data-name="${n}">${n}</div>`).join('');
  box.classList.add('active');
  box.querySelectorAll('div').forEach(d=>{
    d.addEventListener('click',()=>{
      input.value = d.dataset.name;
      box.classList.remove('active');
      renderLista();
    });
  });
}

function escuchar(nombre){
  onSnapshot(collection(db, nombre), (snap)=>{
    const nuevos = snap.docs.map(parseDoc);
    const map = new Map(); [...todosPedidos, ...nuevos].forEach(p=> map.set(p.id, p));
    todosPedidos = Array.from(map.values());
    renderLista();
  });
}
escuchar("pedidos_cancelados");
escuchar("pedidos_entregados");

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); filtro=t.dataset.f; renderLista();
  });
});

document.getElementById('buscador').addEventListener('input',()=>renderLista());
document.getElementById('fCliente').addEventListener('input',()=>{ renderSuggest(); renderLista(); });
document.getElementById('fMes').addEventListener('change',()=>{ filtroMes = document.getElementById('fMes').value; renderLista(); });
document.getElementById('fDia').addEventListener('change',()=>{ filtroDia = document.getElementById('fDia').value; renderLista(); });

document.getElementById('btnBuscar').addEventListener('click',()=>{
  filtroMes = document.getElementById('fMes').value;
  filtroDia = document.getElementById('fDia').value;
  document.getElementById('suggest').classList.remove('active');
  renderLista();
});
document.getElementById('btnLimpiar').addEventListener('click',()=>{
  document.getElementById('fMes').value=''; document.getElementById('fDia').value=''; document.getElementById('fCliente').value=''; document.getElementById('buscador').value=''; document.getElementById('suggest').classList.remove('active');
  filtroMes=''; filtroDia=''; renderLista();
});

window.abrirDetalle = (id)=>{
  const p = todosPedidos.find(x=>x.id===id); if(!p) return;
  const raw = p.raw;
  const estadoPago = getEstadoPago(raw);
  const esPagado = estadoPago.includes('pagado');
  const badgePago = esPagado ? `<span class="badge-pago pagado">PAGADO</span>` : `<span class="badge-pago pendiente">PAGO PENDIENTE</span>`;

  const prod=p.producto||0;
  const comision = prod*0.10;
  let htmlDesglose = '';

  if(p.estadoVisual==='cancelado'){
    const descCancel = prod*0.40;
    const pagoRest = prod - comision - descCancel;
    htmlDesglose = `
      <div class="pres-row"><span>Producto</span><b>$${prod.toFixed(2)}</b></div>
      <div class="pres-row total-final"><span>Total pagado cliente</span><b>$0.00</b></div>
      <div class="pres-row"><span>Descuento 10% plataforma</span><b>-$${comision.toFixed(2)}</b></div>
      <div class="pres-row"><span>Descuento por cancelación 40%</span><b>-$${descCancel.toFixed(2)}</b></div>
      <div class="pres-row green"><span>Total a pagar al restaurante (50%)</span><b>$${pagoRest.toFixed(2)}</b></div>
    `;
  } else {
    const pagoRest = prod - comision;
    htmlDesglose = `
      <div class="pres-row"><span>Producto</span><b>$${prod.toFixed(2)}</b></div>
      <div class="pres-row total-final"><span>Total pagado cliente</span><b>$${prod.toFixed(2)}</b></div>
      <div class="pres-row"><span>Descuento 10% plataforma</span><b>-$${comision.toFixed(2)}</b></div>
      <div class="pres-row green"><span>Total a pagar al restaurante</span><b>$${pagoRest.toFixed(2)}</b></div>
    `;
  }

  document.getElementById('modalTitle').innerHTML=`#${p.codigo} - ${p.estadoLabel} ${badgePago}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="box"><h4>Datos de Entrega - ${p.estadoLabel}</h4>
      <div class="row-s"><b>Estado</b><span style="color:${p.estadoVisual==='entregado'?'#22c55e':'#E30613'};font-weight:900">${p.estadoLabel}</span></div>
      <div class="row-s"><b>Nombre cliente</b><span>${p.cliente}</span></div>
      <div class="row-s"><b>Dirección entrega</b><span>${p.direccion}</span></div>
      <div class="row-s"><b>Colonia</b><span>${p.coloniaEntrega}</span></div>
      <div class="row-s"><b>Fecha del pedido</b><span>${p.fechaStr} • ${p.horaStr}</span></div>
      <div class="row-s"><b>Repartidor</b><span>${p.repartidor}</span></div>
    </div>
    <div class="box"><h4>Productos</h4>${(raw.productos||raw.items||[]).map(pr=>`<div class="row-s"><b>${pr.nombre||pr.name||'Prod'}</b><span>x${pr.cantidad||1} $${pr.precio||pr.price||0}</span></div>`).join('')||`<div class="row-s"><b>Producto</b><span>$${prod.toFixed(2)}</span></div>`}</div>
    <div class="box presupuesto"><h4>Desglose REAL - Restaurante</h4>
      ${htmlDesglose}
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}
</script>
