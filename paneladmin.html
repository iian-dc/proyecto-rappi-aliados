<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B70A1A">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;display:flex;min-height:100vh}
:root{--rojo:#B70A1A}
.sidebar{width:240px;background:var(--rojo);display:flex;flex-direction:column;padding:18px 12px;position:fixed;left:0;top:0;bottom:0;z-index:20;overflow-y:auto;transition:transform .3s ease}
.logo-wrap{text-align:center;margin:10px 0 18px}
.logo-D{font-weight:900;font-size:58px;color:white;letter-spacing:-2px;line-height:1;position:relative;display:inline-block}
.logo-D::after{content:'';position:absolute;left:-4px;top:44%;width:90%;height:3px;background:white;transform:rotate(-10deg)}
.logo-text{font-size:26px;font-weight:900;color:white;font-style:italic;margin-top:-4px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{text-decoration:none;color:white;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:600;position:relative}
.menu a.active{background:white;color:var(--rojo)}
.menu a.active svg{stroke:var(--rojo)!important;fill:var(--rojo)!important}
.badge-pedidos{margin-left:auto;background:#FF0000;color:white;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 6px}
.menu a.active .badge-pedidos{background:#B70A1A;color:white}
.footer-side{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.25)}
.main{margin-left:240px;flex:1;background:#FBFBFD;min-height:100vh}
.header{height:72px;background:white;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:12px}
.btn-hamburger{display:none;width:42px;height:42px;background:#f3f4f6;border:none;border-radius:10px;align-items:center;justify-content:center;cursor:pointer}
.header h1{font-size:22px;font-weight:800;color:#111}
.header p{font-size:12.5px;color:#6b7280;margin-top:2px}
.h-right{display:flex;align-items:center;gap:12px}
.btn-instalar{display:none;background:#111;color:white;border:none;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;align-items:center;gap:6px;cursor:pointer}
.bell{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell-count{position:absolute;top:-2px;right:-2px;background:#E30613;color:white;min-width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bell.vibrar{animation:bell3d .15s infinite}
@keyframes bell3d{0%{transform:rotate(-12deg) scale(1.1)}50%{transform:rotate(12deg) scale(1.25)}100%{transform:rotate(-12deg) scale(1.1)}}
.admin-chip{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:999px;padding:5px 12px 5px 5px}
.admin-avatar{width:32px;height:32px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.btn-cerrar{background:var(--rojo);color:white;border:none;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer}
.center-content{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;min-height:calc(100vh - 72px)}
.ilustracion{width:260px;height:180px;margin-bottom:24px}
.center-content h2{font-size:34px;font-weight:800;color:#111;margin-bottom:10px}
.center-content p{font-size:14.5px;color:#6b7280;max-width:420px;line-height:1.4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
.overlay.open{display:block}

@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{transform:translateX(-100%);width:270px;box-shadow:4px 0 20px rgba(0,0,0,.25)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .btn-hamburger{display:flex}
  .header{padding:10px 14px;height:auto;min-height:64px}
  .header h1{font-size:17px;line-height:1.1}
  .header p{font-size:11px;display:none}
  .h-right{gap:8px}
  .admin-chip b,.admin-chip small{display:none}
  .admin-chip{padding:3px}
  .btn-cerrar{padding:7px 10px;font-size:11px}
  .btn-instalar{padding:7px 10px;font-size:11px}
  .center-content{padding:24px 16px}
  .center-content h2{font-size:22px}
  .ilustracion{width:180px;height:120px}
}
</style>
</head>
<body>

  <div class="logo-wrap">

  <nav class="menu">

    <a href="paneladmin-historial.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>Historial</span></a>

    <a href="paneladmin-pagosyfacturas.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>Pagos</span></a>
    <a href="paneladmin-finanzas.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/></svg><span>Finanzas</span></a>
    <a href="promociones.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.39.39 1.02.39 1.41 0l7-7c.39-.39.39-1.02 0-1.42z"/></svg><span>Promociones</span></a>

  </nav>
</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <button class="btn-hamburger" id="btnMenu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <h1>Panel de administración</h1>
        <p>Bienvenido, aquí tienes el resumen de tu negocio.</p>
      </div>
    </div>
    <div class="h-right">
      <button id="btnInstalar" class="btn-instalar"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Instalar App</button>
      <div class="bell" id="bellIcon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B70A1A" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-count" id="bellCount">0</span></div>
      <div class="admin-chip"><div class="admin-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/></svg></div></div>
      <button class="btn-cerrar" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <div class="center-content">
    <div class="ilustracion"><svg viewBox="0 0 260 180" fill="none"><ellipse cx="130" cy="95" rx="85" ry="70" fill="#FFE4E8"/><circle cx="125" cy="55" r="28" fill="#B70A1A"/></svg></div>
    <h2>Hola Administrador</h2>
    <p>Todo lo importante de tu negocio está en tus manos.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);

const bell = document.getElementById('bellIcon');
const countEl = document.getElementById('countPedidos');
const bellCount = document.getElementById('bellCount');
const btnInstalar = document.getElementById('btnInstalar');
const btnMenu = document.getElementById('btnMenu');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

let ultimoTotal = 0;
let primerCarga = true;
let audioCtx = null;
let deferredPrompt = null;

// MENU HAMBURGUESA CELULAR
btnMenu.addEventListener('click', ()=>{
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
});
overlay.addEventListener('click', ()=>{
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

// PERMISO NOTIFICACION - PIDE AL ENTRAR
if ('Notification' in window) {
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(p=>{
      console.log("Permiso notificacion:", p);
    });
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstalar.style.display = 'flex';
});
btnInstalar.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  btnInstalar.style.display = 'none';
});

document.addEventListener('click', ()=>{
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch{}
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}, {once:true});

function sonarAlertaFuerte(){
  bell.classList.add('vibrar');
  setTimeout(()=>bell.classList.remove('vibrar'),4000);
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const ctx = audioCtx;
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value= i%2===0 ? 950 : 1300;
        gain.gain.setValueAtTime(1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.7);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.7);
      }, i*300);
    }
  }catch{}
  try{
    const u = new SpeechSynthesisUtterance("Nuevo pedido DoloYa");
    u.lang='es-MX'; u.rate=1.1; window.speechSynthesis.speak(u);
  }catch{}
}

function notificarBloqueado(total){
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;

  const opciones = {
    body: `¡Tienes ${total} pedido${total>1?'s':''} nuevo${total>1?'s':''}! Toca para abrir.`,
    icon: 'LOGO-PANEL.PNG',
    badge: 'LOGO-PANEL.PNG',
    vibrate: [500,200,500,200,500],
    requireInteraction: true,
    renotify: true,
    tag: 'pedido-doloya',
    silent: false
  };

  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification('🔔 ¡Nuevo pedido DoloYa!', opciones);
    });
  } else {
    new Notification('🔔 ¡Nuevo pedido DoloYa!', opciones);
  }
}

onSnapshot(collection(db,"pedidos"), (snap)=>{
  const activos = snap.docs.filter(d=>{
    const est = (d.data().estado || "").toLowerCase();
    return !["entregado","cancelado","rechazado"].includes(est);
  });
  const total = activos.length;
  if(total > 0){
    countEl.textContent = total;
    bellCount.textContent = total;
    countEl.style.display = 'flex';
    bellCount.style.display = 'flex';
  } else {
    countEl.style.display = 'none';
    bellCount.style.display = 'none';
  }
  if(!primerCarga && total>ultimoTotal){
    sonarAlertaFuerte();
    notificarBloqueado(total);
    // Vibracion fisica del celular si esta bloqueado
    if (navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
  }
  ultimoTotal = total;
  primerCarga = false;
});

window.cerrarSesion = function(){
  localStorage.removeItem('doloya_aliado_sesion');
  window.location.href = 'index.html';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
