<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagos y Facturas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;color:#0f172a}
.header-top{background:white;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.btn-x{width:34px;height:34px;background:#E30613;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header-top h1{font-size:15px;font-weight:800}
.top-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
@media(max-width:900px){.top-cards{grid-template-columns:repeat(2,1fr)}}
.tcard{background:white;border-radius:12px;border:1px solid #eef2f7;padding:10px 12px;display:flex;gap:10px;align-items:center}
.ticon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800}
.tcard b{font-size:14px;font-weight:800;display:block}
.tcard span{font-size:10px;color:#64748b;font-weight:600}
.main{display:grid;grid-template-columns:1fr 290px;gap:12px;padding:0 12px 20px}
@media(max-width:1100px){.main{grid-template-columns:1fr}}
.box{background:white;border-radius:12px;border:1px solid #eef2f7;overflow:hidden}
.filters{display:flex;gap:8px;padding:10px}
.filters input,.filters select{flex:1;padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0;font-size:11px}
.table-head{background:#0a1020;color:white;display:grid;grid-template-columns:1.3fr .5fr .5fr .5fr .5fr .6fr .45fr .5fr .5fr;padding:8px 10px;font-size:9px;font-weight:700;text-transform:uppercase}
.table-row{display:grid;grid-template-columns:1.3fr .5fr .5fr .5fr .5fr .6fr .45fr .5fr .5fr;padding:8px 10px;border-bottom:1px solid #f1f5f9;align-items:center;font-size:10.5px}
.aliado{display:flex;gap:8px;align-items:center}
.aliado-logo{width:32px;height:32px;border-radius:50%;background:#fff1f1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#E30613;border:1px solid #fee2e2;overflow:hidden;flex-shrink:0}
.aliado-logo img{width:100%;height:100%;object-fit:cover}
.badge{padding:3px 7px;border-radius:999px;font-size:8.5px;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.btn-ver{border:1px solid #E30613;color:#E30613;background:white;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}
.right{display:flex;flex-direction:column;gap:12px}
.resumen{padding:12px}
.resumen h3{font-size:11px;font-weight:800;margin-bottom:8px}
.item-res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:11px}
</style>
</head>
<body>

<div class="header-top">
<button class="btn-x" onclick="location.href='paneladmin.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div style="width:2px;height:16px;background:#E30613"></div>
<h1>Pagos y Facturas</h1>
</div>

<div class="top-cards">
<div class="tcard"><div class="ticon" style="background:#16a34a">$</div><div><span>Pagos realizados</span><b id="kPagados">$ 0.00</b></div></div>
<div class="tcard"><div class="ticon" style="background:#f59e0b">$</div><div><span>Pagos pendientes</span><b id="kPendiente">$ 0.00</b></div></div>
<div class="tcard"><div class="ticon" style="background:#0f172a">R</div><div><span>Total restaurantes</span><b id="kTotalRest">0</b></div></div>
<div class="tcard"><div class="ticon" style="background:#E30613">F</div><div><span>Total facturas pendientes</span><b id="kFactPend">0</b></div></div>
</div>

<div class="main">
<div class="box">
<div class="filters">
<input id="buscar" placeholder="Buscar restaurante..." onkeyup="filtrar()">
<select id="fEstado" onchange="filtrar()"><option value="todos">Todos</option><option value="abierto">Abierto</option><option value="cerrado">Cerrado</option></select>
</div>
<div class="table-head">
<span>Aliado / Restaurante</span><span>Total ventas</span><span>Desglose -10%</span><span>Pagado</span><span>Pendiente</span><span>Ultimo pago</span><span>Facturas</span><span>Estado</span><span>Acciones</span>
</div>
<div id="listaAliados"><div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Cargando doloya_aliados/admin...</div></div>
</div>

<div class="right">
<div class="box resumen">
<h3>Resumen</h3>
<div class="item-res"><span>Total restaurantes</span><b id="rTotal">0</b></div>
<div class="item-res"><span>Abiertos</span><b id="rAbiertos">0</b></div>
<div class="item-res"><span>Cerrados</span><b id="rCerrados">0</b></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const configAliados = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};

const appAliados = initializeApp(configAliados, "aliadosApp");
const dbAliados = getDatabase(appAliados);
const appHis = initializeApp(configHistorial, "hisApp");
const dbHis = getFirestore(appHis);

let aliados=[]; let filtrados=[];
function limpiarNombre(s){ return (s||"").replace(/_/g," ").trim(); }
function fechaHora(f){
  if(!f) return "-";
  try{ let d=new Date(f); if(isNaN(d.getTime())) d=new Date(Number(f)); if(isNaN(d.getTime())) return "-"; return d.toLocaleDateString('es-MX')+" "+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch{ return "-"; }
}

async function cargar(){
  let mapa={}; let ventasMap={}; let pagosMap={};

  try{
    const snapAdmin = await get(child(ref(dbAliados), "doloya_aliados/admin"));
    if(snapAdmin.exists()){
      const data=snapAdmin.val();
      for(let k in data){
        const val=data[k]; const info=val.info||{};
        mapa[k]={
          id: info.id||k,
          key: k,
          nombre: info.nombre||limpiarNombre(k),
          logo: info.imagen||info.logo||"",
          direccion: info.direccion||"",
          abierto: val.abierto,
          estado: val.estado||info.estado||"activo",
          totalVentas:0, desglose:0, pagado:0, pendiente:0, ultimoPago:"", facturas:0
        };
      }
    }
  }catch(e){ console.log(e); }

  try{
    const snapVentas = await getDocs(collection(dbHis, "pedidos_entregados"));
    snapVentas.forEach(d=>{
      const p=d.data(); const r=p.restaurante||{}; const idR=(r.id||r.nombre||"").toLowerCase();
      let key=null;
      for(let k in mapa){
        if(k.toLowerCase()===idR || (mapa[k].nombre||"").toLowerCase()===idR || limpiarNombre(k).toLowerCase()===idR){
          key=k; break;
        }
      }
      if(key){
        if(!ventasMap[key]) ventasMap[key]={total:0};
        ventasMap[key].total += Number(p.totales?.costoProductos||0);
      }
    });
  }catch(e){ console.log(e); }

  try{
    const snapPagos = await getDocs(collection(dbHis, "pagos_aliados"));
    snapPagos.forEach(d=>{
      const p=d.data(); const idR=(p.restauranteId||"").toLowerCase();
      let key=null;
      for(let k in mapa){
        if(k.toLowerCase()===idR || (mapa[k].nombre||"").toLowerCase()===idR){
          key=k; break;
        }
      }
      if(key){
        if(!pagosMap[key]) pagosMap[key]={pagado:0, ultimo:"", count:0};
        pagosMap[key].pagado += Number(p.montoPagado||0);
        pagosMap[key].count += 1;
        if(!pagosMap[key].ultimo || new Date(p.fechaPago) > new Date(pagosMap[key].ultimo)) pagosMap[key].ultimo=p.fechaPago;
      }
    });
  }catch(e){ console.log(e); }

  for(let k in mapa){
    const v=ventasMap[k]?.total||0;
    const des=v*0.9;
    const pag=pagosMap[k]?.pagado||0;
    mapa[k].totalVentas=v;
    mapa[k].desglose=des;
    mapa[k].pagado=pag;
    mapa[k].pendiente=Math.max(0, des-pag);
    mapa[k].ultimoPago=pagosMap[k]?.ultimo||"";
    mapa[k].facturas=pagosMap[k]?.count||0;
  }

  aliados=Object.values(mapa).sort((a,b)=> a.nombre.toLowerCase().localeCompare(b.nombre.toLowerCase()));
  filtrados=[...aliados];
  render();
}

function render(){
  const cont=document.getElementById('listaAliados');
  if(filtrados.length===0){ cont.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">No hay restaurantes en doloya_aliados/admin</div>'; return; }

  const totalPagados=filtrados.reduce((s,a)=>s+a.pagado,0);
  const totalPend=filtrados.reduce((s,a)=>s+a.pendiente,0);
  const totalRest=filtrados.length;
  const abiertos=filtrados.filter(a=>a.abierto===true).length;
  const cerrados=filtrados.filter(a=>a.abierto===false).length;
  const factPend=filtrados.filter(a=>a.pendiente>0).length;

  document.getElementById('kPagados').textContent="$ "+totalPagados.toFixed(2);
  document.getElementById('kPendiente').textContent="$ "+totalPend.toFixed(2);
  document.getElementById('kTotalRest').textContent=totalRest;
  document.getElementById('kFactPend').textContent=factPend;
  document.getElementById('rTotal').textContent=totalRest;
  document.getElementById('rAbiertos').textContent=abiertos;
  document.getElementById('rCerrados').textContent=cerrados;

  cont.innerHTML="";
  filtrados.forEach(a=>{
    const logoHtml=a.logo?`<img src="${a.logo}">`:limpiarNombre(a.nombre)[0].toUpperCase();
    const ultimo=a.ultimoPago?fechaHora(a.ultimoPago):"-";
    const estadoTxt=a.abierto===true?"Abierto":a.abierto===false?"Cerrado":a.estado;
    const badgeClass=a.abierto===true?"badge-green":"badge-red";
    cont.innerHTML+=`
    <div class="table-row">
      <div class="aliado"><div class="aliado-logo">${logoHtml}</div><div><div style="font-weight:700;font-size:11px;text-transform:capitalize">${limpiarNombre(a.nombre)}</div><div style="font-size:9px;color:#64748b">${a.direccion}</div></div></div>
      <div style="font-weight:600">$ ${a.totalVentas.toFixed(2)}</div>
      <div style="font-weight:600">$ ${a.desglose.toFixed(2)}</div>
      <div style="color:#16a34a;font-weight:600">$ ${a.pagado.toFixed(2)}</div>
      <div style="color:#d97706;font-weight:600">$ ${a.pendiente.toFixed(2)}</div>
      <div style="font-size:10px">${ultimo}</div>
      <div style="font-size:10px">${a.facturas}</div>
      <div><span class="badge ${badgeClass}">${estadoTxt}</span></div>
      <div><button class="btn-ver" onclick="location.href='paneladmin-pagosyfacturas-consultar.html?id=${a.key}'">Consultar</button></div>
    </div>`;
  });
}

window.filtrar=()=>{
  const txt=document.getElementById('buscar').value.toLowerCase();
  const est=document.getElementById('fEstado').value;
  filtrados=aliados.filter(a=>{
    const matchTxt=limpiarNombre(a.nombre).toLowerCase().includes(txt) || a.key.toLowerCase().includes(txt);
    let matchEst=true;
    if(est==="abierto") matchEst=a.abierto===true;
    else if(est==="cerrado") matchEst=a.abierto===false;
    return matchTxt && matchEst;
  });
  render();
};

cargar();
</script>
</body>
</html>
