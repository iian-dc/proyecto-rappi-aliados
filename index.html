<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#CF0A2C;min-height:100vh;display:flex;justify-content:center}
.container{width:100%;max-width:420px;min-height:100vh;padding:30px 22px 20px;display:flex;flex-direction:column;align-items:center}
.logo-D{font-weight:900;font-size:96px;color:white;letter-spacing:-4px;position:relative;display:inline-block}
.logo-D::after{content:'';position:absolute;left:-8px;top:42%;width:88%;height:4px;background:white;transform:rotate(-10deg)}
.logo-text{font-size:42px;font-weight:900;color:white;margin-top:-6px;font-style:italic}
.title{color:white;font-size:31px;font-weight:800;text-align:center;margin-top:22px}
.subtitle{color:white;font-size:16px;text-align:center;margin-top:6px;opacity:.95}
.ilustracion{margin:24px 0 28px;width:100%;max-width:310px}
.input-box{width:100%;background:white;border-radius:999px;display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:14px}
.input-box input{border:none;outline:none;width:100%;font-size:15px;font-weight:700;color:#111;background:transparent}
.forgot{width:100%;text-align:right;color:white;font-size:13px;font-weight:600;margin:-2px 6px 18px 0}
.btn-login{width:100%;background:white;border:none;border-radius:999px;padding:15px;font-size:19px;font-weight:800;color:#CF0A2C;cursor:pointer}
.error-msg{background:white;color:#CF0A2C;font-size:13px;font-weight:700;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;width:100%;display:none}
.terms{color:white;font-size:10.5px;text-align:center;margin-top:14px;opacity:.9}
</style>
</head>
<body>
<div class="container">
  <div style="text-align:center"><div class="logo-D">D</div><div class="logo-text">DoloYa</div></div>
  <h1 class="title">¡Bienvenido, aliado!</h1>
  <p class="subtitle">Administra tu negocio y recibe pedidos desde DoloYa</p>
  <div class="ilustracion"><svg viewBox="0 0 300 130" fill="none"><path d="M60 118 L240 118" stroke="white" stroke-width="3"/><rect x="96" y="35" width="108" height="83" rx="2" stroke="white" stroke-width="3" fill="none"/></svg></div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="input-box">
    <svg width="28" height="20" viewBox="0 0 28 20" fill="none"><rect x="1" y="1" width="26" height="18" rx="4" fill="#CF0A2C"/><path d="M2 3 L14 11 L26 3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <input id="txtUsuario" type="text" placeholder="Correo electrónico">
  </div>
  <div class="input-box">
    <svg width="24" height="26" viewBox="0 0 24 26" fill="none"><rect x="2" y="11" width="20" height="13" rx="3" fill="#CF0A2C"/><path d="M7 11 V7 A5 5 0 0 1 17 7 V11" stroke="#CF0A2C" stroke-width="2.5" fill="none"/></svg>
    <input id="txtPass" type="password" placeholder="Contraseña">
  </div>
  <div class="forgot">¿Olvidaste tu contraseña?</div>
  <button class="btn-login" id="btnLogin" onclick="iniciarSesion()">Iniciar sesión</button>
  <p class="terms">Al continuar, aceptas nuestros términos y políticas de privacidad</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.iniciarSesion = async function(){
  const user = document.getElementById('txtUsuario').value.trim().toLowerCase();
  const pass = document.getElementById('txtPass').value.trim();
  const errorBox = document.getElementById('errorMsg');

  if(!user || !pass){
    errorBox.style.display='block';
    errorBox.textContent='Ingresa usuario y contraseña';
    return;
  }

  // ADMIN - RUTA INDEPENDIENTE A PANELADMIN
  if(user === 'admin' && pass === '0831'){
    localStorage.setItem('doloya_aliado_sesion', JSON.stringify({ rol:'administrador', usuario:'admin', codigo:'index', id:'admin', nombre:'Admin' }));
    window.location.href='paneladmin.html';
    return;
  }

  try{
    const snapshot = await get(ref(db, 'doloya_aliados'));
    if(snapshot.exists()){
      const datos = snapshot.val();

      function checarLogin(nodo, idNodo){
        if(!nodo || typeof nodo !== 'object') return null;
        let info = nodo.info ? nodo.info : nodo;
        if(!info || typeof info !== 'object') return null;
        if(!info.usuario && !info.correo && !info.email && !idNodo) return null;

        const u = String(info.usuario || '').trim().toLowerCase();
        const e = String(info.correo || info.email || '').trim().toLowerCase();
        const id = String(idNodo || info.id || '').trim().toLowerCase();

        const p1 = String(info.password || '').trim();
        const p2 = String(info.contraseña || '').trim();
        const p3 = String(info.contrasena || '').trim();

        const userMatch = (u && u === user) || (e && e === user) || (id && id === user);
        const passMatch = (p1 && p1 === pass) || (p2 && p2 === pass) || (p3 && p3 === pass);

        if(userMatch && passMatch){
          return { info, idReal: info.id || idNodo, nodoCompleto: nodo };
        }
        return null;
      }

      function guardarSesion(encontrado, nodoCompleto){
        const { info, idReal } = encontrado;
        const disponibilidad = nodoCompleto.disponibilidad || nodoCompleto.categorias?.disponibilidad || {};
        localStorage.setItem('doloya_aliado_sesion', JSON.stringify({ 
          rol: info.rol || 'aliado', 
          usuario: info.usuario || idReal, 
          contraseña: pass,
          codigo:'index', 
          id: idReal, 
          nombre: info.nombre || idReal,
          negocio: idReal,
          categoria: info.categoria || 'general',
          correo: info.correo || info.email || '',
          telefono: info.telefono || '',
          direccion: info.direccion || '',
          imagen: info.imagen || '',
          estado: disponibilidad.estado || 'activo',
          abierto: disponibilidad.abierto !== false
        }));
        window.location.href='panelaliado.html';
      }

      for(const idRestaurante in datos){
        const nodo = datos[idRestaurante];
        if(!nodo) continue;

        // 1. Busca aliados independientes en la raiz: doloya_aliados/nice_food , doloya_aliados/santillos
        let res = checarLogin(nodo, idRestaurante);
        if(res){
          guardarSesion(res, nodo);
          return;
        }

        // 2. Si quedo anidado dentro de admin (caso viejo), tambien lo encuentra: doloya_aliados/admin/nice_food
        if(typeof nodo === 'object'){
          for(const subId in nodo){
            if(['info','perfil','categorias','disponibilidad','menu','carritos','likes','id','nombre','rol'].includes(subId)) continue;
            const subNodo = nodo[subId];
            if(!subNodo || typeof subNodo !== 'object') continue;
            let resSub = checarLogin(subNodo, subId);
            if(resSub){
              guardarSesion(resSub, subNodo);
              return;
            }
          }
        }
      }
    }
  }catch(e){ console.log(e); }

  errorBox.style.display='block';
  errorBox.textContent='Usuario o contraseña incorrectos';
}
</script>
</body>
</html>
