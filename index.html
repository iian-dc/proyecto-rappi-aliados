<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DoloYa - Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Helvetica,Arial,sans-serif}
body{background:#CF0A2C;min-height:100vh;display:flex;justify-content:center}
.container{width:100%;max-width:420px;min-height:100vh;padding:30px 22px 20px;display:flex;flex-direction:column;align-items:center}
.logo-wrap{margin-top:18px;text-align:center}
.logo-D{font-weight:900;font-size:96px;line-height:0.9;color:white;letter-spacing:-4px;position:relative;display:inline-block}
.logo-D::after{content:'';position:absolute;left:-8px;top:42%;width:88%;height:4px;background:white;transform:rotate(-10deg)}
.logo-text{font-size:42px;font-weight:900;color:white;margin-top:-6px;letter-spacing:-1px;font-style:italic}
.title{color:white;font-size:31px;font-weight:800;text-align:center;margin-top:22px;line-height:1.1}
.subtitle{color:white;font-size:16.5px;font-weight:400;text-align:center;margin-top:6px;line-height:1.25;opacity:0.95}
.ilustracion{margin:24px 0 28px;width:100%;max-width:310px}
.ilustracion svg{width:100%;height:auto}
.input-box{width:100%;background:white;border-radius:999px;display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,0.08)}
.input-box input{border:none;outline:none;width:100%;font-size:15px;font-weight:700;color:#111;background:transparent}
.input-box input::placeholder{color:#111;font-weight:700}
.forgot{width:100%;text-align:right;color:white;font-size:13px;font-weight:600;margin:-2px 6px 18px 0;cursor:pointer}
.btn-login{width:100%;background:white;border:none;border-radius:999px;padding:15px;font-size:19px;font-weight:800;color:#CF0A2C;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.1);margin-top:4px}
.btn-login:active{transform:scale(0.98)}
.terms{color:white;font-size:10.5px;text-align:center;margin-top:14px;opacity:0.9;line-height:1.3;padding:0 10px}
.error-msg{background:white;color:#CF0A2C;font-size:13px;font-weight:700;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;width:100%;display:none}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-D">D</div>
    <div class="logo-text">DoloYa</div>
  </div>
  <h1 class="title">¡Bienvenido, aliado!</h1>
  <p class="subtitle">Administra tu negocio y recibe pedidos<br>desde DoloYa</p>

  <div class="ilustracion">
    <svg viewBox="0 0 300 130" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 118 L240 118" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <path d="M48 70 Q48 55 60 55 Q72 55 72 70 L72 115 L36 115 L36 70 Z" stroke="white" stroke-width="3" fill="none"/>
      <path d="M50 70 Q50 50 60 48 Q70 50 68 70" stroke="white" stroke-width="3" fill="none"/>
      <rect x="96" y="35" width="108" height="83" rx="2" stroke="white" stroke-width="3" fill="none"/>
      <rect x="90" y="20" width="120" height="18" rx="8" stroke="white" stroke-width="3" fill="none"/>
      <path d="M95 38 Q102 58 112 38 Q122 58 132 38 Q142 58 152 38 Q162 58 172 38 Q182 58 192 38 Q202 58 205 38" stroke="white" stroke-width="3" fill="white"/>
      <rect x="106" y="70" width="44" height="32" stroke="white" stroke-width="2.5" fill="none"/>
      <rect x="160" y="70" width="28" height="45" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M70 45 L58 62 M78 55 L62 60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M230 45 L242 62 M222 55 L238 60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M235 50 Q250 50 250 68 Q250 90 235 104 Q220 90 220 68 Q220 50 235 50 Z" fill="white"/>
      <circle cx="235" cy="69" r="10" fill="#CF0A2C"/>
    </svg>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="input-box">
    <!-- ICONO CORREO IGUAL A LA IMAGEN -->
    <svg width="28" height="20" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="26" height="18" rx="4" fill="#CF0A2C"/>
      <path d="M2 3 L14 11 L26 3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1" y="1" width="26" height="18" rx="4" stroke="#CF0A2C" stroke-width="0.5"/>
    </svg>
    <input id="txtUsuario" type="text" placeholder="Correo electrónico" autocomplete="off">
  </div>

  <div class="input-box">
    <!-- ICONO CANDADO IGUAL A LA IMAGEN -->
    <svg width="24" height="26" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="11" width="20" height="13" rx="3" fill="#CF0A2C"/>
      <path d="M7 11 V7 A5 5 0 0 1 17 7 V11" stroke="#CF0A2C" stroke-width="2.5" fill="none"/>
      <circle cx="12" cy="17.5" r="1.8" fill="white"/>
      <path d="M12 19.3 L12 21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input id="txtPass" type="password" placeholder="Contraseña">
  </div>

  <div class="forgot" onclick="olvido()">¿Olvidaste tu contraseña?</div>
  <button class="btn-login" id="btnLogin" onclick="iniciarSesion()">Iniciar sesión</button>
  <p class="terms">Al continuar, aceptas nuestros términos y políticas de privacidad</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059",
  measurementId: "G-5HETSEL4PT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.iniciarSesion = async function(){
  const userInput = document.getElementById('txtUsuario').value.trim();
  const passInput = document.getElementById('txtPass').value.trim();
  const errorBox = document.getElementById('errorMsg');
  const btn = document.getElementById('btnLogin');

  if(!userInput || !passInput){
    errorBox.style.display='block';
    errorBox.textContent='Ingresa correo y contraseña';
    return;
  }

  btn.textContent='Ingresando...';
  btn.disabled=true;
  errorBox.style.display='none';

  // CODIGO = index - ADMIN
  if(userInput.toLowerCase() === 'admin' && passInput === '0831'){
    localStorage.setItem('doloya_aliado_sesion', JSON.stringify({
      rol:'administrador',
      usuario:'admin',
      codigo:'index',
      nombre:'Administrador DoloYa',
      id:'admin',
      loginAt: Date.now()
    }));
    window.location.href='panelaliado.html';
    return;
  }

  try{
    const colRef = collection(db, "doloya_aliados");
    let snap = null;
    let encontrado = null;

    // 1. Buscar por usuario = aliado (para todos los restaurantes vinculados)
    if(userInput.toLowerCase() === 'aliado'){
      // vinculacion automatica: todos los que ya existen les asignamos credenciales aliado/1234 rol aliado
      let q = query(colRef);
      snap = await getDocs(q);
      
      // Si hay restaurantes, les actualizamos usuario/contraseña/rol si no lo tienen
      for(const d of snap.docs){
        const data = d.data();
        if(!data.usuario || !data.contraseña || !data.rol){
          try{
            await updateDoc(doc(db, "doloya_aliados", d.id), {
              usuario: 'aliado',
              contraseña: '1234',
              rol: 'aliado'
            });
          }catch(e){}
        }
      }

      // Validar contraseña 1234 para aliado
      if(passInput === '1234' && !snap.empty){
        const first = snap.docs[0].data();
        encontrado = { id: snap.docs[0].id, ...first, usuario:'aliado', contraseña:'1234', rol:'aliado' };
      }
    }

    // 2. Si no es aliado generico, buscar por usuario/email especifico en doloya_aliados
    if(!encontrado){
      let q1 = query(colRef, where("usuario", "==", userInput));
      let s1 = await getDocs(q1);
      if(!s1.empty){
        s1.forEach(ds=>{
          const data=ds.data();
          const passDb = data.contraseña || data.contrasena || data.password;
          if(passDb === passInput || (userInput==='aliado' && passInput==='1234')){
            encontrado={id:ds.id,...data};
          }
        });
      }
      if(!encontrado){
        let q2 = query(colRef, where("email", "==", userInput));
        let s2 = await getDocs(q2);
        s2.forEach(ds=>{
          const data=ds.data();
          const passDb = data.contraseña || data.contrasena || data.password;
          if(passDb === passInput){
            encontrado={id:ds.id,...data};
          }
        });
      }
    }

    if(encontrado){
      localStorage.setItem('doloya_aliado_sesion', JSON.stringify({
        rol: encontrado.rol || 'aliado',
        usuario: encontrado.usuario || 'aliado',
        codigo: encontrado.codigo || 'index',
        id: encontrado.id,
        nombre: encontrado.nombre || encontrado.nombreRestaurante || 'Aliado',
        data: encontrado,
        loginAt: Date.now()
      }));
      window.location.href='panelaliado.html';
    }else{
      errorBox.style.display='block';
      errorBox.textContent='Usuario o contraseña incorrectos';
      btn.textContent='Iniciar sesión';
      btn.disabled=false;
    }
  }catch(e){
    console.error(e);
    errorBox.style.display='block';
    errorBox.textContent='Error: '+e.message;
    btn.textContent='Iniciar sesión';
    btn.disabled=false;
  }
}

window.olvido = function(){
  alert('Contacta al administrador DoloYa');
}
</script>
</body>
</html>
