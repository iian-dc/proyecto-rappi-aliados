<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#CF0A2C;min-height:100vh;display:flex;justify-content:center}
.container{width:100%;max-width:420px;min-height:100vh;padding:22px 22px 20px;display:flex;flex-direction:column;align-items:center}
.logo-panel{width:100%;display:flex;justify-content:center;align-items:center;padding:10px 0 8px}
.logo-panel img{width:168px;height:auto;object-fit:contain;display:block}
.title{color:white;font-size:31px;font-weight:800;text-align:center;margin-top:18px}
.subtitle{color:white;font-size:16px;text-align:center;margin-top:6px;opacity:.95;line-height:1.3;margin-bottom:28px}
.error-msg{background:white;color:#CF0A2C;font-size:13px;font-weight:700;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;width:100%;display:none}
.input-box{width:100%;background:white;border-radius:999px;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;margin-bottom:14px;position:relative}
.input-box input{border:none;outline:none;width:100%;font-size:15px;font-weight:700;color:#111;background:transparent;flex:1;min-width:0;padding-right:4px}
.input-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:28px;height:28px;border-radius:50%;border:none;background:rgba(207,10,44,0.08);display:none;align-items:center;justify-content:center;cursor:pointer;transition:0.2s}
.icon-btn.show{display:flex}
.icon-btn:hover{background:rgba(207,10,44,0.15)}
.forgot{width:100%;text-align:right;color:white;font-size:13px;font-weight:600;margin:-2px 6px 18px 0;cursor:pointer;text-decoration:underline}
.btn-login{width:100%;background:white;border:none;border-radius:999px;padding:15px;font-size:19px;font-weight:800;color:#CF0A2C;cursor:pointer}
.terms{color:white;font-size:10.5px;text-align:center;margin-top:14px;opacity:.9}

/* MODAL OLVIDO CONTRASEÑA PANTALLA COMPLETA */
.modal-olvido{position:fixed;inset:0;background:#CF0A2C;z-index:500;display:none;flex-direction:column;overflow:auto}
.modal-olvido.show{display:flex}
.modal-olvido-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:#CF0A2C;position:sticky;top:0}
.modal-olvido-header h2{color:white;font-size:18px;font-weight:800}
.btn-cerrar-modal{width:36px;height:36px;border-radius:50%;background:white;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-olvido-body{flex:1;padding:20px 22px 30px;display:flex;flex-direction:column;align-items:center}
.modal-card{background:white;border-radius:22px;padding:22px 18px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.modal-card h3{font-size:18px;font-weight:800;color:#111;text-align:center;margin-bottom:6px}
.modal-card p{font-size:13px;color:#64748b;text-align:center;margin-bottom:18px;line-height:1.4}
.modal-input{width:100%;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:600;outline:none;margin-bottom:12px;color:#111}
.modal-input:focus{border-color:#CF0A2C;background:white}
.modal-label{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;margin-left:4px;display:block}
.btn-whatsapp{width:100%;background:#25D366;border:none;border-radius:999px;padding:14px;font-size:15px;font-weight:800;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;box-shadow:0 4px 12px rgba(37,211,102,0.3)}
</style>
</head>
<body>
<div class="container">
  <div class="logo-panel">
    <img src="LOGO-PANEL.PNG" alt="DoloYa">
  </div>

  <h1 class="title">¡Bienvenido, aliado!</h1>
  <p class="subtitle">Administra tu negocio y recibe pedidos desde DoloYa</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="input-box">
    <svg width="28" height="20" viewBox="0 0 28 20" fill="none" style="flex-shrink:0"><rect x="1" y="1" width="26" height="18" rx="4" fill="#CF0A2C"/><path d="M2 3 L14 11 L26 3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <input id="txtUsuario" type="text" placeholder="Correo electrónico" autocomplete="email" oninput="toggleClear('txtUsuario','clearUsuario')">
    <div class="input-actions">
      <button type="button" class="icon-btn" id="clearUsuario" onclick="clearInput('txtUsuario','clearUsuario')" aria-label="Borrar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CF0A2C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
      </button>
    </div>
  </div>

  <div class="input-box">
    <svg width="24" height="26" viewBox="0 0 24 26" fill="none" style="flex-shrink:0"><rect x="2" y="11" width="20" height="13" rx="3" fill="#CF0A2C"/><path d="M7 11 V7 A5 5 0 0 1 17 7 V11" stroke="#CF0A2C" stroke-width="2.5" fill="none"/></svg>
    <input id="txtPass" type="password" placeholder="Contraseña" autocomplete="current-password" oninput="toggleClearPass()">
    <div class="input-actions">
      <button type="button" class="icon-btn" id="clearPass" onclick="clearInput('txtPass','clearPass')" aria-label="Borrar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CF0A2C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
      </button>
      <button type="button" class="icon-btn show" id="togglePass" onclick="togglePassword()" aria-label="Mostrar contraseña">
        <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CF0A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CF0A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
  </div>

  <div class="forgot" onclick="abrirOlvido()">¿Olvidaste tu contraseña?</div>
  <button class="btn-login" id="btnLogin" onclick="iniciarSesion()">Iniciar sesión</button>
  <p class="terms">Al continuar, aceptas nuestros términos y políticas de privacidad</p>
</div>

<!-- FORMULARIO OLVIDO CONTRASEÑA -->
<div class="modal-olvido" id="modalOlvido">
  <div class="modal-olvido-header">
    <h2>Recuperar contraseña</h2>
    <button class="btn-cerrar-modal" onclick="cerrarOlvido()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CF0A2C" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-olvido-body">
    <div class="modal-card">
      <h3>¿Olvidaste tu contraseña?</h3>
      <p>Completa el formulario y te ayudamos a recuperarla por WhatsApp</p>
      
      <label class="modal-label">Correo electrónico</label>
      <input id="recCorreo" class="modal-input" type="email" placeholder="tu correo @ ejemplo.com">
      
      <label class="modal-label">Número de WhatsApp</label>
      <input id="recWhatsapp" class="modal-input" type="tel" placeholder="Ej: 300 123 4567">
      
      <label class="modal-label">Nombre del cliente / Negocio</label>
      <input id="recCliente" class="modal-input" type="text" placeholder="Ej: Alitas Factory">

      <button class="btn-whatsapp" onclick="enviarWhatsApp()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19.05 4.94A9.82 9.82 0 0 0 12 0C6.48 0 2 4.48 2 10a9.9 9.9 0 0 0 1.32 4.96L0 24l9.26-2.43A9.92 9.92 0 0 0 12 20c5.52 0 10-4.48 10-10 0-2.67-1.04-5.18-2.95-7.06zM12 18a7.9 7.9 0 0 1-4.03-1.1l-.29-.17-5.5 1.44 1.47-5.36-.19-.31A7.92 7.92 0 0 1 4 10c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.47-5.88c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.19-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.1-.1.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.39-.4-.54-.41l-.46-.01c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.09.16 1.5.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
        Enviar a WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
const NUMERO_WHATSAPP = "524181083793"; // CAMBIA AQUI TU NUMERO CON CODIGO PAIS SIN +

function toggleClear(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if(input.value.length > 0){ btn.classList.add('show'); } else { btn.classList.remove('show'); }
}
function toggleClearPass(){
  const input = document.getElementById('txtPass');
  const btnClear = document.getElementById('clearPass');
  if(input.value.length > 0){ btnClear.classList.add('show'); } else { btnClear.classList.remove('show'); }
}
function clearInput(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  input.value = '';
  btn.classList.remove('show');
  input.focus();
  if(inputId === 'txtPass') toggleClearPass();
}
function togglePassword(){
  const input = document.getElementById('txtPass');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');
  if(input.type === 'password'){
    input.type = 'text';
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}
function abrirOlvido(){ document.getElementById('modalOlvido').classList.add('show'); }
function cerrarOlvido(){ document.getElementById('modalOlvido').classList.remove('show'); }
function enviarWhatsApp(){
  const correo = document.getElementById('recCorreo').value.trim();
  const wsp = document.getElementById('recWhatsapp').value.trim();
  const cliente = document.getElementById('recCliente').value.trim();
  if(!correo || !wsp || !cliente){
    alert('Por favor completa todos los campos: correo, WhatsApp y cliente');
    return;
  }
  const mensaje = `Hola DoloYa, olvidé mi contraseña, me ayudas a recuperarla?%0A%0A*Datos para recuperación:*%0A📧 Correo: ${encodeURIComponent(correo)}%0A📱 WhatsApp: ${encodeURIComponent(wsp)}%0A🏪 Cliente/Negocio: ${encodeURIComponent(cliente)}%0A%0AGracias.`;
  const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
  window.open(url, '_blank');
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.iniciarSesion = async function(){
  const user = document.getElementById('txtUsuario').value.trim().toLowerCase();
  const pass = document.getElementById('txtPass').value.trim();
  const errorBox = document.getElementById('errorMsg');
  if(!user || !pass){
    errorBox.style.display='block';
    errorBox.textContent='Ingresa usuario y contraseña';
    return;
  }
  if(user === 'admin' && pass === '0831'){
    localStorage.setItem('doloya_aliado_sesion', JSON.stringify({ rol:'administrador', usuario:'admin', id:'admin', nombre:'Admin' }));
    window.location.href='paneladmin.html';
    return;
  }
  try{
    const snap = await get(ref(db, 'doloya_aliados'));
    if(!snap.exists()){
      errorBox.style.display='block';
      errorBox.textContent='No hay aliados en la base';
      return;
    }
    const datos = snap.val();
    for(const key in datos){
      if(key === 'admin') continue;
      const nodo = datos[key];
      if(!nodo || !nodo.info) continue;
      const info = nodo.info;
      const u = String(info.usuario||'').trim().toLowerCase();
      const e = String(info.correo||'').trim().toLowerCase();
      const id = String(key||'').trim().toLowerCase();
      const idInfo = String(info.id||'').trim().toLowerCase();
      const p1 = String(info.password||'').trim();
      const p2 = String(info.contraseña||'').trim();
      const okUser = (u===user || e===user || id===user || idInfo===user);
      const okPass = (p1===pass || p2===pass);
      if(okUser && okPass){
        localStorage.setItem('doloya_aliado_sesion', JSON.stringify({
          rol:'aliado',
          usuario: info.usuario,
          id: info.id || key,
          nombre: info.nombre || key,
          negocio: key,
          categoria: info.categoria || 'general',
          correo: info.correo || '',
          telefono: info.telefono || ''
        }));
        window.location.href='panelaliado.html';
        return;
      }
    }
  }catch(e){
    errorBox.style.display='block';
    errorBox.textContent='Error: ' + e.message;
    return;
  }
  errorBox.style.display='block';
  errorBox.textContent='Usuario o contraseña incorrectos.';
}
</script>
</body>
</html>
