<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f8f9;min-height:100vh}
:root{--rojo:#C50D1F}
.header{height:64px;background:white;border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}
.h-left{display:flex;align-items:center;gap:16px}
.btn-x{width:36px;height:36px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer;text-decoration:none;font-size:20px;font-weight:700}
.h-left h1{font-size:20px;font-weight:800}
.h-right{display:flex;align-items:center;gap:14px}
.bell{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.bell.vibrar{animation:bell3d .15s infinite}
@keyframes bell3d{0%{transform:rotate(-12deg) scale(1.1)}25%{transform:rotate(12deg) scale(1.25)}50%{transform:rotate(-10deg) scale(1.15)}75%{transform:rotate(10deg) scale(1.25)}100%{transform:rotate(-12deg) scale(1.1)}}
.chip-rest{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:12px;padding:18px 20px;flex-wrap:wrap}
.tab{border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;border:1px solid #e5e7eb;background:#f1f2f4;color:#6b7280;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.active{background:var(--rojo);color:white;border-color:var(--rojo)}
.tab span.count{background:white;color:#111;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 6px}
.container{padding:0 20px 20px}
.card{position:relative;background:white;border-radius:16px;border:1px solid #ececec;overflow:hidden;margin-bottom:14px;display:flex;flex-direction:row;transition:.3s}
.card.aceptado{background:#E8F5E9;border-color:#16a34a;box-shadow:0 0 0 2px #16a34a inset}
.card.preparando{background:#FFEB3B;border-color:#FACC15;box-shadow:0 0 22px rgba(250,204,21,0.8)}
.card-left{flex:1.2;padding:18px;display:flex;flex-direction:column;gap:14px}
.card-center{width:1px;background:#f0f0f0;margin:16px 0}
.card-right{flex:1;padding:18px}
.badge-nuevo{background:var(--rojo);color:white;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;gap:6px;width:fit-content;text-transform:uppercase}
.badge-nuevo.verde{background:#16a34a}
.badge-nuevo.amarillo{background:#111;color:#FFEB3B}
.dot{width:8px;height:8px;background:white;border-radius:50%;display:inline-block}
.cliente{display:flex;gap:12px}
.avatar{width:42px;height:42px;background:#f1f2f4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.referencia{display:flex;gap:10px;background:#fafafa;border-radius:10px;padding:10px;border:1px solid #f0f0f0}
.card.aceptado .referencia{background:#ffffffc7}
.card.preparando .referencia{background:#FFF9C4}
.stats{display:flex;gap:12px}
.prod-head{display:flex;justify-content:space-between;align-items:center}
.prod-head #num{font-size:20px;font-weight:900;letter-spacing:1px}
.prod-list{margin:12px 0;border-bottom:1px solid #f0f0f0;padding-bottom:10px}
.prod-item{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.precio-desc{color:#16a34a;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:11px 18px;font-size:12.5px;font-weight:800;cursor:pointer;color:white;display:flex;align-items:center;gap:6px}
.btn-verde{background:#16a34a}
.btn-amarillo{background:#111;color:#FFEB3B}
.btn:disabled{opacity:.4}
.overlay-preg{display:none;position:absolute;inset:0;background:rgba(255,235,59,0.94);z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.card.preparando .overlay-preg{display:flex}
.overlay-preg h3{font-size:18px;font-weight:900;line-height:1.3;color:#111;margin-bottom:16px}
.btn-si{background:#16a34a;color:white;padding:11px 30px;border-radius:999px;border:none;font-weight:900;cursor:pointer;font-size:14px}
.btn-no{background:white;color:#111;padding:11px 30px;border-radius:999px;border:2px solid #111;font-weight:900;cursor:pointer;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:#9ca3af}
@media(max-width:800px){.card{flex-direction:column}.card-center{display:none}}
</style>
</head>
<body>

<div class="header">
  <div class="h-left">
    <a href="panelaliado.html" class="btn-x">✕</a>
    <h1>Pedidos</h1>
  </div>
  <div class="h-right">
    <div class="bell" id="bellIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C50D1F" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/></svg></div>
    <div class="chip-rest"><div><b id="restName">La Catrina Burger</b><small style="color:#22c55e">● En línea</small></div></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-f="todos">Todos <span class="count" id="c-todos">0</span></button>
  <button class="tab" data-f="nuevo">Nuevos <span class="count" id="c-nuevo">0</span></button>
  <button class="tab" data-f="aceptado">Aceptados <span class="count" id="c-aceptado">0</span></button>
  <button class="tab" data-f="en_preparacion">En preparación <span class="count" id="c-prep">0</span></button>
  <button class="tab" data-f="listo">Listos <span class="count" id="c-listo">0</span></button>
</div>

<div class="container" id="listaPedidos"><div class="empty">Cargando pedidos...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);

const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
const idNegocio = sesion?.id || sesion?.negocio || 'burgers';
const mapaCat = { alitas:'alitas', burgers:'burgers', pizzas:'pizzas' };
const catBuscada = mapaCat[idNegocio] || idNegocio;
const restName = document.getElementById('restName');
if(sesion?.nombreReal) restName.textContent = sesion.nombreReal;

const bell = document.getElementById('bellIcon');
let primerCarga=true, ultimoTotal=0, pedidosCache=[], filtroActual='todos';

function sonarDoloYa(){
  bell.classList.add('vibrar'); setTimeout(()=>bell.classList.remove('vibrar'),3000);
  try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance("¡DoloYa! ¡DoloYa! ¡DoloYa! ¡Pedido! ¡Pedido! ¡Pedido!"); u.lang='es-MX'; u.rate=1.25; u.pitch=1.4; window.speechSynthesis.speak(u);}catch{}
}
document.body.addEventListener('click', ()=>{ try{ new (window.AudioContext||window.webkitAudioContext)().resume(); }catch{} }, {once:true});
document.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click', ()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); filtroActual=t.dataset.f; render(pedidosCache); }); });

function render(lista){
  const cont=document.getElementById('listaPedidos');
  const filtrados=filtroActual==='todos'?lista:lista.filter(p=> (p.estado||'nuevo')===filtroActual);
  if(filtrados.length===0){ cont.innerHTML='<div class="empty">No hay pedidos en '+filtroActual+'</div>'; return; }
  cont.innerHTML='';
  filtrados.forEach((p)=>{
    const productos=p.productos||[];
    const totales=p.totales||{};
    
    // COSTO PRODUCTO REAL DE FIRESTORE
    let costoProductos = totales.costoProductos || 0;
    if(!costoProductos){
      productos.forEach(pr=>{ costoProductos+= (pr.cantidad||1)*parseFloat(pr.precio||0); });
    }
    const costoConDescuento = (parseFloat(costoProductos)*0.9).toFixed(2);

    // CLIENTE REAL DE FIRESTORE
    const nombreCliente = p.nombre || p.cliente?.celular || p.detalles?.direccion || p.telefono || 'Cliente';
    const clienteReal = p.nombre || p.detalles?.nombre || p.detalles?.direccion || p.cliente?.celular || 'iian';
    const nombreFinal = p.nombre || p.detalles?.nombre || p.detalles?.nombreEdificio || 'Cliente';
    
    // REFERENCIA REAL
    const referenciaReal = p.referencia || p.detalles?.referencia || p.direccion || 'Casa...';

    // CODIGO REAL = NUMERO DE PEDIDO EXACTO DE FIRESTORE
    const codigoReal = p.codigo || p.id.substring(0,6).toUpperCase() || 'ST-00';

    // HORA REAL
    let horaReal = 'Hoy';
    if(p.timestamp?.seconds) horaReal = new Date(p.timestamp.seconds*1000).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true});
    else if(p.fecha) horaReal = new Date(p.fecha).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});

    const estado = p.estado || 'nuevo';
    const claseEstado = estado==='aceptado'?'aceptado':estado==='en_preparacion'?'preparando':'';
    const badgeClass = estado==='nuevo'?'badge-nuevo':estado==='aceptado'?'badge-nuevo verde':'badge-nuevo amarillo';
    const badgeText = estado==='nuevo'?'Nuevo':estado==='aceptado'?'Aceptado':estado==='en_preparacion'?'En preparación':estado;

    const div=document.createElement('div');
    div.className=`card ${claseEstado}`;
    div.innerHTML=`
      <div class="overlay-preg">
        <h3>¿Está listo tu producto?<br>Ya puede venir el repartidor por él</h3>
        <div style="display:flex;gap:12px">
          <button class="btn-si" onclick="cambiarEstado('${p.id}','listo')">Sí</button>
          <button class="btn-no" onclick="cerrarPregunta(this)">No</button>
        </div>
      </div>
      <div class="card-left">
        <span class="${badgeClass}"><span class="dot"></span> ${badgeText}</span>
        <div class="cliente"><div class="avatar">${nombreFinal.charAt(0).toUpperCase()}</div><div><b style="font-size:13px">Cliente: ${nombreFinal}</b><br><small style="color:#6b7280">📞 ${p.telefono||p.cliente?.celular||p.detalles?.celular||''}</small></div></div>
        <div class="referencia"><div><b style="font-size:12px">Referencia</b><p style="font-size:12px;color:#6b7280">${referenciaReal}</p><p style="font-size:11px;color:#9ca3af;margin-top:4px">📍 ${p.direccion||p.detalles?.direccion||''}</p></div></div>
        <div class="stats"><div><small>Costo producto -10%</small><b style="color:#16a34a">$${costoConDescuento} MXN</b> <small style="text-decoration:line-through;color:#9ca3af">$${parseFloat(costoProductos).toFixed(2)}</small></div></div>
      </div>
      <div class="card-center"></div>
      <div class="card-right">
        <div class="prod-head"><b>📦 Productos</b><div style="text-align:right"><div id="num">#${codigoReal}</div><small>${horaReal}</small></div></div>
        <div class="prod-list">
          ${productos.map(pr=>{
            const precDesc=(parseFloat(pr.precio||0)*0.9).toFixed(2);
            return `<div class="prod-item"><span><b>${pr.cantidad||1}x</b> ${pr.nombre||'Producto'}</span><span><b class="precio-desc">$${precDesc}</b> <span style="text-decoration:line-through;font-size:10px">$${pr.precio||0}</span></span></div>`
          }).join('')}
        </div>
        <div class="obs"><b>Observaciones:</b><p style="font-size:12px;color:#6b7280">${p.detalles?.instrucciones||'Sin observaciones.'}</p><p style="font-size:11px;margin-top:4px">Método pago: <b>${p.metodoPago||'Efectivo'}</b> | Total: $${p.totales?.total||''}</p></div>
        <div class="actions">
          <button class="btn btn-verde" onclick="cambiarEstado('${p.id}','aceptado')">✅ Aceptado</button>
          <button class="btn btn-amarillo" onclick="cambiarEstado('${p.id}','en_preparacion')">👨‍🍳 Preparando</button>
          <button class="btn btn-verde" onclick="cambiarEstado('${p.id}','listo')">✔️ Listo</button>
        </div>
      </div>
    `;
    cont.appendChild(div);
  });
}

function actualizarContadores(lista){
  document.getElementById('c-todos').textContent=lista.length;
  document.getElementById('c-nuevo').textContent=lista.filter(p=>(p.estado||'nuevo')==='nuevo').length;
  document.getElementById('c-aceptado').textContent=lista.filter(p=>p.estado==='aceptado').length;
  document.getElementById('c-prep').textContent=lista.filter(p=>p.estado==='en_preparacion').length;
  document.getElementById('c-listo').textContent=lista.filter(p=>p.estado==='listo').length;
}

onSnapshot(collection(db, "pedidos"), (snap)=>{
  let lista=[];
  snap.forEach(d=>{
    const data=d.data();
    const cat=(data.restaurante?.cat||'').toLowerCase();
    if(sesion?.rol==='administrador'||cat===catBuscada||!cat){
      lista.push({id:d.id, ...data, estado:data.estado||'nuevo'});
      if(data.restaurante?.nombre) restName.textContent=data.restaurante.nombre;
    }
  });
  // NUEVOS AL FINAL - ORDEN FIRESTORE EXACTO
  lista.sort((a,b)=>{
    const ta=a.timestamp?.seconds|| (a.fecha?new Date(a.fecha).getTime()/1000:0) ||0;
    const tb=b.timestamp?.seconds|| (b.fecha?new Date(b.fecha).getTime()/1000:0) ||0;
    return ta-tb;
  });
  pedidosCache=lista;
  actualizarContadores(lista);
  render(lista);
  if(!primerCarga && lista.length>ultimoTotal) sonarDoloYa();
  ultimoTotal=lista.length; primerCarga=false;
});

window.cambiarEstado=async(id,estado)=>{
  try{ await updateDoc(doc(db,"pedidos",id),{estado, actualizadoEn: new Date()}); }catch(e){ alert(e.message); }
}
window.cerrarPregunta=(btn)=>{
  const card=btn.closest('.card');
  card.style.display='none';
  setTimeout(()=>{ card.classList.remove('preparando'); card.style.display='flex'; }, 1500);
}
</script>
</body>
</html>
