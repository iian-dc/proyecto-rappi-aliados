<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f8f9;min-height:100vh}
:root{--rojo:#C50D1F}
.header{height:64px;background:white;border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}
.h-left{display:flex;align-items:center;gap:16px}
.btn-x{width:36px;height:36px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer;text-decoration:none;font-size:20px;font-weight:700}
.h-left h1{font-size:20px;font-weight:800}
.h-right{display:flex;align-items:center;gap:14px}
.bell{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.bell.vibrar{animation:bell3d 0.15s infinite}
@keyframes bell3d{0%{transform:rotate(-12deg) scale(1.1)}25%{transform:rotate(12deg) scale(1.25)}50%{transform:rotate(-10deg) scale(1.15)}75%{transform:rotate(10deg) scale(1.25)}100%{transform:rotate(-12deg) scale(1.1)}}
.chip-rest{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:12px;padding:18px 20px;flex-wrap:wrap}
.tab{border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;border:1px solid #e5e7eb;background:#f1f2f4;color:#6b7280;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.active{background:var(--rojo);color:white;border-color:var(--rojo)}
.tab span.count{background:white;color:#111;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 6px}
.container{padding:0 20px 20px}
.card{position:relative;background:white;border-radius:16px;border:1px solid #ececec;overflow:hidden;margin-bottom:14px;display:flex;flex-direction:row;transition:.3s}
.card.aceptado{background:#E8F5E9;border-color:#16a34a}
.card.preparando{background:#FFF176;border-color:#FACC15;box-shadow:0 0 22px rgba(250,204,21,0.5)}
.card.confirmando{background:#38BDF8;border-color:#0EA5E9;box-shadow:0 0 25px rgba(56,189,248,0.6)}
.card-left{flex:1;padding:18px;display:flex;flex-direction:column;gap:18px;justify-content:space-between}
.card-center{width:1px;background:#f0f0f0;margin:16px 0}
.card-right{flex:1.2;padding:18px;display:flex;flex-direction:column;gap:12px}
.badge-nuevo{background:var(--rojo);color:white;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;gap:6px;width:fit-content;text-transform:uppercase}
.badge-nuevo.verde{background:#16a34a}
.badge-nuevo.amarillo{background:#111;color:#FFEB3B}
.dot{width:8px;height:8px;background:white;border-radius:50%;display:inline-block}
.cliente-line{font-size:14px;font-weight:700;color:#111}
.cliente-line span{font-weight:800;color:#111;text-transform:capitalize}
.costo-box small{font-size:11px;color:#6b7280;display:block;margin-bottom:4px;font-weight:600}
.costo-original{text-decoration:line-through;color:#9ca3af;font-size:13px;margin-right:8px}
.costo-final{color:#16a34a;font-weight:900;font-size:18px;text-shadow:0 0 8px rgba(22,163,74,0.3)}
.prod-head{display:flex;justify-content:space-between;align-items:flex-start}
.fecha-hora{display:flex;align-items:center;gap:8px;font-size:11px;color:#6b7280;flex-wrap:wrap}
.fecha-hora b{color:#111;font-size:11px}
.tiempo-real{border-radius:999px;padding:4px 12px;font-size:11px;font-weight:900;transition:.3s;display:inline-flex;align-items:center;gap:4px}
.tiempo-verde{background:#16a34a;color:white;box-shadow:0 0 12px rgba(22,163,74,0.6)}
.tiempo-amarillo{background:#EAB308;color:white;box-shadow:0 0 12px rgba(234,179,8,0.7)}
.tiempo-rojo{background:#EF4444;color:white;box-shadow:0 0 14px rgba(239,68,68,0.8);animation:pulseRojo 1s infinite}
.tiempo-negro{background:#111;color:white;box-shadow:0 0 14px rgba(0,0,0,0.8);animation:pulseNegro 0.6s infinite;display:flex;align-items:center;gap:5px}
@keyframes pulseRojo{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pulseNegro{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.codigo-pedido{font-size:20px;font-weight:900;letter-spacing:1px;color:#111}
.prod-list{margin:8px 0;border-bottom:1px solid #f0f0f0;padding-bottom:10px}
.prod-item{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:#111}
.prod-item b{color:#6b7280;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:999px;padding:11px 18px;font-size:12.5px;font-weight:800;cursor:pointer;color:white;display:flex;align-items:center;gap:7px}
.btn-verde{background:#16a34a}
.btn-amarillo{background:#EAB308}
.overlay-preg{display:none;position:absolute;inset:0;background:#38BDF8;z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.card.confirmando .overlay-preg{display:flex}
.overlay-preg h3{font-size:19px;font-weight:900;line-height:1.3;color:white;margin-bottom:18px}
.btn-si{background:white;color:#0EA5E9;padding:11px 32px;border-radius:999px;border:none;font-weight:900;cursor:pointer;font-size:14px}
.btn-no{background:transparent;color:white;padding:11px 32px;border-radius:999px;border:2px solid white;font-weight:900;cursor:pointer;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:#9ca3af}
/* ===== SOLO CAMBIOS QUE PEDISTE ===== */
.bell-badge{position:absolute;top:-6px;right:-6px;background:#C50D1F;color:white;min-width:20px;height:20px;border-radius:999px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid white;box-shadow:0 2px 8px rgba(197,13,31,0.5);transform:scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1);z-index:2}
.bell-badge.show{transform:scale(1)}
.bell-badge.pulse{animation:badgePulse .4s ease}
@keyframes badgePulse{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@media(max-width:600px){
  .header{height:52px;padding:0 12px}
  .h-left{gap:10px}
  .h-left h1{font-size:16px}
  .btn-x{width:30px;height:30px;font-size:16px}
  .h-right{gap:10px}
  .bell{width:28px;height:28px}
  .chip-rest{padding:4px 10px;max-width:130px}
  .chip-rest b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .chip-rest small{font-size:10px}
  .tabs{gap:8px;padding:10px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:6px 12px;font-size:11.5px;white-space:nowrap;flex-shrink:0}
  .tab span.count{min-width:18px;height:18px;font-size:10px}
  .container{padding:0 10px 12px}
  .card{border-radius:12px;margin-bottom:10px}
  .card-left{padding:12px;gap:10px}
  .card-right{padding:12px;gap:8px}
  .badge-nuevo{font-size:10px;padding:4px 10px}
  .cliente-line{font-size:13px}
  .costo-final{font-size:16px}
  .codigo-pedido{font-size:16px}
  .prod-head{flex-direction:column;gap:6px}
  .fecha-hora{font-size:10px;gap:6px}
  .prod-item{font-size:12px}
  .btn{padding:9px 14px;font-size:11.5px}
  .actions{gap:6px}
  .overlay-preg h3{font-size:16px}
}
@media(max-width:800px){.card{flex-direction:column}.card-center{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="h-left"><a href="panelaliado.html" class="btn-x">✕</a><h1>Pedidos</h1></div>
  <div class="h-right">
    <div class="bell" id="bellIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C50D1F" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/></svg><span class="bell-badge" id="bellCount">0</span></div>
    <div class="chip-rest"><div><b id="restName">Mi restaurante</b><small style="color:#22c55e">● En línea</small></div></div>
  </div>
</div>
<div class="tabs">
  <button class="tab active" data-f="todos">Todos <span class="count" id="c-todos">0</span></button>
  <button class="tab" data-f="nuevo">Nuevos <span class="count" id="c-nuevo">0</span></button>
  <button class="tab" data-f="aceptado">Aceptados <span class="count" id="c-aceptado">0</span></button>
  <button class="tab" data-f="en_preparacion">En preparación <span class="count" id="c-prep">0</span></button>
  <button class="tab" data-f="listo">Listos <span class="count" id="c-listo">0</span></button>
</div>
<div class="container" id="listaPedidos"><div class="empty">Cargando pedidos...</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);
const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
const idNegocio = sesion?.id || sesion?.negocio || 'burgers';
const mapaCat = { alitas:'alitas', burgers:'burgers', pizzas:'pizzas' };
const catBuscada = mapaCat[idNegocio] || idNegocio;
const restName = document.getElementById('restName');
if(sesion?.nombreReal) restName.textContent = sesion.nombreReal;
const bell = document.getElementById('bellIcon');
const bellCountEl = document.getElementById('bellCount');
let primerCarga=true, ultimoTotal=0, pedidosCache=[], filtroActual='todos';
function desbloquearAudio(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch{}}
document.body.addEventListener('click',()=>{desbloquearAudio();},{once:true});
document.body.addEventListener('touchstart',()=>{desbloquearAudio();},{once:true});
function actualizarBadgeCampana(cantidad){
  if(!bellCountEl) return;
  if(cantidad>0){
    bellCountEl.textContent=cantidad>99?'99+':cantidad;
    bellCountEl.classList.add('show');
    bellCountEl.classList.remove('pulse');
    void bellCountEl.offsetWidth;
    bellCountEl.classList.add('pulse');
  }else{bellCountEl.classList.remove('show');}
}
function sonarDoloYa(){
  bell.classList.add('vibrar'); setTimeout(()=>bell.classList.remove('vibrar'),3500);
  try{if(navigator.vibrate)navigator.vibrate([400,150,400,150,600,200,600]);}catch{}
  try{
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance("¡DoloYa! ¡Pedido nuevo! ¡DoloYa!");
    utter.lang='es-MX'; utter.rate=1.15; utter.pitch=1.3; utter.volume=1;
    window.speechSynthesis.speak(utter);
  }catch{}
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const masterGain=ctx.createGain(); masterGain.gain.value=1; masterGain.connect(ctx.destination);
    const now=ctx.currentTime;
    const playTone=(baseTime)=>{
      [880,1046,1318,1568].forEach((f,i)=>{
        const o=ctx.createOscillator(); const g=ctx.createGain();
        o.type='square'; o.frequency.setValueAtTime(f,baseTime+i*0.18);
        g.gain.setValueAtTime(0.45,baseTime+i*0.18);
        g.gain.exponentialRampToValueAtTime(0.001,baseTime+i*0.18+0.3);
        o.connect(g); g.connect(masterGain);
        o.start(baseTime+i*0.18); o.stop(baseTime+i*0.18+0.32);
      });
    };
    playTone(now); playTone(now+0.9); playTone(now+1.8);
  }catch{}
}
document.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click', ()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); filtroActual=t.dataset.f; render(pedidosCache); }); });
function calcularTiempoReal(sec){
  if(!sec) return {texto:'0s', clase:'tiempo-verde', iconoSvg:''};
  const diffSeg=Math.floor(Date.now()/1000-sec);
  const min=Math.floor(diffSeg/60); const seg=diffSeg%60;
  let texto=''; if(diffSeg<60)texto=diffSeg+'s'; else if(diffSeg<3600)texto=min+'m '+seg+'s'; else{const h=Math.floor(min/60); const m=min%60; texto=h+'h '+m+'m';}
  let clase='', iconoSvg=''; if(diffSeg<960){clase='tiempo-verde';}else if(diffSeg<2160){clase='tiempo-amarillo';}else if(diffSeg<3000){clase='tiempo-rojo';}else{clase='tiempo-negro'; iconoSvg='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';}
  return {texto,clase,iconoSvg};
}
function obtenerNombreCliente(p){return p.nombre||p.detalles?.nombre||p.cliente?.nombre||p.nombreCliente||p.clienteNombre||p.cliente?.nombreCliente||p.datosCliente?.nombre||p.usuario?.nombre||(p.detalles?.direccion?p.detalles.direccion.split(',')[0]:null)||'Cliente';}
function render(lista){
  const cont=document.getElementById('listaPedidos');
  const filtrados=filtroActual==='todos'?lista:lista.filter(p=> (p.estado||'nuevo')===filtroActual);
  if(filtrados.length===0){ cont.innerHTML='<div class="empty">No hay pedidos en '+filtroActual+'</div>'; return; }
  cont.innerHTML='';
  filtrados.forEach((p)=>{
    const productos=p.productos||[]; const totales=p.totales||{}; let costoProductos=totales.costoProductos||0;
    if(!costoProductos){ productos.forEach(pr=>{ costoProductos+= (pr.cantidad||1)*parseFloat(pr.precio||0); }); }
    const costoOriginal=parseFloat(costoProductos); const costoFinal=(costoOriginal*0.9).toFixed(0);
    const nombreCliente=obtenerNombreCliente(p); const codigoReal=p.codigo||'ST-00'; const estado=p.estado||'nuevo';
    let claseEstado='', badgeClass='badge-nuevo', badgeText='Nuevo';
    if(estado==='aceptado'){ claseEstado='aceptado'; badgeClass='badge-nuevo verde'; badgeText='Aceptado'; }
    else if(estado==='en_preparacion'){ claseEstado='preparando'; badgeClass='badge-nuevo amarillo'; badgeText='En preparación'; }
    else if(estado==='listo'||estado==='listo_para_admin'){ claseEstado='aceptado'; badgeClass='badge-nuevo verde'; badgeText='Listo'; }
    let fechaStr='', horaStr='', tsSec=0;
    if(p.timestamp?.seconds){ tsSec=p.timestamp.seconds; const d=new Date(tsSec*1000); fechaStr=d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit'}); horaStr=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true}); }
    else if(p.fecha){ const d=new Date(p.fecha); tsSec=Math.floor(d.getTime()/1000); fechaStr=d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit'}); horaStr=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true}); }
    const tiempo=calcularTiempoReal(tsSec);
    const div=document.createElement('div'); div.className=`card ${claseEstado}`; div.dataset.ts=tsSec; div.id=`card-${p.id}`;
    div.innerHTML=`<div class="overlay-preg" id="overlay-${p.id}"><h3>¿Está listo tu producto?<br>Ya puede venir repartidor por él</h3><div style="display:flex;gap:12px"><button class="btn-si" onclick="confirmarListo('${p.id}')">Sí</button><button class="btn-no" onclick="negarListo('${p.id}')">No</button></div></div><div class="card-left"><span class="${badgeClass}"><span class="dot"></span> ${badgeText}</span><div><div class="cliente-line">cliente: <span>${nombreCliente}</span></div><div class="costo-box"><small>Costo del producto</small><span class="costo-original">$${costoOriginal.toFixed(0)} MXN</span><span class="costo-final">$${costoFinal} MXN</span></div></div></div><div class="card-center"></div><div class="card-right"><div class="prod-head"><div class="fecha-hora"><b>${fechaStr}</b> ${horaStr} <span class="tiempo-real ${tiempo.clase}" data-ts="${tsSec}">${tiempo.iconoSvg}${tiempo.texto}</span></div><div class="codigo-pedido">${codigoReal}</div></div><div class="prod-list">${productos.map(pr=>`<div class="prod-item"><span><b>${pr.cantidad||1}x</b> ${pr.nombre||'Producto'}</span></div>`).join('')}</div><div class="actions"><button class="btn btn-verde" onclick="cambiarEstado('${p.id}','aceptado')">Aceptar</button><button class="btn btn-amarillo" onclick="cambiarEstado('${p.id}','en_preparacion')">Preparando</button><button class="btn btn-verde" onclick="preguntarListo('${p.id}')">Listo</button></div></div>`;
    cont.appendChild(div);
  });
}
function actualizarContadores(lista){
  document.getElementById('c-todos').textContent=lista.length;
  document.getElementById('c-nuevo').textContent=lista.filter(p=>(p.estado||'nuevo')==='nuevo').length;
  document.getElementById('c-aceptado').textContent=lista.filter(p=>p.estado==='aceptado').length;
  document.getElementById('c-prep').textContent=lista.filter(p=>p.estado==='en_preparacion').length;
  document.getElementById('c-listo').textContent=lista.filter(p=>['listo','listo_para_admin'].includes(p.estado)).length;
  const pendientesCampana=lista.filter(p=>['nuevo','aceptado','en_preparacion'].includes(p.estado||'nuevo')).length;
  actualizarBadgeCampana(pendientesCampana);
}
setInterval(()=>{document.querySelectorAll('.tiempo-real').forEach(el=>{const ts=parseInt(el.dataset.ts||0); if(ts){const t=calcularTiempoReal(ts); el.innerHTML=t.iconoSvg+t.texto; el.className='tiempo-real '+t.clase;}});},1000);
onSnapshot(collection(db, "pedidos"), (snap)=>{
  let lista=[]; snap.forEach(d=>{const data=d.data(); const cat=(data.restaurante?.cat||'').toLowerCase(); if(sesion?.rol==='administrador'||cat===catBuscada||!cat){lista.push({id:d.id, ...data, estado:data.estado||'nuevo'}); if(data.restaurante?.nombre) restName.textContent=data.restaurante.nombre;}});
  lista.sort((a,b)=>{const ta=a.timestamp?.seconds|| (a.fecha?new Date(a.fecha).getTime()/1000:0)||0; const tb=b.timestamp?.seconds|| (b.fecha?new Date(b.fecha).getTime()/1000:0)||0; return ta-tb;});
  pedidosCache=lista; actualizarContadores(lista); render(lista);
  if(!primerCarga && lista.length>ultimoTotal) sonarDoloYa();
  ultimoTotal=lista.length; primerCarga=false;
});
window.cambiarEstado=async(id,estado)=>{try{ await updateDoc(doc(db,"pedidos",id),{estado, actualizadoEn: new Date()}); }catch(e){ alert(e.message); }}
window.preguntarListo=(id)=>{const card=document.getElementById('card-'+id); card.classList.remove('aceptado','preparando'); card.classList.add('confirmando');}
window.confirmarListo=async(id)=>{
  try{ 
    const refOriginal=doc(db,"pedidos",id); const snap=await getDoc(refOriginal); if(!snap.exists()){ alert("Pedido no encontrado"); return; } const data=snap.data();
    const clienteFull=data.cliente||{}; const ubiCompleta=data.ubicacionCompleta||{}; const ipData=data.ip||ubiCompleta.ip||'0.0.0.0';
    await setDoc(doc(db,"pedidos_admin",id),{
      ...data,
      clienteId: data.clienteId || clienteFull.clienteId || id,
      nombre: data.cliente?.nombre || data.nombre || clienteFull.nombre || 'Cliente',
      telefono: data.cliente?.celular || data.cliente?.telefono || clienteFull.celular || data.telefono || '',
      celular: data.cliente?.celular || data.cliente?.telefono || clienteFull.celular || data.telefono || '',
      direccionEntrega: clienteFull.direccion || data.direccionEntrega || data.cliente?.direccion || '',
      cliente: {
        clienteId: clienteFull.clienteId || data.clienteId || id,
        nombre: clienteFull.nombre || data.nombre || 'Cliente',
        celular: clienteFull.celular || clienteFull.telefono || data.telefono || '',
        telefono: clienteFull.telefono || clienteFull.celular || data.telefono || '',
        direccion: clienteFull.direccion || '',
        referencia: clienteFull.referencia || '',
        tipoDireccion: clienteFull.tipoDireccion || '',
        nombreEdificio: clienteFull.nombreEdificio || '',
        piso: clienteFull.piso || '',
        ubicacion: {
          lat: clienteFull.ubicacion?.lat || data.gps?.lat || 0,
          lng: clienteFull.ubicacion?.lng || data.gps?.lng || 0,
          accuracy: clienteFull.ubicacion?.accuracy || data.gps?.accuracy || 0,
          googleMapsUrl: clienteFull.ubicacion?.googleMapsUrl || `https://www.google.com/maps?q=${clienteFull.ubicacion?.lat || data.gps?.lat || 0},${clienteFull.ubicacion?.lng || data.gps?.lng || 0}`
        },
        gpsActualCliente: clienteFull.gpsActualCliente || data.gps || {}
      },
      gps: data.gps || clienteFull.ubicacion || { lat: 0, lng: 0 },
      latitud: data.gps?.lat || clienteFull.ubicacion?.lat || 0,
      longitud: data.gps?.lng || clienteFull.ubicacion?.lng || 0,
      ubicacionCompleta: ubiCompleta,
      detalles: data.detalles || {},
      ip: ipData,
      ipInfo: data.ipInfo || ubiCompleta.ipInfo || {},
      dispositivo: data.dispositivo || {},
      userAgent: data.userAgent || data.dispositivo?.userAgent || '',
      plataforma: data.plataforma || data.dispositivo?.plataforma || '',
      navegador: data.dispositivo?.navegador || data.dispositivo?.userAgent || '',
      estado:'listo_para_admin', listo:true, listoEn: new Date(), timestampAdmin: new Date(), actualizadoEn: new Date(), enviadoAAdmin:true, idOriginal: id, fechaListo: new Date().toISOString()
    });
    await deleteDoc(refOriginal);
  }catch(e){ alert("Error: "+e.message); console.error(e); }
}
window.negarListo=async(id)=>{
  const card=document.getElementById('card-'+id);
  card.classList.remove('confirmando'); card.classList.add('preparando');
  try{ await updateDoc(doc(db,"pedidos",id),{estado:'en_preparacion', actualizadoEn: new Date()}); }catch(e){}
}
</script>
