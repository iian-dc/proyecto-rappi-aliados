<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Inter',sans-serif;color:#0f172a;overflow-x:hidden}
.top{position:relative;max-width:100%;padding:14px 22px 18px;display:flex;align-items:center;border-bottom:1px solid #f1f5f9;background:white}
.top::after{content:"";position:absolute;top:0;right:0;width:110px;height:46px;background:linear-gradient(135deg,#E30613 0%,#E30613 55%,#0f172a 55%,#0f172a 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.x-btn{width:38px;height:38px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.line{width:2px;height:26px;background:#E30613;margin:0 12px}
.top h1{font-size:26px;font-weight:900;letter-spacing:-0.5px}
.table-wrap{max-width:1380px;margin:18px auto;padding:0 16px}
.table{width:100%;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}
.header-row{display:grid;grid-template-columns:1.2fr 0.9fr 1.4fr 0.6fr 1fr 0.9fr 1.1fr 0.8fr 1fr;background:#0b111c;color:white;padding:10px 0;font-size:12.5px;font-weight:700;align-items:center}
.header-row div{display:flex;align-items:center;gap:8px;padding:0 12px}
.header-row .ip-badge{background:#E30613;color:white;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:800;display:inline-flex;justify-content:center;min-width:46px}
.row{display:grid;grid-template-columns:1.2fr 0.9fr 1.4fr 0.6fr 1fr 0.9fr 1.1fr 0.8fr 1fr;border-top:1px solid #eef2f7;padding:10px 0;align-items:center;background:white;font-size:12px}
.row div{padding:0 12px;display:flex;align-items:center;gap:8px;min-height:32px;overflow:hidden}
.row .client-name{font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .addr{flex-direction:column;align-items:flex-start;gap:1px}
.row .addr b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.row .addr span{font-size:10px;color:#64748b}
.row .time{flex-direction:column;align-items:flex-start;line-height:1.2;font-size:11px}
.btn-resumen{border:1.8px solid #E30613;color:#E30613;background:white;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn-bloq{border:none;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;color:white;min-width:116px;justify-content:center;white-space:nowrap}
.btn-bloq.desbloqueado{background:#16a34a}
.btn-bloq.bloqueado{background:#E30613}
.ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:1200px){.header-row,.row{grid-template-columns:1fr;gap:6px}.header-row{display:none}.row{border:1px solid #eef2f7;border-radius:10px;margin-bottom:10px;padding:10px}.table{border:none}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal.active{display:flex}
.modal-card{background:white;border-radius:14px;max-width:520px;width:100%;padding:16px;max-height:85vh;overflow:auto}
.modal-card h3{font-size:14px;font-weight:900;margin-bottom:10px}
.modal-card .pedido{border:1px solid #eef2f7;border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:11px}
.btn-close{background:#0f172a;color:white;border:none;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer;margin-top:10px;width:100%}
</style>
</head>
<body>
<div class="top">
  <a href="paneladmin.html" class="x-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
  <div class="line"></div><h1>Clientes</h1>
</div>

<div class="table-wrap">
  <div class="table">
    <div class="header-row">
      <div>Cliente</div><div>Teléfono</div><div>Dirección</div><div>Pedidos</div><div>Último pedido</div><div><span class="ip-badge">IP</span></div><div>Ciudad</div><div>Resumen</div><div>Bloqueado</div>
    </div>
    <div id="lista"><div style="padding:20px;text-align:center;color:#64748b;font-size:12px">Cargando clientes de DoloYa-Historial...</div></div>
  </div>
</div>

<div class="modal" id="modalResumen">
  <div class="modal-card"><h3 id="resumenTitle">Resumen cliente</h3><div id="resumenBody"></div><button class="btn-close" onclick="document.getElementById('modalResumen').classList.remove('active')">Cerrar</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let clientesMap = {};
let reportadosMap = {};

function buscar(obj, keys){
  if(!obj) return null;
  for(let k of Object.keys(obj)){
    let kl=k.toLowerCase();
    for(let s of keys){ if(kl.includes(s)) return obj[k]; }
    if(typeof obj[k]==='object'){ let r=buscar(obj[k], keys); if(r) return r; }
  }
  return null;
}

function extraer(data){
  const clienteObj = data.cliente || {};
  const ubic = clienteObj.ubicacion || data.ubicacion || {};
  const ip = data.ip || data.ipCliente || clienteObj.ip || buscar(data, ['ip','ip_cliente']) || '-';
  const ciudad = data.ciudad || clienteObj.ciudad || buscar(data, ['ciudad','municipio']) || `Dolores Hidalgo, Gto.`;
  const nombre = clienteObj.nombre || data.nombre || data.clienteNombre || 'Cliente';
  const celular = clienteObj.celular || clienteObj.telefono || data.telefono || data.celular || data.clienteCelular || '-';
  const direccion = clienteObj.direccion || data.direccion || data.direccionEntrega || '-';
  const fecha = data.actualizadoEn || data.enviadoAHistorialEn || data.fechaEntrega || data.fechaCancelacion || data.timestamp || new Date();
  return { nombre, celular: String(celular), direccion, ip: String(ip), ciudad, lat: ubic.lat || buscar(data,['lat']) || null, lng: ubic.lng || buscar(data,['lng','longitud']) || null, fecha };
}

function addPedidos(snap){
  snap.forEach(ds=>{
    const d = ds.data();
    const ex = extraer(d);
    let key = ex.celular.replace(/\D/g,'');
    if(!key || key.length<7) key = ex.ip;
    if(!key || key==='-') return;
    if(!clientesMap[key]){
      clientesMap[key]={ key, nombre:ex.nombre, telefono:ex.celular, direccion:ex.direccion, ip:ex.ip, ciudad:ex.ciudad, lat:ex.lat, lng:ex.lng, pedidos:0, ultimo:null, lista:[] };
    }
    clientesMap[key].pedidos++;
    let f = ex.fecha?.toDate ? ex.fecha.toDate() : new Date(ex.fecha);
    if(isNaN(f.getTime())) f = new Date();
    if(!clientesMap[key].ultimo || f>clientesMap[key].ultimo) clientesMap[key].ultimo=f;
    if(ex.nombre && ex.nombre!=='Cliente') clientesMap[key].nombre=ex.nombre;
    if(ex.direccion && ex.direccion!=='-') clientesMap[key].direccion=ex.direccion;
    if(ex.ip && ex.ip!=='-') clientesMap[key].ip=ex.ip;
    if(ex.ciudad) clientesMap[key].ciudad=ex.ciudad;
    if(ex.lat) clientesMap[key].lat=ex.lat;
    if(ex.lng) clientesMap[key].lng=ex.lng;
    clientesMap[key].lista.push({ id:ds.id, fecha:f, total: d.totales?.total || d.total || 0, estado: d.estado || ds.id });
  });
  render();
}

onSnapshot(collection(db, "pedidos_entregados"), addPedidos);
onSnapshot(collection(db, "pedidos_cancelados"), addPedidos);
onSnapshot(collection(db, "clientes_reportados_no_recibe"), snap=>{
  reportadosMap={};
  snap.forEach(d=>{
    const data=d.data();
    const cel = String(data.celular || data.telefono || buscar(data,['celular','telefono']) || d.id).replace(/\D/g,'');
    if(cel) reportadosMap[cel]=true;
    const ip = String(data.ip || '').trim();
    if(ip) reportadosMap[ip]=true;
  });
  render();
});

function formatFecha(d){
  if(!d) return '-';
  const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=d.getFullYear();
  let h=d.getHours(); const mi=String(d.getMinutes()).padStart(2,'0'); const ampm=h>=12?'p.m.':'a.m.'; h=h%12||12;
  return `${dd}/${mm}/${yy}<br><span style="color:#64748b;font-size:10px">${String(h).padStart(2,'0')}:${mi} ${ampm}</span>`;
}

function render(){
  const arr = Object.values(clientesMap).sort((a,b)=> b.ultimo - a.ultimo);
  if(arr.length===0){ document.getElementById('lista').innerHTML=`<div style="padding:20px;text-align:center;color:#64748b;font-size:12px">Sin clientes aún</div>`; return; }
  document.getElementById('lista').innerHTML = arr.map(c=>{
    const keyTel = c.telefono.replace(/\D/g,'');
    const bloqueado = reportadosMap[keyTel] || reportadosMap[c.ip] || false;
    return `
    <div class="row">
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#111"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0v1H4v-1z"/></svg></span><span class="client-name">${c.nombre}</span></div>
      <div><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M20 10.5a9 9 0 0 0-1-4.2L18 6l-2 .7A7 7 0 0 0 10.5 2 7.5 7.5 0 0 0 3 9.5c0 2.5 1.2 4.7 3 6.2L6 22l6.5-1.7A7.5 7.5 0 0 0 20 10.5z"/></svg></span>${c.telefono}</div>
      <div><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/></svg></span><div class="addr"><b>${c.direccion.substring(0,32)}</b><span>${c.ciudad.includes('Dolores')? 'Col. Centro' : c.ciudad}</span></div></div>
      <div><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M3 7h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 12l-3-2v4l3 2 3-2v-4l-3 2z"/></svg></span>${c.pedidos}</div>
      <div><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><div class="time">${formatFecha(c.ultimo)}</div></div>
      <div style="font-size:10px;white-space:nowrap">${c.ip.substring(0,15)}</div>
      <div><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/></svg></span><div style="font-size:10px;line-height:1.2">${c.ciudad}<br><span style="color:#64748b">${c.lat? c.lat.toString().substring(0,8):''} ${c.lng? c.lng.toString().substring(0,9):''}</span></div></div>
      <div><button class="btn-resumen" onclick="verResumen('${c.key}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> Resumen</button></div>
      <div><button class="btn-bloq ${bloqueado?'bloqueado':'desbloqueado'}"><svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm-3 5h12v8H6v-8z"/></svg> ${bloqueado?'Bloqueado':'Desbloqueado'}</button></div>
    </div>`;
  }).join('');
}

window.verResumen = (key)=>{
  const c = clientesMap[key]; if(!c) return;
  document.getElementById('resumenTitle').textContent = `${c.nombre} - ${c.telefono}`;
  document.getElementById('resumenBody').innerHTML = `
    <div style="font-size:11px;margin-bottom:10px"><b>IP:</b> ${c.ip}<br><b>Ciudad:</b> ${c.ciudad}<br><b>GPS:</b> ${c.lat||'-'}, ${c.lng||'-'}<br><b>Dirección:</b> ${c.direccion}<br><b>Total pedidos:</b> ${c.pedidos}</div>
    ${c.lista.sort((a,b)=>b.fecha-a.fecha).map(p=>`<div class="pedido"><span>#${p.id.substring(0,8)}</span><span>${p.fecha.toLocaleDateString()}</span><b>$${Number(p.total).toFixed(2)}</b></div>`).join('')}
  `;
  document.getElementById('modalResumen').classList.add('active');
}
</script>
</body>
</html>
