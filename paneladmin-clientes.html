<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Inter',sans-serif;color:#0f172a;overflow-x:hidden}
.top{position:relative;max-width:100%;padding:14px 22px 18px;display:flex;align-items:center;border-bottom:1px solid #f1f5f9;background:white}
.top::after{content:"";position:absolute;top:0;right:0;width:110px;height:46px;background:linear-gradient(135deg,#E30613 0%,#E30613 55%,#0f172a 55%,#0f172a 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.x-btn{width:38px;height:38px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.line{width:2px;height:26px;background:#E30613;margin:0 12px}
.top h1{font-size:26px;font-weight:900}
.table-wrap{max-width:1380px;margin:18px auto;padding:0 16px}
.table{width:100%;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}
.header-row{display:grid;grid-template-columns:1.2fr 0.9fr 1.4fr 0.6fr 1fr 0.9fr 1.1fr 0.8fr 1fr;background:#0b111c;color:white;padding:10px 0;font-size:12.5px;font-weight:700;align-items:center}
.header-row div{display:flex;align-items:center;gap:8px;padding:0 12px}
.header-row .ip-badge{background:#E30613;color:white;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:800;display:inline-flex;justify-content:center;min-width:46px}
.row{display:grid;grid-template-columns:1.2fr 0.9fr 1.4fr 0.6fr 1fr 0.9fr 1.1fr 0.8fr 1fr;border-top:1px solid #eef2f7;padding:10px 0;align-items:center;background:white;font-size:12px}
.row div{padding:0 12px;display:flex;align-items:center;gap:8px;min-height:32px;overflow:hidden}
.client-name{font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{flex-direction:column;align-items:flex-start;gap:1px}
.addr b{font-size:11px;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr span{font-size:10px;color:#64748b}
.time{flex-direction:column;align-items:flex-start;line-height:1.2;font-size:11px}
.btn-resumen{border:1.8px solid #E30613;color:#E30613;background:white;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-bloq{border:none;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;color:white;min-width:116px;justify-content:center;white-space:nowrap}
.btn-bloq.desbloqueado{background:#16a34a}
.btn-bloq.bloqueado{background:#E30613}
.ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:1200px){.header-row{display:none}.row{grid-template-columns:1fr;gap:6px;border:1px solid #eef2f7;border-radius:10px;margin-bottom:10px;padding:10px}.table{border:none}}
</style>
</head>
<body>
<div class="top">
  <a href="paneladmin.html" class="x-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
  <div class="line"></div><h1>Clientes</h1>
</div>

<div class="table-wrap">
  <div class="table">
    <div class="header-row">
      <div>Cliente</div><div>Teléfono</div><div>Dirección</div><div>Pedidos</div><div>Último pedido</div><div><span class="ip-badge">IP</span></div><div>Ciudad</div><div>Resumen</div><div>Bloqueado</div>
    </div>
    <div id="lista"><div style="padding:20px;text-align:center;color:#64748b;font-size:12px">Cargando clientes de DoloYa-Historial...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let clientesMap = {};
let bloqueadosIPs = {};

const ipRegex = /^(?:\d{1,3}\.){3}\d{1,3}$/;

function extraerIP(data){
  // Solo campos que REALMENTE son IP, para no traer "efectivo"
  const candidatos = [
    data.ip,
    data.ipCliente,
    data.ip_cliente,
    data.cliente?.ip,
    data.cliente?.ipCliente,
    data.datosCliente?.ip,
    data.ubicacionCompleta?.ip,
    data.ubicacion?.ip,
    data.cliente?.ubicacion?.ip
  ];
  for(let c of candidatos){
    if(c && typeof c==='string' && ipRegex.test(c.trim())) return c.trim();
  }
  // Si aún no hay, busca en el objeto si hay alguna string que parezca IP
  for(let k in data){
    let v = data[k];
    if(typeof v==='string' && ipRegex.test(v.trim())) return v.trim();
    if(typeof v==='object' && v){
      for(let kk in v){
        let vv = v[kk];
        if(typeof vv==='string' && ipRegex.test(vv.trim()) && kk.toLowerCase().includes('ip')) return vv.trim();
      }
    }
  }
  return '-';
}

function extraerCliente(data){
  const c = data.cliente || {};
  const nombre = c.nombre || data.nombre || 'Cliente';
  const celularRaw = c.celular || c.telefono || data.telefono || data.celular || '-';
  const celular = String(celularRaw).replace(/\D/g,'');
  const direccion = c.direccion || data.direccionEntrega || data.direccion || '-';
  const ciudad = data.ciudad || c.ciudad || data.municipio || 'Dolores Hidalgo, Gto.';
  const ip = extraerIP(data);
  const fecha = data.actualizadoEn || data.enviadoAHistorialEn || data.fechaEntrega || data.fechaCancelacion || data.timestamp || new Date();
  const lat = c.ubicacion?.lat || data.ubicacion?.lat || null;
  const lng = c.ubicacion?.lng || data.ubicacion?.lng || null;
  return { nombre, celular, celularRaw: String(celularRaw), direccion, ciudad, ip, fecha, lat, lng };
}

function agregarSnap(snap){
  snap.forEach(ds=>{
    const ex = extraerCliente(ds.data());
    if(!ex.celular || ex.celular.length < 7) return; // Agrupamos solo por telefono, no por IP
    const key = ex.celular;
    if(!clientesMap[key]){
      clientesMap[key]={ key, nombre:ex.nombre, telefono:ex.celularRaw, direccion:ex.direccion, ciudad:ex.ciudad, ip:ex.ip, lat:ex.lat, lng:ex.lng, pedidos:0, ultimo:null };
    }
    clientesMap[key].pedidos++;
    let f = ex.fecha?.toDate ? ex.fecha.toDate() : new Date(ex.fecha);
    if(isNaN(f.getTime())) f = new Date();
    if(!clientesMap[key].ultimo || f > clientesMap[key].ultimo){
      clientesMap[key].ultimo = f;
      clientesMap[key].ip = ex.ip; // Siempre la última IP con la que pidió
      if(ex.lat) clientesMap[key].lat = ex.lat;
      if(ex.lng) clientesMap[key].lng = ex.lng;
    }
    if(ex.nombre && ex.nombre!=='Cliente') clientesMap[key].nombre = ex.nombre;
    if(ex.direccion && ex.direccion!=='-') clientesMap[key].direccion = ex.direccion;
  });
  render();
}

onSnapshot(collection(db, "pedidos_entregados"), agregarSnap);
onSnapshot(collection(db, "pedidos_cancelados"), agregarSnap);

// Escucha bloqueados - puedes tener 2 colecciones, usamos ambas
onSnapshot(collection(db, "clientes_bloqueados"), snap=>{
  snap.forEach(d=>{ bloqueadosIPs[d.id]=true; if(d.data().ip) bloqueadosIPs[d.data().ip]=true; });
  render();
});
onSnapshot(collection(db, "clientes_reportados_no_recibe"), snap=>{
  snap.forEach(d=>{
    const ip = d.data().ip;
    const cel = String(d.data().celular||'').replace(/\D/g,'');
    if(ip && ipRegex.test(ip)) bloqueadosIPs[ip]=true;
    if(cel) bloqueadosIPs[cel]=true;
  });
  render();
});

function formatFecha(d){
  if(!d) return '-';
  const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=d.getFullYear();
  let h=d.getHours(); const mi=String(d.getMinutes()).padStart(2,'0'); const ampm=h>=12?'p.m.':'a.m.'; h=h%12||12;
  return `${dd}/${mm}/${yy}<br><span style="color:#64748b;font-size:10px">${String(h).padStart(2,'0')}:${mi} ${ampm}</span>`;
}

function render(){
  const arr = Object.values(clientesMap).sort((a,b)=> b.ultimo - a.ultimo);
  if(arr.length===0){ document.getElementById('lista').innerHTML=`<div style="padding:20px;text-align:center;color:#64748b;font-size:12px">Sin clientes aún</div>`; return; }
  document.getElementById('lista').innerHTML = arr.map(c=>{
    const estaBloqueado = bloqueadosIPs[c.key] || bloqueadosIPs[c.ip] || false;
    return `
    <div class="row">
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#111"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0v1H4v-1z"/></svg></span><span class="client-name">${c.nombre}</span></div>
      <div>${c.telefono}</div>
      <div><div class="addr"><b>${c.direccion.substring(0,32)}</b><span>Col. Centro</span></div></div>
      <div>${c.pedidos}</div>
      <div><div class="time">${formatFecha(c.ultimo)}</div></div>
      <div style="font-size:10px;white-space:nowrap;font-weight:700">${c.ip}</div>
      <div><div style="font-size:10px;line-height:1.2">${c.ciudad}<br><span style="color:#64748b">${c.lat? String(c.lat).substring(0,8):''} ${c.lng? String(c.lng).substring(0,9):''}</span></div></div>
      <div><a class="btn-resumen" href="paneladmin-clientes-resumen.html?tel=${c.key}&ip=${encodeURIComponent(c.ip)}">Resumen</a></div>
      <div><button class="btn-bloq ${estaBloqueado?'bloqueado':'desbloqueado'}" onclick="toggleBloq('${c.key}','${c.ip}')">${estaBloqueado?'Bloqueado':'Desbloqueado'}</button></div>
    </div>`;
  }).join('');
}

window.toggleBloq = async (keyTel, ip)=>{
  const estaBloqueado = bloqueadosIPs[keyTel] || bloqueadosIPs[ip];
  const docId = ip && ip!=='-' && ipRegex.test(ip) ? ip : keyTel;
  try{
    if(estaBloqueado){
      await deleteDoc(doc(db, "clientes_bloqueados", docId));
      delete bloqueadosIPs[docId];
      delete bloqueadosIPs[keyTel];
      delete bloqueadosIPs[ip];
    } else {
      await setDoc(doc(db, "clientes_bloqueados", docId), { telefono:keyTel, ip:ip, bloqueadoEn:new Date().toISOString(), activo:true });
      bloqueadosIPs[docId]=true;
    }
    render();
  }catch(e){ alert('Error: '+e.message); }
}
</script>
</body>
</html>
