<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Inter',sans-serif;color:#0f172a;overflow-x:hidden}
.top{position:relative;max-width:100%;padding:14px 22px 18px;display:flex;align-items:center;border-bottom:1px solid #f1f5f9;background:white}
.top::after{content:"";position:absolute;top:0;right:0;width:110px;height:46px;background:linear-gradient(135deg,#E30613 0%,#E30613 55%,#0f172a 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.x-btn{width:38px;height:38px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.line{width:2px;height:26px;background:#E30613;margin:0 12px}
.top h1{font-size:26px;font-weight:900;letter-spacing:-0.5px}
.table-wrap{width:100%;max-width:100%;margin:0 auto;padding:12px 14px}
.table{width:100%;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}
.header-row{display:grid;grid-template-columns:13% 10% 17% 5% 10% 15% 9% 7% 8% 6%;background:#0b111c;color:white;padding:0;font-size:10px;font-weight:700;align-items:center;height:44px}
.header-row div{padding:0 6px;display:flex;align-items:center;justify-content:center;text-align:center;height:100%;border-right:1px solid #1e293b;white-space:nowrap;overflow:hidden}
.header-row div:last-child{border-right:none}
.row{display:grid;grid-template-columns:13% 10% 17% 5% 10% 15% 9% 7% 8% 6%;border-top:1px solid #eef2f7;padding:0;align-items:center;background:white;font-size:10px;min-height:54px}
.row:hover{background:#f8fafc}
.row div{padding:0 6px;display:flex;align-items:center;justify-content:center;text-align:center;height:100%;border-right:1px solid #f1f5f9;overflow:hidden;white-space:nowrap}
.row div:last-child{border-right:none}
.client-name{font-weight:800;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;text-align:center}
.addr{flex-direction:column !important;justify-content:center !important}
.addr b{font-size:10px;font-weight:600;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.time{flex-direction:column !important;line-height:1.1;text-align:center}
.badge-origen{font-size:8px;font-weight:800;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid;display:inline-flex;align-items:center;justify-content:center;min-width:62px}
.badge-origen.entregado{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.badge-origen.cancelado{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.badge-origen.reportado{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-resumen{border:1.5px solid #E30613;color:#E30613;background:white;border-radius:999px;padding:4px 8px;font-size:8.5px;font-weight:800;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn-bloq{border:none;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:800;color:white;min-width:70px;justify-content:center;cursor:pointer;display:flex;align-items:center;white-space:nowrap}
.btn-bloq.desbloqueado{background:#16a34a}
.btn-bloq.bloqueado{background:#E30613}
.ip-cell{font-family:monospace;font-size:9.5px;font-weight:700;letter-spacing:-0.2px}
@media(max-width:1100px){.header-row{display:none}.row{grid-template-columns:1fr;gap:0;border:1px solid #eef2f7;border-radius:10px;margin-bottom:10px;padding:10px;height:auto;min-height:auto}.row div{border:none;height:auto;padding:4px 0;justify-content:flex-start;text-align:left}.table{border:none}}
</style>
</head>
<body>
<div class="top">
  <a href="paneladmin.html" class="x-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
  <div class="line"></div><h1>Clientes</h1>
</div>

<div class="table-wrap">
<div class="table">
<div class="header-row"><div>Cliente</div><div>Teléfono</div><div>Dirección</div><div>Pedidos</div><div>Último pedido</div><div>IP</div><div>Ciudad</div><div>Resumen</div><div>Bloqueado</div><div>Carpeta</div></div>
<div id="lista" style="padding:20px;text-align:center;color:#64748b;font-size:12px">Cargando de DoloYa-Historial...</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let clientesMap = {};

function getFecha(f){
  if(!f) return new Date(0);
  if(f.toDate) return f.toDate();
  if(f.seconds) return new Date(f.seconds*1000);
  if(typeof f==='string') return new Date(f);
  return new Date(f);
}
function formatFecha(d){
  if(!d || d.getTime()===0) return '-';
  const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=d.getFullYear();
  return `${dd}/${mm}/${yy}`;
}

function asegurarCliente(keyTel, nombre, telefonoRaw, direccion, ip, ciudad, ipInfo, lat, lng, fecha, origen){
  if(!keyTel) return;
  if(!clientesMap[keyTel]){
    clientesMap[keyTel]={
      key: keyTel,
      nombre: nombre||'Cliente',
      telefono: telefonoRaw||keyTel,
      direccion: direccion||'-',
      ip: ip||'-',
      ipInfo: ipInfo||{},
      ciudad: ciudad||'Dolores Hgo.',
      lat: lat||null,
      lng: lng||null,
      ultimo: fecha,
      pedidos: 0,
      origenes: new Set(),
      carpetaPrincipal: origen,
      bloqueado: false
    };
  }
  const c = clientesMap[keyTel];
  c.pedidos++;
  if(fecha && fecha > c.ultimo){
    c.ultimo = fecha;
    if(ip && ip!=='null' && ip!=='-' && ip!=='0.0.0.0') c.ip = ip;
    if(ipInfo) c.ipInfo = ipInfo;
    if(lat) c.lat = lat;
    if(lng) c.lng = lng;
    if(direccion && direccion!=='-') c.direccion = direccion;
    if(ciudad) c.ciudad = ciudad;
    c.carpetaPrincipal = origen;
  } else if (c.ultimo.getTime()===0) {
    c.ultimo = fecha;
  }
  if(nombre && nombre!=='Cliente') c.nombre = nombre;
  if(origen) c.origenes.add(origen);
}

onSnapshot(collection(db, "clientes_reportados_no_recibe"), snap=>{
  snap.forEach(ds=>{
    const data = ds.data();
    const telefonoRaw = data.telefono || data.celular || ds.id;
    const key = String(telefonoRaw).replace(/\D/g,'');
    if(!key) return;
    const nombre = data.nombre || data.cliente?.nombre || 'Cliente';
    const direccion = data.direccion || data.cliente?.direccion || '-';
    const gps = data.gps || data.cliente?.ubicacion || {};
    const lat = gps.lat || data.latitud;
    const lng = gps.lng || data.longitud;
    const ipReal = data.ip && data.ip!=='null' && data.ip!=='0.0.0.0' ? data.ip : (data.ubicacionCompleta?.ip || '-');
    const ipInfo = data.ipInfo || data.ubicacionCompleta?.ipInfo || {};
    const fecha = getFecha(data.fechaReporte || data.ultimoPedido || data.timestamp);
    const ciudad = ipInfo.city || 'Dolores Hgo.';
    const bloqueado = data.bloqueado===true || data.ipBloqueada===true;
    if(!clientesMap[key]) asegurarCliente(key, nombre, telefonoRaw, direccion, ipReal, ciudad, ipInfo, lat, lng, fecha, 'REPORTADO');
    if(clientesMap[key]){
      clientesMap[key].origenes.add('REPORTADO');
      clientesMap[key].bloqueado = bloqueado;
      if(fecha > clientesMap[key].ultimo) clientesMap[key].ultimo = fecha;
      if(ipReal && ipReal!=='-') clientesMap[key].ip = ipReal;
    }
  });
  render();
});

onSnapshot(collection(db, "pedidos_entregados"), snap=>{
  snap.forEach(ds=>{
    const d = ds.data();
    const cli = d.cliente || {};
    const telRaw = cli.celular || cli.telefono || d.telefono || '-';
    const key = String(telRaw).replace(/\D/g,'');
    if(!key || key.length<7) return;
    const nombre = cli.nombre || d.nombre || 'Cliente';
    const direccion = cli.direccion || d.direccionEntrega || '-';
    const ip = d.ip && d.ip!=='null' && d.ip!=='0.0.0.0' ? d.ip : (d.ubicacionCompleta?.ip || '-');
    const ipInfo = d.ipInfo || d.ubicacionCompleta?.ipInfo || {};
    const lat = cli.ubicacion?.lat || d.latitud || null;
    const lng = cli.ubicacion?.lng || d.longitud || null;
    const fecha = getFecha(d.fechaEntrega || d.enviadoAHistorialEn || d.timestamp);
    const ciudad = ipInfo.city || 'Dolores Hgo.';
    asegurarCliente(key, nombre, telRaw, direccion, ip, ciudad, ipInfo, lat, lng, fecha, 'ENTREGADO');
  });
  render();
});

onSnapshot(collection(db, "pedidos_cancelados"), snap=>{
  snap.forEach(ds=>{
    const d = ds.data();
    const cli = d.cliente || {};
    const telRaw = cli.celular || cli.telefono || d.telefono || '-';
    const key = String(telRaw).replace(/\D/g,'');
    if(!key || key.length<7) return;
    const nombre = cli.nombre || d.nombre || 'Cliente';
    const direccion = cli.direccion || d.direccionEntrega || '-';
    const ip = d.ip && d.ip!=='null' && d.ip!=='0.0.0.0' ? d.ip : (d.ubicacionCompleta?.ip || '-');
    const ipInfo = d.ipInfo || d.ubicacionCompleta?.ipInfo || {};
    const lat = cli.ubicacion?.lat || d.latitud || null;
    const lng = cli.ubicacion?.lng || d.longitud || null;
    const fecha = getFecha(d.fechaCancelacion || d.enviadoAHistorialEn || d.timestamp);
    const ciudad = ipInfo.city || 'Dolores Hgo.';
    asegurarCliente(key, nombre, telRaw, direccion, ip, ciudad, ipInfo, lat, lng, fecha, 'CANCELADO');
  });
  render();
});

onSnapshot(collection(db, "ips_bloqueadas"), snap=>{
  snap.forEach(ds=>{
    const ip = ds.id;
    const data = ds.data();
    if(data.bloqueado){
      Object.values(clientesMap).forEach(c=>{
        if(c.ip===ip) c.bloqueado = true;
      });
    }
  });
  render();
});

function render(){
  const arr = Object.values(clientesMap).sort((a,b)=> b.ultimo - a.ultimo);
  if(arr.length===0){ document.getElementById('lista').innerHTML=`<div style="padding:20px;text-align:center">Sin clientes</div>`; return; }
  document.getElementById('lista').innerHTML = arr.map(c=>{
    let ipMostrar = c.ip && c.ip!=='-' && c.ip!=='null' && c.ip!=='0.0.0.0' ? c.ip : '-';
    let ciudadMostrar = c.ipInfo?.city || c.ciudad || 'Dolores Hgo.';
    let carpetaBadge = c.carpetaPrincipal || 'REPORTADO';
    let cls = carpetaBadge==='ENTREGADO'?'entregado':carpetaBadge==='CANCELADO'?'cancelado':'reportado';
    return `
    <div class="row">
      <div><b class="client-name" title="${c.nombre}">${c.nombre}</b></div>
      <div>${c.telefono}</div>
      <div><div class="addr"><b title="${c.direccion}">${c.direccion.substring(0,28)}</b></div></div>
      <div><b>${c.pedidos}</b></div>
      <div><div class="time">${formatFecha(c.ultimo)}</div></div>
      <div class="ip-cell">${ipMostrar}</div>
      <div>${ciudadMostrar}</div>
      <div><a class="btn-resumen" href="paneladmin-clientes-resumen.html?tel=${c.key}">Resumen</a></div>
      <div><button class="btn-bloq ${c.bloqueado?'bloqueado':'desbloqueado'}" onclick="toggleBloq('${c.key}')">${c.bloqueado?'Bloqueado':'Desbloq.'}</button></div>
      <div><span class="badge-origen ${cls}">${carpetaBadge}</span></div>
    </div>`;
  }).join('');
}

window.toggleBloq = async (key)=>{
  const c = clientesMap[key];
  if(!c) return;
  const nuevo = !c.bloqueado;
  try{
    await setDoc(doc(db, "clientes_reportados_no_recibe", key), { 
      telefono: key, 
      bloqueado: nuevo, 
      ipBloqueada: nuevo, 
      ip: c.ip,
      ipInfo: c.ipInfo||{},
      bloqueadoEn: new Date().toISOString()
    }, {merge:true});

    if(c.ip && c.ip!=='-' && c.ip!=='null' && c.ip!=='0.0.0.0'){
      await setDoc(doc(db, "ips_bloqueadas", c.ip), { 
        ip: c.ip, 
        telefono: key, 
        nombre: c.nombre,
        bloqueado: nuevo, 
        fecha: new Date().toISOString()
      }, {merge:true});
      await setDoc(doc(db, "bloqueos_ip", c.ip), {
        ip: c.ip,
        bloqueado: nuevo,
        telefono: key,
        timestamp: new Date().toISOString()
      }, {merge:true});
    }
    c.bloqueado = nuevo;
    render();
  }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
