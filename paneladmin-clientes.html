<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Inter',sans-serif;color:#0f172a;overflow-x:hidden}
.top{position:relative;max-width:100%;padding:14px 22px 18px;display:flex;align-items:center;border-bottom:1px solid #f1f5f9;background:white}
.top::after{content:"";position:absolute;top:0;right:0;width:110px;height:46px;background:linear-gradient(135deg,#E30613 0%,#E30613 55%,#0f172a 55%,#0f172a 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.x-btn{width:38px;height:38px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.line{width:2px;height:26px;background:#E30613;margin:0 12px}
.top h1{font-size:26px;font-weight:900;letter-spacing:-0.5px}
.table-wrap{max-width:1450px;margin:18px auto;padding:0 16px}
.table{width:100%;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}
.header-row{display:grid;grid-template-columns:1.1fr 0.85fr 1.2fr 0.55fr 0.9fr 1fr 1fr 0.75fr 1.3fr;background:#0b111c;color:white;padding:11px 0;font-size:11.5px;font-weight:700;align-items:center}
.header-row div{padding:0 10px;display:flex;align-items:center;gap:6px}
.header-row .ip-badge{background:#E30613;color:white;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;min-width:42px;justify-content:center}
.row{display:grid;grid-template-columns:1.1fr 0.85fr 1.2fr 0.55fr 0.9fr 1fr 1fr 0.75fr 1.3fr;border-top:1px solid #eef2f7;padding:10px 0;align-items:center;background:white;font-size:11px;min-height:62px}
.row div{padding:0 10px;display:flex;align-items:center;gap:8px;overflow:hidden}
.client-name{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{flex-direction:column;align-items:flex-start;gap:1px}
.addr b{font-size:10.5px;font-weight:600;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr span{font-size:9px;color:#64748b}
.time{flex-direction:column;align-items:flex-start;line-height:1.1}
.badge-origen{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid}
.badge-origen.entregado{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.badge-origen.cancelado{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.badge-origen.reportado{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-resumen{border:1.5px solid #E30613;color:#E30613;background:white;border-radius:999px;padding:6px 12px;font-size:10px;font-weight:800;text-decoration:none;white-space:nowrap}
.btn-bloq{border:none;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;color:white;min-width:108px;justify-content:center;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-bloq.desbloqueado{background:#16a34a}
.btn-bloq.bloqueado{background:#E30613}
.actions-wrap{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
@media(max-width:1250px){.header-row{display:none}.row{grid-template-columns:1fr;gap:8px;border:1px solid #eef2f7;border-radius:10px;margin-bottom:10px;padding:12px}.table{border:none}}
</style>
</head>
<body>
<div class="top">
  <a href="paneladmin.html" class="x-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
  <div class="line"></div><h1>Clientes</h1>
</div>

<div class="table-wrap">
<div class="table">
<div class="header-row"><div>Cliente</div><div>Teléfono</div><div>Dirección</div><div>Pedidos</div><div>Último pedido</div><div><span class="ip-badge">IP</span></div><div>Ciudad / GPS</div><div>Resumen</div><div>Bloqueado / Origen</div></div>
<div id="lista" style="padding:20px;text-align:center;color:#64748b;font-size:12px">Cargando de DoloYa-Historial...</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let clientesMap = {};

function getFecha(f){
  if(!f) return new Date();
  if(f.toDate) return f.toDate();
  if(typeof f==='string') return new Date(f);
  return new Date(f);
}
function formatFecha(d){
  if(!d) return '-';
  const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=d.getFullYear();
  let h=d.getHours(); const mi=String(d.getMinutes()).padStart(2,'0'); const ampm=h>=12?'p.m.':'a.m.'; h=h%12||12;
  return `${dd}/${mm}/${yy}<br><span style="color:#64748b;font-size:9px">${String(h).padStart(2,'0')}:${mi} ${ampm}</span>`;
}

function asegurarCliente(keyTel, nombre, telefonoRaw, direccion, ip, ciudad, lat, lng, fecha, origen){
  if(!keyTel) return;
  if(!clientesMap[keyTel]){
    clientesMap[keyTel]={
      key: keyTel,
      nombre: nombre||'Cliente',
      telefono: telefonoRaw||keyTel,
      direccion: direccion||'-',
      ip: ip||'-',
      ciudad: ciudad||'Dolores Hidalgo',
      lat: lat||null,
      lng: lng||null,
      ultimo: fecha,
      pedidos: 0,
      origenes: new Set(),
      bloqueado: false,
      motivo: ''
    };
  }
  const c = clientesMap[keyTel];
  c.pedidos++;
  if(fecha > c.ultimo){
    c.ultimo = fecha;
    if(ip && ip!=='null' && ip!=='-') c.ip = ip;
    if(lat) c.lat = lat;
    if(lng) c.lng = lng;
    if(direccion && direccion!=='-') c.direccion = direccion;
  }
  if(nombre && nombre!=='Cliente') c.nombre = nombre;
  if(origen) c.origenes.add(origen);
}

// 1. CLIENTES REPORTADOS NO RECIBE (tu foto principal)
onSnapshot(collection(db, "clientes_reportados_no_recibe"), snap=>{
  snap.forEach(ds=>{
    const data = ds.data();
    const telefonoRaw = data.telefono || data.celular || ds.id;
    const key = String(telefonoRaw).replace(/\D/g,'');
    if(!key) return;
    const nombre = data.nombre || 'Cliente';
    const direccion = data.direccion || data.detalles?.direccion || '-';
    const gps = data.gps || data.gpsActualCliente || {};
    const lat = gps.lat || data.detalles?.lat;
    const lng = gps.lng || data.detalles?.lng;
    const ipReal = data.ip && data.ip!=='null' ? data.ip : null;
    const fecha = getFecha(data.timestamp || data.actualizadoEn);
    const ciudad = 'Dolores Hidalgo, Gto.';
    const bloqueado = data.bloqueado===true || data.ipBloqueada===true;

    if(!clientesMap[key]){
      asegurarCliente(key, nombre, telefonoRaw, direccion, ipReal, ciudad, lat, lng, fecha, 'REPORTADO');
    } else {
      clientesMap[key].origenes.add('REPORTADO');
      clientesMap[key].bloqueado = bloqueado;
      clientesMap[key].motivo = data.motivo || '';
      if(fecha > clientesMap[key].ultimo) clientesMap[key].ultimo = fecha;
    }
    clientesMap[key].bloqueado = bloqueado;
  });
  render();
});

// 2. PEDIDOS ENTREGADOS
onSnapshot(collection(db, "pedidos_entregados"), snap=>{
  snap.forEach(ds=>{
    const d = ds.data();
    const cli = d.cliente || d.detalles || {};
    const telRaw = cli.celular || cli.telefono || d.telefono || '-';
    const key = String(telRaw).replace(/\D/g,'');
    if(!key || key.length<7) return;
    const nombre = cli.nombre || d.nombre || 'Cliente';
    const direccion = cli.direccion || d.direccion || '-';
    const ip = d.ip && d.ip!=='null' ? d.ip : null;
    const lat = cli.ubicacion?.lat || d.lat || null;
    const lng = cli.ubicacion?.lng || d.lng || null;
    const fecha = getFecha(d.actualizadoEn || d.enviadoAHistorialEn || d.timestamp);
    asegurarCliente(key, nombre, telRaw, direccion, ip, 'Dolores Hidalgo', lat, lng, fecha, 'ENTREGADO');
  });
  render();
});

// 3. PEDIDOS CANCELADOS
onSnapshot(collection(db, "pedidos_cancelados"), snap=>{
  snap.forEach(ds=>{
    const d = ds.data();
    const cli = d.cliente || d.detalles || {};
    const telRaw = cli.celular || cli.telefono || d.telefono || '-';
    const key = String(telRaw).replace(/\D/g,'');
    if(!key || key.length<7) return;
    const nombre = cli.nombre || d.nombre || 'Cliente';
    const direccion = cli.direccion || d.direccion || '-';
    const ip = d.ip && d.ip!=='null' ? d.ip : null;
    const lat = cli.ubicacion?.lat || d.lat || null;
    const lng = cli.ubicacion?.lng || d.lng || null;
    const fecha = getFecha(d.actualizadoEn || d.fechaCancelacion || d.timestamp);
    asegurarCliente(key, nombre, telRaw, direccion, ip, 'Dolores Hidalgo', lat, lng, fecha, 'CANCELADO');
  });
  render();
});

function render(){
  const arr = Object.values(clientesMap).sort((a,b)=> b.ultimo - a.ultimo);
  if(arr.length===0){ document.getElementById('lista').innerHTML=`<div style="padding:20px;text-align:center">Sin clientes</div>`; return; }
  document.getElementById('lista').innerHTML = arr.map(c=>{
    let ipMostrar = c.ip && c.ip!=='-' && c.ip!=='null' ? c.ip : `${c.lat? String(c.lat).substring(0,8):'21.16'} , ${c.lng? String(c.lng).substring(0,9):'-100.93'}`;
    let origenBadges = Array.from(c.origenes).map(o=>{
      let cls = o==='ENTREGADO'?'entregado':o==='CANCELADO'?'cancelado':'reportado';
      return `<span class="badge-origen ${cls}">${o}</span>`;
    }).join(' ');
    if(origenBadges==='') origenBadges = `<span class="badge-origen reportado">REPORTADO</span>`;
    return `
    <div class="row">
      <div><b class="client-name">${c.nombre}</b></div>
      <div>${c.telefono}</div>
      <div><div class="addr"><b>${c.direccion.substring(0,32)}</b><span>Col. Centro</span></div></div>
      <div>${c.pedidos}</div>
      <div><div class="time">${formatFecha(c.ultimo)}</div></div>
      <div style="font-size:9px;font-weight:700;flex-direction:column;align-items:flex-start"><span>${ipMostrar}</span><span style="color:#E30613;font-size:7px">${(!c.ip || c.ip==='-')?'IP null -> GPS':''}</span></div>
      <div style="font-size:9px">Dolores Hgo.<br><span style="color:#64748b">${c.lat||''} ${c.lng||''}</span></div>
      <div><a class="btn-resumen" href="paneladmin-clientes-resumen.html?tel=${c.key}&id=${c.key}">Resumen</a></div>
      <div><div class="actions-wrap"><button class="btn-bloq ${c.bloqueado?'bloqueado':'desbloqueado'}" onclick="toggleBloq('${c.key}')">${c.bloqueado?'Bloqueado':'Desbloqueado'}</button><div style="display:flex;gap:4px;flex-wrap:wrap">${origenBadges}</div></div></div>
    </div>`;
  }).join('');
}

window.toggleBloq = async (key)=>{
  const c = clientesMap[key];
  if(!c) return;
  const nuevo = !c.bloqueado;
  try{
    // Actualiza en reportados y también crea en clientes_bloqueados para que bloquee la IP
    await updateDoc(doc(db, "clientes_reportados_no_recibe", key), { bloqueado: nuevo, ipBloqueada: nuevo, bloqueadoEn: new Date().toISOString() }).catch(async ()=>{
      await setDoc(doc(db, "clientes_reportados_no_recibe", key), { telefono: key, bloqueado: nuevo, ipBloqueada: nuevo, bloqueadoEn: new Date().toISOString() }, {merge:true});
    });
    c.bloqueado = nuevo;
    render();
  }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
