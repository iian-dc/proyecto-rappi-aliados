<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Pedidos - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#B70A1A">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh}
:root{--rojo:#B70A1A}
.header-top{background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:14px}
.btn-circulo-x{width:44px;height:44px;min-width:44px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none;font-size:20px;font-weight:800;line-height:1;cursor:pointer;border:none}
.btn-circulo-x:hover{background:#9A0816}
.header-left h1{font-size:22px;font-weight:800;color:#111;line-height:1.1}
.header-left p{font-size:12.5px;color:#6b7280;margin-top:3px}
.bell{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FEF2F2;border-radius:50%}
.bell-count{position:absolute;top:-4px;right:-4px;background:#E30613;color:white;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.contenido{padding:20px 24px 40px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);display:flex;gap:16px}
.logo-restaurante{width:62px;height:62px;min-width:62px;border-radius:14px;background:#FEF2F2;border:1px solid #FEE2E2;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#B70A1A;overflow:hidden}
.logo-restaurante img{width:100%;height:100%;object-fit:cover}
.info-principal{flex:1;min-width:0}
.codigo{font-size:13px;font-weight:800;color:#B70A1A}
.nombre-restaurante{font-size:16px;font-weight:800;color:#111;margin-top:2px}
.para-quien{font-size:13px;color:#374151;margin-top:2px}
.para-quien b{color:#111}
.detalle{font-size:12.5px;color:#6b7280;margin-top:4px}
.tiempo-real{margin-top:10px;display:flex;align-items:center;gap:8px}
.tiempo-real span{font-size:12px;color:#B70A1A;font-weight:700;background:#FEF2F2;padding:5px 10px;border-radius:999px}
.barra{height:6px;background:#F3F4F6;border-radius:999px;margin-top:8px;overflow:hidden}
.barra div{height:100%;background:#B70A1A;border-radius:999px;transition:width 1s}
.procesos{width:200px;min-width:200px;border-left:1px solid #F3F4F6;padding-left:16px;display:flex;flex-direction:column;gap:10px}
.proceso{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.3;color:#9CA3AF}
.proceso b{display:block;color:#9CA3AF}
.proceso .punto{width:22px;height:22px;min-width:22px;border-radius:50%;background:#F3F4F6;color:#9CA3AF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.proceso.activo{color:#111}
.proceso.activo b{color:#111}
.proceso.activo .punto{background:#B70A1A;color:#fff}
.proceso.hecho{color:#111}
.proceso.hecho b{color:#111}
.proceso.hecho .punto{background:#16A34A;color:#fff}
.vacio{background:#fff;border:1px dashed #ddd;border-radius:16px;padding:30px 20px;text-align:center;color:#6b7280;font-size:13.5px;line-height:1.5}
@media(max-width:760px){
  .header-top{padding:12px 14px}
  .header-left h1{font-size:18px}
  .contenido{padding:14px}
  .card{flex-direction:column}
  .procesos{width:100%;min-width:0;border-left:none;border-top:1px solid #F3F4F6;padding-left:0;padding-top:12px}
}
</style>
</head>
<body>

<div class="header-top">
  <div class="header-left">
    <a href="paneladmin.html" class="btn-circulo-x" title="Regresar a Panel Admin">✕</a>
    <div>
      <h1>Seguimiento de pedidos</h1>
      <p>Aquí llegan los pedidos apenas el cliente los confirma.</p>
    </div>
  </div>
  <div class="bell" id="bellIcon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B70A1A" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="bell-count" id="bellCount">0</span>
  </div>
</div>

<div class="contenido" id="listaPrePedidos">
  <div class="vacio"><b style="color:#111;font-size:15px">Esperando Pre-Pedidos...</b><br>Cuando un cliente le de Finalizar pedido, aquí te va a aparecer en tiempo real, y también le va a llegar al restaurante.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// MISMA CONFIG QUE TU ARCHIVO TERMINAR Y PAGAR - DONDE SE CREA EL PEDIDO
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  databaseURL: "https://doloya-confirmacion-default-rtdb.firebaseio.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);

const lista = document.getElementById('listaPrePedidos');
const bellCount = document.getElementById('bellCount');
let pedidosReales = [];

function estadoAProcesos(estadoRaw){
  const e = (estadoRaw || "confirmado").toLowerCase();
  let aceptado = 0, preparando = 0, enviado = 0;
  if(e === "confirmado" || e === "nuevo"){ aceptado = 1; }
  if(e === "aceptado" || e === "activo"){ aceptado = 2; preparando = 1; }
  if(e === "preparando" || e === "en_preparacion" || e === "listo" || e === "listo_para_admin"){ aceptado = 2; preparando = 2; enviado = 1; }
  if(e === "enviado_a_repartidor" || e === "en_camino" || e === "recogido" || e === "ir_a_entregar" || e === "ir_a_recoger"){ aceptado = 2; preparando = 2; enviado = 2; }
  if(e === "finalizado" || e === "entregado"){ aceptado = 2; preparando = 2; enviado = 2; }
  return {aceptado, preparando, enviado};
}
function claseProceso(v){
  if(v === 2) return {clase:"hecho", punto:"✓"};
  if(v === 1) return {clase:"activo", punto:"●"};
  return {clase:"", punto:"○"};
}
function barraPorcentaje(estadoRaw){
  const e = (estadoRaw || "").toLowerCase();
  if(e === "aceptado" || e === "activo") return 33;
  if(e === "preparando" || e === "en_preparacion" || e === "listo" || e === "listo_para_admin") return 66;
  if(e === "enviado_a_repartidor" || e === "en_camino" || e === "recogido" || e === "ir_a_entregar" || e === "ir_a_recoger" || e === "finalizado" || e === "entregado") return 100;
  return 15;
}
function formatoTiempo(ms){
  if(!ms) return "Hace un momento";
  const diff = Math.max(0, Math.floor((Date.now() - ms)/1000));
  if(diff < 60) return "Hace " + diff + " seg";
  if(diff < 3600) return "Hace " + Math.floor(diff/60) + " min";
  if(diff < 86400) return "Hace " + Math.floor(diff/3600) + " h";
  return "Hace " + Math.floor(diff/86400) + " d";
}
function obtenerTiempoMs(d){
  const c = d.fecha || d.fechaCreacion || d.createdAt || d.timestamp;
  if(!c) return Date.now();
  if(typeof c === "number") return c;
  if(c.seconds) return c.seconds * 1000;
  const t = new Date(c).getTime();
  return isNaN(t) ? Date.now() : t;
}
function render(){
  if(pedidosReales.length === 0){
    lista.innerHTML = `<div class="vacio"><b style="color:#111;font-size:15px">Sin Pre-Pedidos por ahora</b><br>Cuando un cliente le de Finalizar pedido, aquí te va a aparecer en tiempo real.</div>`;
    bellCount.textContent = "0";
    return;
  }
  bellCount.textContent = pedidosReales.length;
  lista.innerHTML = pedidosReales.map(p=>{
    const d = p.data;
    const codigo = d.numeroPedido || d.codigo || p.id;
    const nombreRest = d.restaurante?.nombre || "Restaurante";
    const letra = (nombreRest||"R").charAt(0).toUpperCase();
    const cliente = d.cliente?.nombre || d.nombre || "Cliente";
    const total = d.totales?.total || d.total || 0;
    const productos = (d.productos || []).map(pr=> (pr.cantidad||1) + "x " + (pr.nombre||"Producto")).join(" • ") || "Pedido";
    const estado = d.estado || "confirmado";
    const proc = estadoAProcesos(estado);
    const pa = claseProceso(proc.aceptado);
    const pp = claseProceso(proc.preparando);
    const pe = claseProceso(proc.enviado);
    const tiempoMs = obtenerTiempoMs(d);
    return `
    <div class="card" data-tiempo="${tiempoMs}">
      <div class="logo-restaurante">${letra}</div>
      <div class="info-principal">
        <div class="codigo">Código: ${codigo}</div>
        <div class="nombre-restaurante">${nombreRest}</div>
        <div class="para-quien">Le llegó a: <b>${nombreRest}</b> • Cliente: <b>${cliente}</b></div>
        <div class="detalle">${productos} • Total $ ${Number(total).toLocaleString('es-CO')} • ${d.metodoPago?.tipo || "Efectivo"}</div>
        <div class="tiempo-real"><span class="texto-tiempo">${formatoTiempo(tiempoMs)}</span></div>
        <div class="barra"><div style="width:${barraPorcentaje(estado)}%"></div></div>
      </div>
      <div class="procesos">
        <div class="proceso ${pa.clase}"><span class="punto">${pa.punto}</span><div><b>Aceptado</b>${proc.aceptado===2?"El restaurante lo aceptó":proc.aceptado===1?"Esperando que lo acepte":"Aún no lo acepta"}</div></div>
        <div class="proceso ${pp.clase}"><span class="punto">${pp.punto}</span><div><b>Preparando</b>${proc.preparando===2?"Ya lo está preparando":proc.preparando===1?"Lo está preparando ahora":"Aún no lo prepara"}</div></div>
        <div class="proceso ${pe.clase}"><span class="punto">${pe.punto}</span><div><b>Enviado</b>${proc.enviado===2?"Ya lo envió":proc.enviado===1?"Ya lo envió a repartidor":"Aún no lo envía"}</div></div>
      </div>
    </div>`;
  }).join("");
}

// CORREGIDO - AHORA LEE DE "pedidos", DONDE TU ARCHIVO TERMINAR Y PAGAR LO GUARDA
onSnapshot(collection(db, "pedidos"), (snap)=>{
  const ESTADOS_FINALES = ["finalizado","entregado","cancelado"];
  pedidosReales = snap.docs
    .map(doc=>({id: doc.id, data: doc.data()}))
    .filter(p=> !ESTADOS_FINALES.includes((p.data.estado||"").toLowerCase()))
    .sort((a,b)=> obtenerTiempoMs(b.data) - obtenerTiempoMs(a.data));
  render();
});

setInterval(()=>{
  document.querySelectorAll('.card').forEach(card=>{
    const ms = parseInt(card.getAttribute('data-tiempo'));
    const el = card.querySelector('.texto-tiempo');
    if(el) el.textContent = formatoTiempo(ms);
  });
}, 1000);
</script>
</body>
</html>
