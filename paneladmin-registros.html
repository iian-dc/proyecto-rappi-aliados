<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registros - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<!-- FIREBASE COMPAT PARA REALTIME -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FBFBFD;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
/* HEADER - CIRCULO ROJO X + TITULO */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.btn-x{width:42px;height:42px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;text-decoration:none;flex-shrink:0;box-shadow:0 4px 12px rgba(183,10,26,.3)}
.btn-x:active{transform:scale(.95)}
.top h1{font-size:24px;font-weight:800;color:#111;line-height:1}
.top p{font-size:12.5px;color:#6b7280;margin-top:3px}
.count{background:#FFE7EA;color:#B70A1A;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;margin-left:auto}
/* LISTADO */
#lista{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.avatar{width:56px;height:56px;border-radius:50%;background:#FFF0F1;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid #FFE0E3}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar span{font-size:22px;font-weight:900;color:#B70A1A}
.info{flex:1;min-width:0}
.info b{font-size:15.5px;color:#111;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .tipo{font-size:12px;color:#B70A1A;font-weight:700;margin-top:1px}
.info .fecha{font-size:12px;color:#6b7280;margin-top:3px;display:flex;align-items:center;gap:5px}
.btn-abrir{background:#B70A1A;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0}
.btn-abrir:active{transform:scale(.97)}
.empty{background:#fff;border:1px dashed #ddd;border-radius:16px;padding:40px 20px;text-align:center;color:#6b7280;font-size:14px;line-height:1.5}
.empty b{color:#111;font-size:16px;display:block;margin-bottom:6px}
/* MODAL DETALLE */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.modal.show{display:flex}
.modal .box{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 18px;animation:subir .3s ease;max-height:90vh;overflow-y:auto}
@keyframes subir{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal .box-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal .box-top .avatar{width:64px;height:64px}
.modal .box-top b{font-size:18px;color:#111}
.modal .box-top span{font-size:12.5px;color:#B70A1A;font-weight:700}
.modal .cerrar{margin-left:auto;width:34px;height:34px;background:#f3f4f6;border:none;border-radius:50%;font-size:16px;cursor:pointer}
.fila{background:#F8F8F8;border-radius:12px;padding:11px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.fila small{font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;min-width:78px;padding-top:2px}
.fila span{font-size:14px;color:#111;font-weight:600;line-height:1.35;word-break:break-word}
.btn-wa{width:100%;background:#25D366;color:#fff;border:none;padding:14px;border-radius:999px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin-top:14px}
.btn-wa img{width:22px;height:22px}
@media(max-width:600px){
  .top h1{font-size:21px}
  .card{padding:10px}
  .avatar{width:50px;height:50px}
  .btn-abrir{padding:9px 14px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="paneladmin.html" class="btn-x">✕</a>
    <div>
      <h1>Registros</h1>
      <p>Negocios que se registraron en DoloYa</p>
    </div>
    <div class="count" id="totalCount">0 registros</div>
  </div>

  <div id="lista">
    <div class="empty"><b>Cargando registros...</b>Espera un momento</div>
  </div>
</div>

<!-- MODAL ABRIR -->
<div class="modal" id="modal">
  <div class="box">
    <div class="box-top">
      <div class="avatar" id="mAvatar"><span>🏪</span></div>
      <div><b id="mNombre">Negocio</b><br><span id="mTipo">Tipo</span></div>
      <button class="cerrar" onclick="cerrarModal()">✕</button>
    </div>

    <div class="fila"><small>Negocio</small><span id="mNombre2"></span></div>
    <div class="fila"><small>Tipo</small><span id="mTipo2"></span></div>
    <div class="fila"><small>WhatsApp</small><span id="mWhats"></span></div>
    <div class="fila"><small>Dirección</small><span id="mDir"></span></div>
    <div class="fila"><small>Fecha</small><span id="mFecha"></span></div>
    <div class="fila"><small>Estado</small><span id="mEstado"></span></div>

    <button class="btn-wa" id="btnWa" onclick="enviarWhatsApp()">
      <img src="https://img.icons8.com/color/96/whatsapp--v1.png" alt=""> Enviar a WhatsApp
    </button>
  </div>
</div>

<script>
// MISMO FIREBASE DEL REGISTRO
const firebaseConfig = {
  apiKey: "AIzaSyD462705yVQfM8McF8LxnhkR9utTlW3tkE",
  authDomain: "doloya-registro.firebaseapp.com",
  databaseURL: "https://doloya-registro-default-rtdb.firebaseio.com",
  projectId: "doloya-registro",
  storageBucket: "doloya-registro.firebasestorage.app",
  messagingSenderId: "780335945555",
  appId: "1:780335945555:web:d58cda187e9933292573a6",
  measurementId: "G-YZ15ZBRNQ1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let actual = null;
let listaDatos = {};

function formatearFecha(iso){
  if(!iso) return 'Sin fecha';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}) + ' • ' + d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function inicial(nombre){
  return (nombre||'N').trim().charAt(0).toUpperCase();
}
function limpiarNumero(num){
  let n = (num||'').toString().replace(/\D/g,'');
  // Si es de México y tiene 10 dígitos, agregamos 52
  if(n.length===10) n = '52'+n;
  if(n.length===12 && n.startsWith('521')) n = '52'+n.slice(3);
  return n;
}

// ESCUCHAR REGISTROS EN TIEMPO REAL
db.ref('aliados').on('value', (snap)=>{
  const data = snap.val() || {};
  listaDatos = data;
  const lista = document.getElementById('lista');
  const keys = Object.keys(data).reverse(); // Más recientes primero
  document.getElementById('totalCount').textContent = keys.length + ' registro' + (keys.length!==1?'s':'');
  if(keys.length===0){
    lista.innerHTML = '<div class="empty"><b>Aún no hay registros</b>Cuando un negocio se registre en el formulario, aquí te va a aparecer.</div>';
    return;
  }
  lista.innerHTML = keys.map(k=>{
    const r = data[k];
    return `
    <div class="card">
      <div class="avatar"><span>${inicial(r.nombre)}</span></div>
      <div class="info">
        <b>${r.nombre||'Sin nombre'}</b>
        <div class="tipo">${r.tipo||''}</div>
        <div class="fecha">📅 ${formatearFecha(r.fecha)}</div>
      </div>
      <button class="btn-abrir" onclick="abrirRegistro('${k}')">Abrir</button>
    </div>`;
  }).join('');
});

function abrirRegistro(id){
  actual = listaDatos[id];
  if(!actual) return;
  document.getElementById('mNombre').textContent = actual.nombre||'';
  document.getElementById('mNombre2').textContent = actual.nombre||'';
  document.getElementById('mTipo').textContent = actual.tipo||'';
  document.getElementById('mTipo2').textContent = actual.tipo||'';
  document.getElementById('mWhats').textContent = actual.whatsapp||'';
  document.getElementById('mDir').textContent = actual.direccion||'';
  document.getElementById('mFecha').textContent = formatearFecha(actual.fecha);
  document.getElementById('mEstado').textContent = actual.estado||'pendiente';
  document.getElementById('mAvatar').innerHTML = '<span>'+inicial(actual.nombre)+'</span>';
  document.getElementById('modal').classList.add('show');
}
function cerrarModal(){
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') cerrarModal();
});

function enviarWhatsApp(){
  if(!actual) return;
  const numero = limpiarNumero(actual.whatsapp);
  const mensaje = `Hola ${actual.nombre}! 👋 Soy de DoloYa.\n\n¡Felicidades! Tu negocio *${actual.nombre}* ya ha sido registrado exitosamente en DoloYa. ✅\n\nTipo: ${actual.tipo}\nDirección: ${actual.direccion}\n\nYa eres parte de DoloYa, tu negocio más cerca de tus clientes. 🙌\n\n¿Quieres que te ayudemos a activar tu menú?`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`, '_blank');
}
</script>
</body>
</html>
