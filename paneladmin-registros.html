<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registros - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FBFBFD;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 0 40px}
/* HEADER - BIEN A LA IZQUIERDA, PEGADO A LA ESQUINA */
.top{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 10px;margin-bottom:6px}
.btn-x{width:42px;height:42px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;text-decoration:none;flex-shrink:0;box-shadow:0 4px 12px rgba(183,10,26,.3)}
.btn-x:active{transform:scale(.95)}
.top h1{font-size:24px;font-weight:800;color:#111;line-height:1}
.top p{font-size:12.5px;color:#6b7280;margin-top:3px}
.count{background:#FFE7EA;color:#B70A1A;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;margin-left:auto;white-space:nowrap}
.count-visitas{background:#EAF2FF;color:#1D4ED8;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.count-visitas svg{width:15px;height:15px;flex-shrink:0}
/* LISTADO TIPO EXCEL */
.tabla-wrap{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;margin:0 10px;box-shadow:0 2px 10px rgba(0,0,0,.04);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{background:#FFF0F1;color:#B70A1A;font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:11px 12px;font-weight:800}
tbody td{padding:11px 12px;border-top:1px solid #f1f1f1;font-size:14px;color:#111;vertical-align:middle;white-space:nowrap}
tbody tr:first-child td{border-top:none}
/* FILA COMPLETA ROJA / VERDE NEON */
tbody tr.row-rojo{background:#FFE9EB}
tbody tr.row-rojo td{border-top-color:#FFD0D4}
tbody tr.row-verde{background:#E2FFEC}
tbody tr.row-verde td{border-top-color:#B8F5CB}
.avatar{width:48px;height:48px;border-radius:50%;background:#FFF0F1;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid #FFE0E3}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{font-size:20px;font-weight:900;color:#B70A1A}
td.nombre b{font-size:14.5px;display:block}
td.tipo{color:#B70A1A;font-weight:700;font-size:13.5px}
td.fecha{color:#6b7280;font-size:13px}
td.btn-cell{text-align:right}
.btn-abrir{background:#B70A1A;color:#fff;border:none;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer}
.btn-abrir:active{transform:scale(.97)}
.empty{background:#fff;border:1px dashed #ddd;border-radius:16px;padding:40px 20px;text-align:center;color:#6b7280;font-size:14px;line-height:1.5;margin:0 10px}
.empty b{color:#111;font-size:16px;display:block;margin-bottom:6px}
/* MODAL CENTRADO */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;width:100%;max-width:480px;border-radius:22px;padding:20px 18px 18px;animation:subir .3s ease;max-height:90vh;overflow-y:auto}
@keyframes subir{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal .box-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal .box-top .avatar{width:64px;height:64px}
.modal .box-top b{font-size:18px;color:#111}
.modal .box-top span{font-size:12.5px;color:#B70A1A;font-weight:700}
.modal .cerrar{margin-left:auto;width:34px;height:34px;background:#f3f4f6;border:none;border-radius:50%;font-size:16px;cursor:pointer}
.fila{background:#F8F8F8;border-radius:12px;padding:11px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.fila small{font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;min-width:78px;padding-top:2px}
.fila span{font-size:14px;color:#111;font-weight:600;line-height:1.35;word-break:break-word}
/* BOTONES ABAJO - UNO AL LADO DEL OTRO */
.btns-row{display:flex;gap:10px;margin-top:14px}
.btn-wa{flex:1;background:#25D366;color:#fff;border:none;padding:14px 10px;border-radius:999px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-wa img{width:22px;height:22px}
.btn-marcar{flex:1;border:none;padding:14px 10px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;color:#fff}
/* ROJO NEON = SIN REGISTRAR / VERDE NEON = YA REGISTRADO */
.btn-marcar.rojo{background:#FF1E2D;box-shadow:0 0 14px rgba(255,30,45,.65)}
.btn-marcar.verde{background:#00E676;box-shadow:0 0 14px rgba(0,230,118,.65)}
.btn-eliminar{flex:1;background:#111;color:#fff;border:none;padding:14px 10px;border-radius:999px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.btn-eliminar:active{transform:scale(.97)}
@media(max-width:600px){
  .top h1{font-size:21px}
  .btns-row{flex-direction:column}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="paneladmin.html" class="btn-x">✕</a>
    <div>
      <h1>Registros</h1>
      <p>Negocios que se registraron en DoloYa</p>
    </div>
    <div class="count" id="totalCount">0 registros</div>
    <div class="count-visitas" id="totalVisitas"><svg viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span id="visitasNum">0</span> visitas</div>
  </div>

  <div id="lista">
    <div class="empty"><b>Cargando registros...</b>Espera un momento</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="box-top">
      <div class="avatar" id="mAvatar"><span>🏪</span></div>
      <div><b id="mNombre">Negocio</b><br><span id="mTipo">Tipo</span></div>
      <button class="cerrar" onclick="cerrarModal()">✕</button>
    </div>

    <div class="fila"><small>Negocio</small><span id="mNombre2"></span></div>
    <div class="fila"><small>Tipo</small><span id="mTipo2"></span></div>
    <div class="fila"><small>WhatsApp</small><span id="mWhats"></span></div>
    <div class="fila"><small>Dirección</small><span id="mDir"></span></div>
    <div class="fila"><small>Fecha</small><span id="mFecha"></span></div>
    <div class="fila"><small>Estado</small><span id="mEstado"></span></div>

    <div class="btns-row">
      <button class="btn-wa" id="btnWa" onclick="enviarWhatsApp()">
        <img src="https://img.icons8.com/color/96/whatsapp--v1.png" alt=""> Notificar registro
      </button>
      <button class="btn-marcar rojo" id="btnMarcar" onclick="toggleRegistrado()">Marcar registrado</button>
      <button class="btn-eliminar" id="btnEliminar" onclick="eliminarRegistro()">🗑 Eliminar</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD462705yVQfM8McF8LxnhkR9utTlW3tkE",
  authDomain: "doloya-registro.firebaseapp.com",
  databaseURL: "https://doloya-registro-default-rtdb.firebaseio.com",
  projectId: "doloya-registro",
  storageBucket: "doloya-registro.firebasestorage.app",
  messagingSenderId: "780335945555",
  appId: "1:780335945555:web:d58cda187e9933292573a6",
  measurementId: "G-YZ15ZBRNQ1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let actual = null;
let actualId = null;
let listaDatos = {};

function formatearFecha(iso){
  if(!iso) return 'Sin fecha';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}) + ' • ' + d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function inicial(nombre){
  return (nombre||'N').trim().charAt(0).toUpperCase();
}
function fotoDe(r){
  return r.foto || r.fotoUrl || r.imagen || r.fotoData || r.image || '';
}
function avatarHTML(r){
  const f = fotoDe(r);
  if(f) return `<img src="${f}" alt="">`;
  return `<span>${inicial(r.nombre)}</span>`;
}
function limpiarNumero(num){
  let n = (num||'').toString().replace(/\D/g,'');
  if(n.length===10) n = '52'+n;
  if(n.length===12 && n.startsWith('521')) n = '52'+n.slice(3);
  return n;
}
function esRegistrado(r){
  return r.registrado === true || r.estado === 'registrado';
}
function actualizarBotonMarcar(){
  const btn = document.getElementById('btnMarcar');
  if(!actual) return;
  if(esRegistrado(actual)){
    btn.className = 'btn-marcar verde';
    btn.textContent = '✓ Registrado';
  } else {
    btn.className = 'btn-marcar rojo';
    btn.textContent = 'Marcar registrado';
  }
}

// CONTADOR DE VISITAS - desde estadisticas/visitas
db.ref('estadisticas/visitas').on('value', (snap)=>{
  const visitas = snap.val() || 0;
  document.getElementById('visitasNum').textContent = Number(visitas).toLocaleString('es-MX');
});

db.ref('aliados').on('value', (snap)=>{
  const data = snap.val() || {};
  listaDatos = data;
  const lista = document.getElementById('lista');
  const keys = Object.keys(data).reverse();
  document.getElementById('totalCount').textContent = keys.length + ' registro' + (keys.length!==1?'s':'');
  if(keys.length===0){
    lista.innerHTML = '<div class="empty"><b>Aún no hay registros</b>Cuando un negocio se registre en el formulario, aquí te va a aparecer.</div>';
    return;
  }
  // Si el modal está abierto, actualizar el estado actual
  if(actualId && listaDatos[actualId]){
    actual = listaDatos[actualId];
    actualizarBotonMarcar();
    document.getElementById('mEstado').textContent = esRegistrado(actual) ? 'registrado' : (actual.estado||'pendiente');
  }
  lista.innerHTML = `
  <div class="tabla-wrap">
    <table>
      <thead><tr><th>Foto</th><th>Nombre del restaurante</th><th>Tipo de negocio</th><th>Fecha</th><th style="text-align:right">Acción</th></tr></thead>
      <tbody>
      ${keys.map(k=>{
        const r = data[k];
        const claseFila = esRegistrado(r) ? 'row-verde' : 'row-rojo';
        return `
        <tr class="${claseFila}">
          <td><div class="avatar">${avatarHTML(r)}</div></td>
          <td class="nombre"><b>${r.nombre||'Sin nombre'}</b></td>
          <td class="tipo">${r.tipo||''}</td>
          <td class="fecha">📅 ${formatearFecha(r.fecha)}</td>
          <td class="btn-cell"><button class="btn-abrir" onclick="abrirRegistro('${k}')">Abrir</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
});

function abrirRegistro(id){
  actualId = id;
  actual = listaDatos[id];
  if(!actual) return;
  document.getElementById('mNombre').textContent = actual.nombre||'';
  document.getElementById('mNombre2').textContent = actual.nombre||'';
  document.getElementById('mTipo').textContent = actual.tipo||'';
  document.getElementById('mTipo2').textContent = actual.tipo||'';
  document.getElementById('mWhats').textContent = actual.whatsapp||'';
  document.getElementById('mDir').textContent = actual.direccion||'';
  document.getElementById('mFecha').textContent = formatearFecha(actual.fecha);
  document.getElementById('mEstado').textContent = esRegistrado(actual) ? 'registrado' : (actual.estado||'pendiente');
  document.getElementById('mAvatar').innerHTML = avatarHTML(actual);
  actualizarBotonMarcar();
  document.getElementById('modal').classList.add('show');
}
function cerrarModal(){
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') cerrarModal();
});

async function toggleRegistrado(){
  if(!actualId || !actual) return;
  const nuevo = !esRegistrado(actual);
  await db.ref('aliados/' + actualId).update({
    registrado: nuevo,
    estado: nuevo ? 'registrado' : 'pendiente'
  });
  // El listener de Firebase ya actualiza el botón y la fila solito
}

async function eliminarRegistro(){
  if(!actualId || !actual) return;
  const ok = confirm('¿Seguro quieres eliminar a "' + (actual.nombre||'este negocio') + '"?\n\nYa no va a aparecer en Registros.');
  if(!ok) return;
  await db.ref('aliados/' + actualId).remove();
  actual = null;
  actualId = null;
  cerrarModal();
}

function enviarWhatsApp(){
  if(!actual) return;
  const numero = limpiarNumero(actual.whatsapp);
  const mensaje = `Hola ${actual.nombre}! 👋 Soy de DoloYa.\n\n¡Felicidades! Tu negocio *${actual.nombre}* ya ha sido registrado exitosamente en DoloYa. ✅\n\nTipo: ${actual.tipo}\nDirección: ${actual.direccion}\n\nYa eres parte de DoloYa, tu negocio más cerca de tus clientes. 🙌\n\n¿Quieres que te ayudemos a activar tu menú?`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`, '_blank');
}
</script>
</body>
</html>
