<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuraciones - DoloYa Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#F5F5F7;min-height:100vh}
:root{--rojo:#C50D1F;--rojo2:#E30613;--negro:#11141A}
.top-header{background:var(--rojo);display:flex;align-items:center;gap:14px;padding:0 18px 0 12px;height:64px;position:sticky;top:0;z-index:100}
.btn-x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:white;border:none;border-radius:50%;flex-shrink:0}
.btn-x svg{width:18px;height:18px;stroke:var(--rojo2);stroke-width:3}
.top-left-text h1{color:white;font-size:22px;font-weight:800;line-height:1.1}
.top-left-text p{color:rgba(255,255,255,0.85);font-size:12px;font-weight:500}
.main{padding:18px;max-width:1100px;margin:0 auto}
.card-white{background:white;border:1.5px solid #EFEFF1;border-radius:14px;padding:16px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card-head h3{font-size:16px;font-weight:800}
.btn-black{background:var(--negro);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.btn-red{background:var(--rojo2);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
.grid-cat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid-cat{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-cat{grid-template-columns:1fr}}
.cat-card{background:white;border:1.5px solid #EFEFF1;border-radius:12px;padding:14px 12px 12px;display:flex;gap:12px;align-items:center;position:relative}
.cat-img{width:64px;height:64px;border-radius:14px;background:#F3F4F6;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #EDEEF0}
.cat-img img{width:42px;height:42px;object-fit:contain}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-key{font-size:11px;color:#6B7280}
.cat-actions{display:flex;gap:6px;margin-top:6px}
.btn-mini{border:1.5px solid #E5E7EB;background:white;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer}
.btn-mini.del{border-color:#FFE1E6;color:#E30613;background:#FFF1F2}
.switch-mini{width:34px;height:20px;background:#D1D5DB;border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch-mini.on{background:#22C55E}
.switch-mini::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%;transition:.2s}
.switch-mini.on::after{transform:translateX(14px)}
.input{border:1.5px solid #E5E7EB;border-radius:8px;height:38px;padding:0 12px;font-size:13px;outline:none;flex:1;min-width:180px}
.label{font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;display:block;margin-top:10px}
.preview-box{width:80px;height:80px;border-radius:12px;background:#F3F4F6;border:1.5px dashed #D1D5DB;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview-box img{width:100%;height:100%;object-fit:contain}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;display:none;z-index:9999}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:white;border-radius:18px;padding:22px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.3);animation:pop .2s}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.modal-box h3{font-size:15px;font-weight:800;margin-bottom:8px}
.modal-box p{font-size:12px;color:#6B7280;margin-bottom:18px}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;border-radius:10px;padding:10px;font-size:13px;font-weight:800;border:none;cursor:pointer}
.btn-cancel{background:#F3F4F6;color:#111}
.btn-confirm{background:#E30613;color:white}
.badge-count{position:absolute;top:8px;right:8px;background:#11141A;color:white;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;min-width:50px;text-align:center}
.badge-count.cero{background:#F3F4F6;color:#9CA3AF;border:1px solid #E5E7EB}
</style>
</head>
<body>
<div class="top-header">
  <button class="btn-x" onclick="location.href='paneladmin.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
  <div class="top-left-text"><h1>Configuraciones</h1><p>Administra categorías</p></div>
</div>

<div class="main">
  <div class="card-white">
    <div class="card-head">
      <h3>Categorías</h3>
      <div style="display:flex;gap:8px">
        <button class="btn-black" onclick="document.getElementById('formAdd').style.display='block'">+ Agregar categoría</button>
      </div>
    </div>
    
    <div id="formAdd" style="display:none;border:1.5px solid #EFEFF1;border-radius:12px;padding:14px;background:#FAFAFB">
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div>
          <label class="label">Imagen (3D)</label>
          <div class="preview-box" id="previewBox"><span style="font-size:10px;color:#9CA3AF">Sin imagen</span></div>
          <input type="file" id="fileImg" accept="image/*" style="margin-top:8px;font-size:12px">
          <label class="label">URL de imagen</label>
          <input id="inpImagenUrl" class="input" placeholder="URL automática" style="font-size:11px;min-width:260px">
          <div id="statusUrl" style="font-size:10px;color:#16A34A;margin-top:4px"></div>
        </div>
        <div style="flex:1;min-width:220px">
          <label class="label">Nombre (Ej: Alitas)</label><input id="inpNombre" class="input" placeholder="Alitas">
          <label class="label">Key</label><input id="inpKey" class="input" placeholder="alitas">
          <label class="label">Orden</label><input id="inpOrden" type="number" class="input" value="1" style="max-width:100px">
          <div style="margin-top:12px;display:flex;gap:8px">
            <button class="btn-red" id="btnGuardar" onclick="guardarCategoria()">Guardar</button>
            <button class="btn-mini" onclick="cancelarForm()">Cancelar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-cat" id="gridCats" style="margin-top:16px"></div>
  </div>
</div>

<div id="modalConfirm" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modalTitle">¿Eliminar categoría?</h3>
    <p id="modalText">Esta acción no se puede deshacer</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" id="btnModalOk">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let editKey = null;
let urlImagenFinal = '';
let keyAEliminar = null;
const pathCats = 'config_global/categorias_inicio';
let conteoPorCategoria = {};

function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}
function cancelarForm(){
  document.getElementById('formAdd').style.display='none';
  document.getElementById('inpNombre').value=''; document.getElementById('inpKey').value=''; document.getElementById('inpImagenUrl').value=''; urlImagenFinal=''; editKey=null;
  document.getElementById('previewBox').innerHTML='<span style="font-size:10px;color:#9CA3AF">Sin imagen</span>';
  document.getElementById('statusUrl').textContent='';
}
window.cancelarForm=cancelarForm;

document.getElementById('inpNombre').addEventListener('input',()=>{
  const n = document.getElementById('inpNombre').value.toLowerCase().trim().replace(/\s+/g,'');
  if(!editKey) document.getElementById('inpKey').value = n;
});

function comprimirADataURL(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 300;
        let w = img.width, h = img.height;
        if(w > maxW){ h = h*(maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('fileImg').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('statusUrl').textContent='Generando URL...';
  const dataUrl = await comprimirADataURL(f);
  urlImagenFinal = dataUrl;
  document.getElementById('inpImagenUrl').value = dataUrl;
  document.getElementById('previewBox').innerHTML=`<img src="${dataUrl}">`;
  document.getElementById('statusUrl').textContent='✅ URL generada lista para guardar';
});

function abrirModalEliminar(k, nombre){
  keyAEliminar = k;
  document.getElementById('modalTitle').textContent = `¿Eliminar ${nombre}?`;
  document.getElementById('modalText').textContent = `Se eliminará ${k} de config_global/categorias_inicio`;
  document.getElementById('modalConfirm').classList.add('open');
}
window.cerrarModal = ()=>{
  document.getElementById('modalConfirm').classList.remove('open');
  keyAEliminar = null;
}
document.getElementById('btnModalOk').addEventListener('click', async ()=>{
  if(!keyAEliminar) return;
  if(keyAEliminar==='todos'){ toast('Todos no se puede eliminar'); cerrarModal(); return; }
  await remove(ref(db, `${pathCats}/${keyAEliminar}`));
  toast('Eliminado');
  cerrarModal();
});

// CONTEO 100% REAL DESDE TU RUTA: doloya_aliados -> info -> categoria
async function calcularConteos(){
  conteoPorCategoria = {};
  try{
    const snapCats = await get(ref(db, pathCats));
    if(snapCats.exists()){
      Object.keys(snapCats.val()).forEach(k=> {
        if(k!=='_info' && k!=='info') conteoPorCategoria[k.toLowerCase()]=0;
      });
    }
    const snapAliados = await get(ref(db, 'doloya_aliados'));
    if(!snapAliados.exists()) return;
    const aliados = snapAliados.val();
    let total = 0;
    Object.values(aliados).forEach(aliado=>{
      if(!aliado || typeof aliado!=='object') return;
      total++;
      let cat = '';
      // LEE EXACTAMENTE DE DONDE ME SEÑALASTE: info -> categoria
      if(aliado.info && aliado.info.categoria){
        cat = aliado.info.categoria;
      } else if(aliado.categorias && aliado.categorias._info){
        cat = aliado.categorias._info;
      } else if(aliado.categoria){
        cat = aliado.categoria;
      }
      cat = cat.toString().toLowerCase().trim();
      if(!cat) return;
      
      // cuenta exacto como está guardado
      if(conteoPorCategoria[cat]!==undefined) conteoPorCategoria[cat]++;
      // por si tu key es plural y tu categoria singular (burger vs burgers)
      if(cat==='burger' && conteoPorCategoria['burgers']!==undefined) conteoPorCategoria['burgers']++;
      if(cat==='burgers' && conteoPorCategoria['burger']!==undefined) conteoPorCategoria['burger']++;
      if(cat==='pizza' && conteoPorCategoria['pizzas']!==undefined) conteoPorCategoria['pizzas']++;
      if(cat==='pizzas' && conteoPorCategoria['pizza']!==undefined) conteoPorCategoria['pizza']++;
    });
    conteoPorCategoria['todos'] = total;
    
    document.querySelectorAll('.cat-card').forEach(card=>{
      const key = card.getAttribute('data-key').toLowerCase();
      const count = conteoPorCategoria[key] ?? 0;
      const badge = card.querySelector('.badge-count');
      if(badge){
        badge.textContent = count + ' rest.';
        badge.classList.toggle('cero', count===0);
      }
    });
  }catch(e){ console.log('error conteo',e); }
}

function cargar(){
  onValue(ref(db, pathCats), async snap=>{
    const grid=document.getElementById('gridCats');
    let data=snap.val();
    if(!data || Object.keys(data).length===0){
      grid.innerHTML='<p style="padding:20px;color:#6B7280;text-align:center">No hay categorías aún.</p>';
      return;
    }
    const arr=Object.values(data).filter(c=>c.key!=='info' && c.key!=='_info').sort((a,b)=>(a.orden||99)-(b.orden||99));
    grid.innerHTML='';
    arr.forEach(c=>{
      const count = conteoPorCategoria[c.key.toLowerCase()] ?? 0;
      grid.innerHTML+=`
      <div class="cat-card" data-key="${c.key}">
        <div class="badge-count ${count===0?'cero':''}">${count} rest.</div>
        <div class="cat-img"><img src="${c.imagen||'https://img.icons8.com/3d-fluency/94/bento.png'}" onerror="this.src='https://img.icons8.com/3d-fluency/94/bento.png'"></div>
        <div class="cat-info">
          <div class="cat-name">${c.nombre}</div>
          <div class="cat-key">${c.key} • orden ${c.orden||0}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <div class="switch-mini ${c.activa!==false?'on':''}" onclick="toggleActiva('${c.key}')"></div>
            <span style="font-size:10px;color:#6B7280">${c.activa!==false?'Activa':'Oculta'}</span>
          </div>
          <div class="cat-actions">
            <button class="btn-mini" onclick="editarCat('${c.key}')">Editar</button>
            <button class="btn-mini del" onclick="abrirModalEliminarCat('${c.key}','${c.nombre}')">Eliminar</button>
          </div>
        </div>
      </div>`;
    });
    calcularConteos();
  });
  // escucha cambios en aliados para actualizar conteo en vivo
  onValue(ref(db, 'doloya_aliados'), ()=>{ calcularConteos(); });
}
window.toggleActiva=async(k)=>{
  const snap=await get(ref(db, `${pathCats}/${k}`));
  if(!snap.exists()) return;
  const v=snap.val();
  await update(ref(db, `${pathCats}/${k}`), {activa: !(v.activa!==false)});
  toast('Actualizado');
}
window.editarCat=async(k)=>{
  const snap=await get(ref(db, `${pathCats}/${k}`));
  if(!snap.exists()) return;
  const c=snap.val();
  editKey=k;
  urlImagenFinal=c.imagen||'';
  document.getElementById('formAdd').style.display='block';
  document.getElementById('inpNombre').value=c.nombre||'';
  document.getElementById('inpKey').value=c.key||'';
  document.getElementById('inpOrden').value=c.orden||1;
  document.getElementById('inpImagenUrl').value=c.imagen||'';
  document.getElementById('previewBox').innerHTML= c.imagen ? `<img src="${c.imagen}">` : '<span style="font-size:10px;color:#9CA3AF">Sin imagen</span>';
  document.getElementById('statusUrl').textContent='Datos cargados de Firebase, listos para editar';
  window.scrollTo({top:0, behavior:'smooth'});
}
window.abrirModalEliminarCat=(k,nombre)=>{ abrirModalEliminar(k,nombre); }

window.guardarCategoria=async()=>{
  const nombre=document.getElementById('inpNombre').value.trim();
  let key=document.getElementById('inpKey').value.trim().toLowerCase().replace(/\s+/g,'');
  const orden=parseInt(document.getElementById('inpOrden').value)||99;
  const inputVal=document.getElementById('inpImagenUrl').value.trim();
  if(inputVal) urlImagenFinal = inputVal;
  
  if(!nombre || !key){ toast('Nombre y key requeridos'); return; }
  if(key==='info' || key==='_info'){ toast('Info no permitido'); return; }
  if(!urlImagenFinal){ toast('Sube una imagen primero'); return; }

  let fechaExistente = Date.now();
  if(editKey){
    const snap = await get(ref(db, `${pathCats}/${editKey}`));
    if(snap.exists()) fechaExistente = snap.val().fecha || Date.now();
  }

  const payload={
    key: key,
    nombre: nombre,
    nombreLower: nombre.toLowerCase(),
    imagen: urlImagenFinal,
    activa: true,
    orden: orden,
    fecha: fechaExistente
  };
  try{
    if(editKey && editKey!==key){
      await remove(ref(db, `${pathCats}/${editKey}`));
    }
    await set(ref(db, `${pathCats}/${key}`), payload);
    toast('Guardado correctamente');
    cancelarForm();
  }catch(e){
    toast('Error: '+e.message);
  }
}
cargar();
</script>
</body>
</html>
