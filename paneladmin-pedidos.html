<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Admin DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FAFAFA;min-height:100vh}
.header{height:76px;background:white;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.h-left{display:flex;align-items:center;gap:12px}
.btn-x{width:38px;height:38px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer}
.header-title h1{font-size:22px;font-weight:800;color:#111;line-height:1}
.header-title p{font-size:12px;color:#6b7a8d;margin-top:2px}
.h-right{display:flex;align-items:center;gap:18px;margin-left:auto}
.bell{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell-count{position:absolute;top:-6px;right:-6px;background:#E30613;color:white;min-width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bell.vibrar{animation:bell3d .15s infinite}
@keyframes bell3d{0%{transform:rotate(-15deg) scale(1.2)}25%{transform:rotate(15deg) scale(1.35)}50%{transform:rotate(-12deg) scale(1.25)}75%{transform:rotate(12deg) scale(1.3)}100%{transform:rotate(-15deg) scale(1.2)}}
.admin-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #f1f5f9;border-radius:999px;padding:4px 12px 4px 4px}
.admin-avatar{width:34px;height:34px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.tabs{display:flex;gap:10px;padding:18px 18px 10px;overflow-x:auto;white-space:nowrap}
.tab{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:#334155;display:flex;align-items:center;gap:8px;cursor:pointer}
.tab.active{background:#B70A1A;color:white;border-color:#B70A1A}
.tab-count{background:#f1f5f9;color:#334155;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tab.active .tab-count{background:white;color:#B70A1A}
.container{padding:12px 18px 30px}
.card{position:relative;background:white;border:1px solid #eef0f3;border-radius:14px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.03);margin-bottom:12px;overflow:hidden;transition:all .3s}
.card.is-cancelado{border:2px solid #ff1744 !important;background:linear-gradient(135deg,#fff5f5 0%, #ffe3e3 100%) !important;box-shadow:0 0 0 3px rgba(255,23,68,.12), 0 0 22px rgba(255,23,68,.38), 0 4px 16px rgba(0,0,0,.06) !important;animation:neonPulse 1.8s infinite}
@keyframes neonPulse{0%{box-shadow:0 0 0 3px rgba(255,23,68,.12), 0 0 22px rgba(255,23,68,.38)}50%{box-shadow:0 0 0 5px rgba(255,23,68,.18), 0 0 32px rgba(255,23,68,.55)}100%{box-shadow:0 0 0 3px rgba(255,23,68,.12), 0 0 22px rgba(255,23,68,.38)}}
.card-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-id{display:flex;align-items:center;gap:8px}
.id-badge{background:#B70A1A;color:white;padding:5px 14px;border-radius:999px;font-weight:800;font-size:12px}
.card.is-cancelado .id-badge{background:#ff1744 !important;box-shadow:0 0 10px rgba(255,23,68,.7)}
.card-date{display:flex;align-items:center;gap:10px;font-size:11px;color:#334155}
.card-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;gap:10px;padding:10px 0 8px;border-bottom:1px solid #f1f5f9}
@media(max-width:900px){.card-grid{grid-template-columns:1fr 1fr}}
.label{font-size:10px;color:#64748b;font-weight:600;margin-bottom:2px}
.value{font-size:12px;font-weight:600;color:#0f172a;line-height:1.3}
.value small{font-weight:400;color:#64748b;display:block;font-size:11px}
.card-bottom{display:grid;grid-template-columns:.7fr 1fr 1.2fr .9fr;gap:10px;padding:10px 0 6px;align-items:start}
@media(max-width:900px){.card-bottom{grid-template-columns:1fr 1fr}}
.product-item{display:flex;justify-content:space-between;font-size:11.5px;color:#334155;padding:2px 0}
.total-box .line{display:flex;justify-content:space-between;font-size:11.5px;color:#334155;padding:1px 0}
.total-final{font-size:11px;font-weight:700;color:#0f172a;margin-top:6px;border-top:1px solid #e5e7eb;padding-top:6px}
.total-final b{font-size:15px;color:#B70A1A;font-weight:800}
.acciones{display:flex;gap:8px;padding-top:6px;flex-wrap:wrap}
.btn-rojo{background:#16a34a;color:white;border:none;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:1;min-width:140px}
.btn-rojo:disabled{background:#94a3b8;cursor:not-allowed;opacity:0.6}
.btn-gris{background:#94a3b8;color:white;border:none;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:1;min-width:140px;opacity:.6;pointer-events:none}
.btn-verde{background:#16a34a;color:white;border:none;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:1;min-width:140px;box-shadow:0 3px 12px rgba(22,163,74,.35)}
.btn-borde{background:white;border:1px solid #d1d5db;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:600;color:#475569;display:flex;align-items:center;gap:5px;cursor:pointer}
.btn-cancelado-rojo-claro{width:100%;background:#ff8a8a !important;color:white;border:none;border-radius:10px;padding:12px 14px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(255,123,123,.5)}
.vacio{text-align:center;padding:40px;color:#94a3b8}
.tiempo-real{border-radius:999px;padding:3px 10px;font-size:10px;font-weight:900;display:inline-flex;align-items:center;gap:4px}
.tiempo-verde{background:#16a34a;color:white}
.tiempo-amarillo{background:#EAB308;color:white}
.tiempo-rojo{background:#EF4444;color:white}
.tracking{display:flex;flex-direction:column;gap:0;border-left:2px dashed #e5e7eb;padding-left:8px;margin-left:2px}
.track-item{display:flex;align-items:center;gap:6px;padding:4px 0;position:relative;font-size:11px;color:#94a3b8}
.track-item::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#e5e7eb;border:2px solid white}
.track-item.active::before{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.track-item.active{color:#0f172a;font-weight:700}
.track-icon{width:18px;height:18px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center}
.track-item.active .track-icon{background:#dcfce7}
.icon-row{display:flex;align-items:center;gap:5px}
.card-overlay{position:absolute;inset:0;background:rgba(255,255,255,0.93);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:10;border-radius:14px;padding:12px;flex-direction:column}
.card-overlay.open{display:flex}
.overlay-box{background:white;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.15);padding:14px;max-width:90%;width:380px;text-align:center}
.reps-row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.rep-card{min-width:100px;background:#fafafa;border:1px solid #e5e7eb;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rep-img{width:48px;height:48px;border-radius:50%;background:#f1f5f9;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rep-name{font-size:11px;font-weight:700;color:#0f172a}
.rep-est{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700}
.rep-est.disponible{background:#dcfce7;color:#16a34a}
.rep-est.ocupado{background:#fee2e2;color:#ef4444}
.btn-enviar-rep{background:#B70A1A;color:white;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;width:100%}
.btn-enviar-rep:disabled{background:#94a3b8}
.hist-box{width:360px}
.hist-title{font-size:14px;font-weight:800;color:#111;margin-bottom:6px}
.hist-sub{font-size:11px;color:#64748b;margin-bottom:14px}
.hist-actions{display:flex;gap:10px;justify-content:center}
.btn-si{background:#16a34a;color:white;border:none;border-radius:10px;padding:10px 18px;font-size:12px;font-weight:800;cursor:pointer;flex:1}
.btn-no{background:white;color:#475569;border:1px solid #e2e8f0;border-radius:10px;padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;flex:1}
</style>
</head>
<body>
<div class="header">
  <div class="h-left">
    <button class="btn-x" onclick="window.location.href='paneladmin.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="header-title"><h1>Pedidos</h1><p>Gestiona y da seguimiento a todos los pedidos</p></div>
  </div>
  <div class="h-right">
    <div class="bell" id="bellIcon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B70A1A" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-count" id="bellCount">0</span></div>
    <div class="admin-chip"><div class="admin-avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div style="line-height:1.1"><b style="font-size:12px;display:block">Administrador</b><small style="font-size:11px;color:#6b7280">DoloYa</small></div></div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-f="todos">Todos <span class="tab-count" id="c-todos">0</span></div>
  <div class="tab" data-f="sin_enviar">Sin enviar a repartidor <span class="tab-count" id="c-sin">0</span></div>
  <div class="tab" data-f="enviado">Enviado a repartidor <span class="tab-count" id="c-enviado">0</span></div>
  <div class="tab" data-f="recogido">Recogido <span class="tab-count" id="c-recogido">0</span></div>
  <div class="tab" data-f="en_camino">En camino a entregar <span class="tab-count" id="c-camino">0</span></div>
  <div class="tab" data-f="finalizado">Finalizado <span class="tab-count" id="c-fin">0</span></div>
  <div class="tab" data-f="cancelado">Cancelado <span class="tab-count" id="c-cancel">0</span></div>
</div>
<div class="container" id="listaPedidos"><div class="vacio">Esperando pedidos del restaurante...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const configAdmin = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const appAdmin = initializeApp(configAdmin);
const db = getFirestore(appAdmin);

const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0",
  measurementId: "G-ENELTJ1X6R"
};
const appHistorial = initializeApp(configHistorial, "historialApp");
const dbHistorial = getFirestore(appHistorial);

const configRepartidores = {
  apiKey: "AIzaSyCYdy62kQCPEhz1d-Ln9H-sup2iOTYJPwU",
  authDomain: "doloya-repartidores.firebaseapp.com",
  projectId: "doloya-repartidores",
  storageBucket: "doloya-repartidores.firebasestorage.app",
  messagingSenderId: "308893983803",
  appId: "1:308893983803:web:fe2b85c80f3a203de9a81e",
  measurementId: "G-4Z5RHMCNC4",
  databaseURL: "https://doloya-repartidores-default-rtdb.firebaseio.com"
};
const appRep = initializeApp(configRepartidores, "repartidores");
const dbRep = getDatabase(appRep);

const lista = document.getElementById('listaPedidos');
const bell = document.getElementById('bellIcon');
const bellCount = document.getElementById('bellCount');
let pedidosCache = []; let filtro='todos'; let primerCarga=true; let ultimoTotal=0;
let cacheRepartidores=[ {id:'Jose', nombre:'Jose', foto:'', estado:'disponible', conectado:true} ];

try{
  const repRef = ref(dbRep, 'repartidores');
  onValue(repRef, (snap)=>{
    const data = snap.val();
    if(data){
      const arr = Object.entries(data).map(([key,val])=>{
        return { id: key, nombre: val.nombre || val.usuario || key, foto: val.foto || '', estado: val.conectado ? 'disponible' : (val.estado || 'ocupado'), conectado: !!val.conectado }
      });
      if(arr.length>0) cacheRepartidores = arr;
    }
  });
}catch(e){}

function sonar(){ bell.classList.add('vibrar'); setTimeout(()=>bell.classList.remove('vibrar'),3500);
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=950; g.gain.setValueAtTime(0.9,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.6); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.6);}catch{}
  try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance("Nuevo pedido listo para repartidor"); u.lang='es-MX'; speechSynthesis.speak(u);}catch{}
}
function calcularTiempoReal(sec, estado){
  if(!sec) return {texto:'0s', clase:'tiempo-verde'};
  const diffSeg=Math.floor(Date.now()/1000-sec); const min=Math.floor(diffSeg/60); const seg=diffSeg%60;
  let texto=''; if(diffSeg<60) texto=diffSeg+'s'; else if(diffSeg<3600) texto=min+'m '+seg+'s'; else { const h=Math.floor(min/60); const m=min%60; texto=h+'h '+m+'m'; }
  let clase='tiempo-verde'; const esSinEnviar=['nuevo','listo_para_admin','listo','sin_enviar'].includes(estado);
  if(esSinEnviar){ if(diffSeg<840) clase='tiempo-verde'; else if(diffSeg<960) clase='tiempo-amarillo'; else if(diffSeg>=1080) clase='tiempo-rojo'; else clase='tiempo-amarillo'; }
  return {texto, clase};
}

function render(){
  const counts={todos:pedidosCache.length,sin:0,enviado:0,recogido:0,en_camino:0,fin:0,cancelado:0};
  counts.sin=pedidosCache.filter(p=>['nuevo','listo_para_admin','listo'].includes(p.estado)).length;
  counts.enviado=pedidosCache.filter(p=>p.estado==='enviado_a_repartidor').length;
  counts.recogido=pedidosCache.filter(p=>p.estado==='recogido').length;
  counts.en_camino=pedidosCache.filter(p=>p.estado==='en_camino').length;
  counts.fin=pedidosCache.filter(p=>['finalizado','entregado'].includes(p.estado)).length;
  counts.cancelado=pedidosCache.filter(p=>p.estado==='cancelado').length;
  document.getElementById('c-todos').textContent=counts.todos;
  document.getElementById('c-sin').textContent=counts.sin;
  document.getElementById('c-enviado').textContent=counts.enviado;
  document.getElementById('c-recogido').textContent=counts.recogido;
  document.getElementById('c-camino').textContent=counts.en_camino;
  document.getElementById('c-fin').textContent=counts.fin;
  document.getElementById('c-cancel').textContent=counts.cancelado;
  bellCount.textContent=counts.todos;

  let filtrados=pedidosCache;
  if(filtro!=='todos'){
    if(filtro==='sin_enviar') filtrados=pedidosCache.filter(p=>['nuevo','listo_para_admin','listo'].includes(p.estado));
    else if(filtro==='enviado') filtrados=pedidosCache.filter(p=>p.estado==='enviado_a_repartidor');
    else if(filtro==='finalizado') filtrados=pedidosCache.filter(p=>['finalizado','entregado'].includes(p.estado));
    else filtrados=pedidosCache.filter(p=>p.estado===filtro);
  }
  if(filtrados.length===0){ lista.innerHTML='<div class="vacio">No hay pedidos en '+filtro+'</div>'; return; }

  lista.innerHTML = filtrados.map(p=>{
    const id=p.codigo||p.id.slice(0,4).toUpperCase();
    const cliente=p.nombre||p.detalles?.nombre||p.cliente?.nombre||'Cliente';
    const tel=p.telefono||p.detalles?.telefono||p.cliente?.celular||'+52 477 123 4567';
    const rest=p.restaurante?.nombre||'La Esquina del Sabor';
    const dirRec=p.restaurante?.direccion||'Calle Independencia #124';
    const dirEnt=p.detalles?.direccion||p.cliente?.direccion||'Av. Hidalgo #256';
    const productos=p.productos||[];
    let htmlProd=productos.map(it=>`<div class="product-item"><span>${it.nombre||it.name}</span><span>x${it.cantidad||1}</span><span>$${it.precio||0}</span></div>`).join('')||'<div class="product-item"><span>Producto</span><span>x1</span><span>$65</span></div>';
    const costoProdBase = Number(p.totales?.costoProductos ?? p.totales?.totalProductos ?? p.totales?.subtotal ?? 0);
    const tarifaServicio = Number(p.totales?.tarifaServicio ?? p.totales?.tarifa ?? p.totales?.servicio ?? p.totales?.comision ?? 0);
    const totalProdConTarifa = costoProdBase + tarifaServicio;
    const envio = Number(p.totales?.costoEnvio ?? p.totales?.envio ?? 30);
    const totalFinal = totalProdConTarifa + envio;
    let hora='12:34'; let tsSec=0;
    if(p.timestampAdmin?.seconds){ tsSec=p.timestampAdmin.seconds; hora=new Date(tsSec*1000).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
    else if(p.timestamp?.seconds){ tsSec=p.timestamp.seconds; hora=new Date(tsSec*1000).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
    const tiempo=calcularTiempoReal(tsSec, p.estado);
    let step=0; if(p.estado==='recogido') step=1; if(p.estado==='en_camino') step=2; if(['finalizado','entregado'].includes(p.estado)) step=3;
    const yaEnviado = !['nuevo','listo_para_admin','listo','sin_enviar'].includes(p.estado);
    const esFinalizado = ['finalizado','entregado'].includes(p.estado);
    const esCancelado = p.estado==='cancelado';

    let accionesHtml = '';
    if(esCancelado){
      accionesHtml = `<button class="btn-cancelado-rojo-claro" onclick="siEnviarCanceladoHistorial('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Pedido fue cancelado - ${p.motivoCancelacion||'Sin motivo'}</button>`;
    }else{
      accionesHtml = `<button class="btn-rojo" ${yaEnviado?'disabled':''} onclick="toggleRepartidores('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> ${yaEnviado?'Enviado a '+(p.repartidorNombre||'repartidor'):'Enviar a repartidor'}</button>
        <button class="${esFinalizado ? 'btn-verde' : 'btn-gris'}" ${esFinalizado ? '' : 'disabled'} onclick="confirmarHistorial('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Enviar a historial</button>`;
    }

    return `
    <div class="${esCancelado ? 'card is-cancelado' : 'card'}" id="card-${p.id}">
      <div class="card-top"><div class="card-id"><span class="id-badge">#${id}</span></div><div class="card-date"><span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${hora}</span><span class="tiempo-real ${tiempo.clase}" data-ts="${tsSec}" data-estado="${p.estado}">${tiempo.texto}</span></div></div>
      <div class="card-grid">
        <div><div class="label">Cliente:</div><div class="value">${cliente}<small>${tel}</small></div></div>
        <div><div class="label">Restaurante / Aliado:</div><div class="value">${rest}</div></div>
        <div><div class="label">Recoger en:</div><div class="value"><small>${dirRec}</small></div></div>
        <div><div class="label">Entregar en:</div><div class="value"><small>${dirEnt}</small></div></div>
      </div>
      <div class="card-bottom">
        <div><div class="label">Productos</div>${htmlProd}</div>
        <div class="total-box">
          <div class="line"><span>Total productos</span><span>$${costoProdBase.toFixed(1)}</span></div>
          <div class="line"><span>Tarifa servicio</span><span>$${tarifaServicio.toFixed(1)}</span></div>
          <div class="line"><span>Envío</span><span>$${envio.toFixed(1)}</span></div>
          <div class="total-final">Total<br><b>$${totalFinal.toFixed(1)} MXN</b></div>
        </div>
        <div><div class="label">Datos del restaurante</div><div class="value" style="font-size:11px"><div class="icon-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${rest}</div><div class="icon-row" style="color:#10b981"><span style="width:6px;height:6px;background:#10b981;border-radius:50%;display:inline-block"></span> Listo</div></div></div>
        <div>
          <div class="tracking">
            <div class="track-item ${step>=1?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=1?'#16a34a':'#94a3b8'}" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/></svg></div> Recogido</div>
            <div class="track-item ${step>=2?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=2?'#16a34a':'#94a3b8'}" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/></svg></div> En camino a entregar</div>
            <div class="track-item ${step>=3?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=3?'#16a34a':'#94a3b8'}" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div> Finalizado</div>
          </div>
          <div class="acciones" style="margin-top:8px"><button class="btn-borde" style="width:100%" onclick="verDetalles('${p.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver detalles</button></div>
        </div>
      </div>
      <div class="acciones">${accionesHtml}</div>
      <div class="card-overlay" id="overlay-reps-${p.id}">
        <div class="overlay-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:12px">Seleccionar repartidor para #${id}</b><button class="btn-borde" onclick="cerrarOverlay('overlay-reps-${p.id}')">✕</button></div>
          <div class="reps-row" id="reps-row-${p.id}">${cacheRepartidores.map(r=>{const disp=r.estado==='disponible';return `<div class="rep-card"><div class="rep-img"><svg width="24" height="24" viewBox="0 0 24 24" fill="#94a3b8"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div class="rep-name">${r.nombre}</div><span class="rep-est ${disp?'disponible':'ocupado'}">${disp?'Disponible':'Ocupado'}</span><button class="btn-enviar-rep" ${!disp?'disabled':''} onclick="asignarRepartidor('${p.id}','${r.id}','${r.nombre}')">Enviar</button></div>`;}).join('')}</div>
        </div>
      </div>
      <div class="card-overlay" id="overlay-det-${p.id}">
        <div class="overlay-box" style="text-align:left">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:13px">Seguimiento #${id}</b><button class="btn-borde" onclick="cerrarOverlay('overlay-det-${p.id}')">✕</button></div>
          <div style="font-size:11px;color:#64748b;margin-bottom:10px">Repartidor: <b style="color:#0f172a">${p.repartidorNombre||'Por asignar'}</b></div>
          <div class="tracking">
            <div class="track-item ${step>=0?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div> Sin enviar - Listo</div>
            <div class="track-item ${yaEnviado?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/></svg></div> Enviado a repartidor</div>
            <div class="track-item ${step>=1?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=1?'#16a34a':'#94a3b8'}" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/></svg></div> Recogido</div>
            <div class="track-item ${step>=2?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=2?'#16a34a':'#94a3b8'}" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/></svg></div> En camino</div>
            <div class="track-item ${step>=3?'active':''}"><div class="track-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="${step>=3?'#16a34a':'#94a3b8'}" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div> Finalizado</div>
          </div>
        </div>
      </div>
      <div class="card-overlay" id="overlay-hist-${p.id}">
        <div class="overlay-box hist-box">
          <div class="hist-title">¿Deseas enviar este pedido a historial?</div>
          <div class="hist-sub">Pedido #${id} de ${cliente}<br>Se guardará en <b>doloya-historial / pedidos_entregados</b> y se eliminará de aquí</div>
          <div class="hist-actions">
            <button class="btn-no" onclick="cerrarOverlay('overlay-hist-${p.id}')">No</button>
            <button class="btn-si" onclick="siEnviarHistorial('${p.id}')">Sí, enviar</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); filtro=t.dataset.f; render();
}));

setInterval(()=>{
  document.querySelectorAll('.tiempo-real').forEach(el=>{
    const ts=parseInt(el.dataset.ts||0); const est=el.dataset.estado;
    if(ts){ const t=calcularTiempoReal(ts, est); el.textContent=t.texto; el.className='tiempo-real '+t.clase; }
  });
},1000);

onSnapshot(collection(db,"pedidos_admin"), (snap)=>{
  pedidosCache=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(!primerCarga && pedidosCache.length>ultimoTotal) sonar();
  ultimoTotal=pedidosCache.length; primerCarga=false; render();
});

window.toggleRepartidores = (pedidoId)=>{
  const p=pedidosCache.find(x=>x.id===pedidoId);
  if(p && !['nuevo','listo_para_admin','listo','sin_enviar'].includes(p.estado)) return;
  const row = document.getElementById('reps-row-'+pedidoId);
  if(row){
    row.innerHTML = cacheRepartidores.map(r=>{
      const disp=r.estado==='disponible';
      return `<div class="rep-card"><div class="rep-img"><svg width="24" height="24" viewBox="0 0 24 24" fill="#94a3b8"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div class="rep-name">${r.nombre}</div><span class="rep-est ${disp?'disponible':'ocupado'}">${disp?'Disponible':'Ocupado'}${r.conectado?' • Conectado':''}</span><button class="btn-enviar-rep" ${!disp?'disabled':''} onclick="asignarRepartidor('${pedidoId}','${r.id}','${r.nombre}')">Enviar</button></div>`;
    }).join('');
  }
  document.getElementById('overlay-reps-'+pedidoId)?.classList.add('open');
}
window.cerrarOverlay = (id)=>{ document.getElementById(id)?.classList.remove('open'); }
window.verDetalles = (id)=>{ document.getElementById('overlay-det-'+id)?.classList.add('open'); }
window.confirmarHistorial = (id)=>{ document.getElementById('overlay-hist-'+id)?.classList.add('open'); }

window.asignarRepartidor = async (pedidoId, repId, repNombre)=>{
  try{
    await updateDoc(doc(db,"pedidos_admin",pedidoId),{
      estado:'enviado_a_repartidor',
      repartidorId: repId,
      repartidorNombre: repNombre,
      enviadoARepartidorEn: new Date(),
      timestampEnvio: new Date()
    });
    cerrarOverlay('overlay-reps-'+pedidoId);
  }catch(e){ alert(e.message); }
}

// === MODIFICADO - ENVIO A HISTORIAL CON TODA LA INFO DEL CLIENTE ===
window.siEnviarHistorial = async (id)=>{
  const pedido = pedidosCache.find(p=>p.id===id);
  if(!pedido){ alert('Pedido no encontrado'); return; }
  const copiaPedidos = [...pedidosCache];
  pedidosCache = pedidosCache.filter(p=>p.id!==id);
  render();
  try{
    const cliente = pedido.cliente || {};
    const gps = pedido.gps || cliente.ubicacion || {};
    const ubiCompleta = pedido.ubicacionCompleta || {};

    const datosHistorial = {
      ...pedido,
      // INFO CLIENTE COMPLETA GARANTIZADA
      clienteId: pedido.clienteId || cliente.clienteId || id,
      nombre: pedido.nombre || cliente.nombre || pedido.cliente?.nombre || 'Cliente',
      telefono: pedido.telefono || cliente.celular || cliente.telefono || pedido.detalles?.telefono || '',
      celular: pedido.celular || cliente.celular || cliente.telefono || '',
      direccionEntrega: pedido.direccionEntrega || cliente.direccion || pedido.detalles?.direccion || '',
      cliente: {
        clienteId: cliente.clienteId || pedido.clienteId || id,
        nombre: cliente.nombre || pedido.nombre || 'Cliente',
        celular: cliente.celular || cliente.telefono || pedido.telefono || '',
        telefono: cliente.telefono || cliente.celular || pedido.telefono || '',
        direccion: cliente.direccion || pedido.direccionEntrega || '',
        referencia: cliente.referencia || '',
        tipoDireccion: cliente.tipoDireccion || '',
        nombreEdificio: cliente.nombreEdificio || '',
        piso: cliente.piso || '',
        ubicacion: {
          lat: cliente.ubicacion?.lat || gps.lat || pedido.latitud || 0,
          lng: cliente.ubicacion?.lng || gps.lng || pedido.longitud || 0,
          accuracy: cliente.ubicacion?.accuracy || gps.accuracy || 0,
          googleMapsUrl: cliente.ubicacion?.googleMapsUrl || `https://www.google.com/maps?q=${cliente.ubicacion?.lat || gps.lat || 0},${cliente.ubicacion?.lng || gps.lng || 0}`
        },
        gpsActualCliente: cliente.gpsActualCliente || gps
      },
      // GPS, LAT, LNG
      gps: gps,
      latitud: gps.lat || pedido.latitud || cliente.ubicacion?.lat || 0,
      longitud: gps.lng || pedido.longitud || cliente.ubicacion?.lng || 0,
      ubicacionCompleta: ubiCompleta,
      detalles: pedido.detalles || {},
      // IP Y RED - LO QUE TE FALTABA
      ip: pedido.ip || ubiCompleta.ip || '0.0.0.0',
      ipInfo: pedido.ipInfo || ubiCompleta.ipInfo || {},
      // DISPOSITIVO Y NAVEGADOR
      dispositivo: pedido.dispositivo || {},
      userAgent: pedido.userAgent || pedido.dispositivo?.userAgent || '',
      plataforma: pedido.plataforma || pedido.dispositivo?.plataforma || '',
      navegador: pedido.dispositivo?.navegador || pedido.dispositivo?.userAgent || '',
      // ESTADOS HISTORIAL
      estado: 'historial',
      estadoOriginal: pedido.estado,
      enviadoAHistorialEn: new Date().toISOString(),
      fechaEntrega: new Date().toISOString(),
      guardadoDesde: 'doloya-confirmacion'
    };

    await setDoc(doc(dbHistorial, "pedidos_entregados", id), datosHistorial);
    await deleteDoc(doc(db, "pedidos_admin", id));
    console.log("✅ Enviado a historial con IP:", datosHistorial.ip, "GPS:", datosHistorial.latitud, datosHistorial.longitud);
  }catch(e){
    console.error(e);
    alert('Error: '+e.message);
    pedidosCache = copiaPedidos;
    render();
  }
}

window.siEnviarCanceladoHistorial = async (id)=>{
  const pedido = pedidosCache.find(p=>p.id===id);
  if(!pedido){ alert('Pedido no encontrado'); return; }
  
  const cardEl = document.getElementById('card-'+id);
  if(cardEl){ 
    cardEl.style.transition='all .35s ease';
    cardEl.style.transform='scale(0.88)';
    cardEl.style.opacity='0.5';
  }

  try{
    const cliente = pedido.cliente || {};
    const gps = pedido.gps || cliente.ubicacion || {};
    const ubiCompleta = pedido.ubicacionCompleta || {};

    const datosCompletos = {
      ...pedido,
      idOriginal: pedido.id,
      codigo: pedido.codigo || pedido.id,
      // CLIENTE COMPLETO
      clienteId: pedido.clienteId || cliente.clienteId || id,
      nombre: pedido.nombre || cliente.nombre || 'Cliente',
      telefono: pedido.telefono || cliente.celular || cliente.telefono || pedido.detalles?.telefono || '',
      celular: pedido.celular || cliente.celular || cliente.telefono || '',
      direccionEntrega: pedido.direccionEntrega || cliente.direccion || pedido.detalles?.direccion || '',
      cliente: {
        clienteId: cliente.clienteId || pedido.clienteId || id,
        nombre: cliente.nombre || pedido.nombre || 'Cliente',
        celular: cliente.celular || cliente.telefono || pedido.telefono || '',
        telefono: cliente.telefono || cliente.celular || pedido.telefono || '',
        direccion: cliente.direccion || pedido.direccionEntrega || '',
        referencia: cliente.referencia || '',
        tipoDireccion: cliente.tipoDireccion || '',
        nombreEdificio: cliente.nombreEdificio || '',
        piso: cliente.piso || '',
        ubicacion: {
          lat: cliente.ubicacion?.lat || gps.lat || pedido.latitud || 0,
          lng: cliente.ubicacion?.lng || gps.lng || pedido.longitud || 0,
          accuracy: cliente.ubicacion?.accuracy || gps.accuracy || 0,
          googleMapsUrl: cliente.ubicacion?.googleMapsUrl || `https://www.google.com/maps?q=${cliente.ubicacion?.lat || gps.lat || 0},${cliente.ubicacion?.lng || gps.lng || 0}`
        },
        gpsActualCliente: cliente.gpsActualCliente || gps
      },
      // GPS
      gps: gps,
      latitud: gps.lat || pedido.latitud || cliente.ubicacion?.lat || 0,
      longitud: gps.lng || pedido.longitud || cliente.ubicacion?.lng || 0,
      ubicacionCompleta: ubiCompleta,
      detalles: pedido.detalles || {},
      // IP - YA NO NULL
      ip: pedido.ip || ubiCompleta.ip || '0.0.0.0',
      ipInfo: pedido.ipInfo || ubiCompleta.ipInfo || {},
      // DISPOSITIVO
      dispositivo: pedido.dispositivo || {},
      userAgent: pedido.userAgent || pedido.dispositivo?.userAgent || '',
      plataforma: pedido.plataforma || pedido.dispositivo?.plataforma || '',
      navegador: pedido.dispositivo?.navegador || '',
      // CANCELADO
      estado: 'cancelado_historial',
      estadoOriginal: pedido.estado,
      motivoCancelacion: pedido.motivoCancelacion || 'Sin motivo',
      detalleCancelacion: pedido.detalleCancelacion || '',
      canceladoPor: pedido.canceladoPor,
      canceladoPorNombre: pedido.canceladoPorNombre,
      canceladoEn: pedido.canceladoEn ? (pedido.canceladoEn.seconds ? new Date(pedido.canceladoEn.seconds*1000).toISOString() : pedido.canceladoEn) : new Date().toISOString(),
      enviadoAHistorialEn: new Date().toISOString(),
      fechaCancelacion: new Date().toISOString(),
      guardadoDesde: 'doloya-confirmacion',
      datosCompletosOriginales: pedido
    };

    console.log('Guardando en pedidos_cancelados con IP:', datosCompletos.ip);
    await setDoc(doc(dbHistorial, "pedidos_cancelados", id), datosCompletos);
    await deleteDoc(doc(db, "pedidos_admin", id));
    pedidosCache = pedidosCache.filter(p=>p.id!==id);
    render();

  }catch(e){
    console.error('ERROR CANCELADO:', e);
    alert('Error al mover a historial:\n'+e.message);
    if(cardEl){ cardEl.style.transform='scale(1)'; cardEl.style.opacity='1'; }
  }
}
</script>
</body>
