<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Admin DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FAFAFA;min-height:100vh}
.header{height:76px;background:white;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.h-left{display:flex;align-items:center;gap:12px}
.btn-x{width:38px;height:38px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer}
.header-title h1{font-size:22px;font-weight:800;color:#111;line-height:1}
.header-title p{font-size:12px;color:#6b7a8d;margin-top:2px}
.h-right{display:flex;align-items:center;gap:18px;margin-left:auto}
.bell{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell-count{position:absolute;top:-6px;right:-6px;background:#E30613;color:white;min-width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bell.vibrar{animation:bell3d .15s infinite}
@keyframes bell3d{0%{transform:rotate(-15deg) scale(1.2) translateY(-2px)}25%{transform:rotate(15deg) scale(1.35) translateY(2px)}50%{transform:rotate(-12deg) scale(1.25)}75%{transform:rotate(12deg) scale(1.3)}100%{transform:rotate(-15deg) scale(1.2)}}
.admin-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #f1f5f9;border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.admin-avatar{width:34px;height:34px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.tabs{display:flex;gap:10px;padding:18px 18px 10px;overflow-x:auto;white-space:nowrap}
.tab{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:#334155;display:flex;align-items:center;gap:8px;cursor:pointer}
.tab.active{background:#B70A1A;color:white;border-color:#B70A1A}
.tab-count{background:#f1f5f9;color:#334155;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tab.active .tab-count{background:white;color:#B70A1A}
.container{padding:12px 18px 30px}
.card{background:white;border:1px solid #eef0f3;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.03);margin-bottom:16px}
.card-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.card-id{display:flex;align-items:center;gap:8px}
.id-badge{background:#B70A1A;color:white;padding:6px 16px;border-radius:999px;font-weight:800;font-size:13px}
.estado-mini{background:#B70A1A;color:white;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700}
.card-date{display:flex;align-items:center;gap:14px;font-size:12px;color:#334155}
.card-grid{display:grid;grid-template-columns:1.2fr 1.2fr 1.5fr 1.5fr;gap:16px;padding:16px 0;border-bottom:1px solid #f1f5f9;margin-top:4px}
@media(max-width:900px){.card-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}}
.label{font-size:11px;color:#64748b;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.value{font-size:13px;font-weight:600;color:#0f172a;line-height:1.35}
.value small{font-weight:400;color:#64748b;display:block;font-size:12px}
.card-bottom{display:grid;grid-template-columns:1.5fr .7fr 1.2fr 1fr;gap:16px;padding:14px 0}
@media(max-width:900px){.card-bottom{grid-template-columns:1fr 1fr}}
.product-item{display:flex;justify-content:space-between;font-size:12.5px;color:#334155;padding:3px 0}
.total-box .line{display:flex;justify-content:space-between;font-size:12.5px;color:#334155;padding:2px 0}
.total-final{font-size:13px;font-weight:700;color:#0f172a;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:8px}
.total-final b{font-size:18px;color:#B70A1A;font-weight:800}
.acciones{display:flex;gap:10px;padding-top:8px;flex-wrap:wrap}
.btn-rojo{background:#16a34a;color:white;border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:1;min-width:170px}
.btn-gris{background:#7A8A9A;color:white;border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:1;min-width:170px}
.btn-borde{margin-left:auto;background:white;border:1px solid #d1d5db;border-radius:999px;padding:8px 18px;font-size:12px;font-weight:600;color:#475569;display:flex;align-items:center;gap:6px;cursor:pointer}
.vacio{text-align:center;padding:40px;color:#94a3b8}
.icon-row{display:flex;align-items:center;gap:6px}
.tiempo-real{border-radius:999px;padding:4px 12px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;gap:4px}
.tiempo-verde{background:#16a34a;color:white}
.tiempo-amarillo{background:#EAB308;color:white}
.tiempo-rojo{background:#EF4444;color:white;animation:pulseRojo 1s infinite}
.tiempo-negro{background:#111;color:white;animation:pulseNegro .6s infinite}
@keyframes pulseRojo{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pulseNegro{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tracking{display:flex;flex-direction:column;gap:0;margin-top:10px;border-left:2px dashed #e5e7eb;padding-left:10px;margin-left:4px}
.track-item{display:flex;align-items:center;gap:8px;padding:6px 0;position:relative}
.track-item::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#e5e7eb;border:2px solid white}
.track-item.active::before{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.track-item.active{color:#0f172a;font-weight:700}
.track-item{font-size:12px;color:#94a3b8}
.track-icon{width:20px;height:20px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center}
.track-item.active .track-icon{background:#dcfce7}
</style>
</head>
<body>

<div class="header">
  <div class="h-left">
    <button class="btn-x" onclick="window.location.href='paneladmin.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="header-title">
      <h1>Pedidos</h1>
      <p>Gestiona y da seguimiento a todos los pedidos de tu restaurante.</p>
    </div>
  </div>
  <div class="h-right">
    <div class="bell" id="bellIcon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B70A1A" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 9H0s6-2 6-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="bell-count" id="bellCount">0</span>
    </div>
    <div class="admin-chip">
      <div class="admin-avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
      <div style="line-height:1.1"><b style="font-size:12px;display:block">Administrador</b><small style="font-size:11px;color:#6b7280">DoloYa</small></div>
    </div>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-f="todos">Todos <span class="tab-count" id="c-todos">0</span></div>
  <div class="tab" data-f="nuevos">Nuevos <span class="tab-count" id="c-nuevos">0</span></div>
  <div class="tab" data-f="enviado">Enviados al repartidor <span class="tab-count" id="c-enviado">0</span></div>
  <div class="tab" data-f="en_camino">En camino <span class="tab-count" id="c-camino">0</span></div>
  <div class="tab" data-f="entregado">Entregado <span class="tab-count" id="c-entregado">0</span></div>
  <div class="tab" data-f="cancelado">Cancelados <span class="tab-count" id="c-cancel">0</span></div>
</div>

<div class="container" id="listaPedidos">
  <div class="vacio">Esperando pedidos del restaurante...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const config = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(config);
const db = getFirestore(app);

const lista = document.getElementById('listaPedidos');
const bell = document.getElementById('bellIcon');
const bellCount = document.getElementById('bellCount');
let pedidosCache = [];
let filtro = 'todos';
let primerCarga = true;
let ultimoTotal = 0;

function sonar(){
  bell.classList.add('vibrar');
  setTimeout(()=>bell.classList.remove('vibrar'),3500);
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const g=ctx.createGain();
    osc.frequency.value=950; g.gain.setValueAtTime(0.9,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.6);
    osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.6);
    setTimeout(()=>{
      const osc2=ctx.createOscillator(); const g2=ctx.createGain();
      osc2.frequency.value=1250; g2.gain.setValueAtTime(0.9,ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);
      osc2.connect(g2); g2.connect(ctx.destination); osc2.start(); osc2.stop(ctx.currentTime+0.5);
    },250);
  }catch{}
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance("Nuevo pedido listo para repartidor"); u.lang='es-MX'; speechSynthesis.speak(u);}catch{}
}

function calcularTiempoReal(sec){
  if(!sec) return {texto:'0s', clase:'tiempo-verde'};
  const diffSeg = Math.floor(Date.now()/1000 - sec);
  const min = Math.floor(diffSeg/60);
  const seg = diffSeg % 60;
  let texto=''; if(diffSeg<60) texto=diffSeg+'s'; else if(diffSeg<3600) texto=min+'m '+seg+'s'; else { const h=Math.floor(min/60); const m=min%60; texto=h+'h '+m+'m'; }
  let clase='tiempo-verde'; if(diffSeg>=960 && diffSeg<2160) clase='tiempo-amarillo'; else if(diffSeg>=2160 && diffSeg<3000) clase='tiempo-rojo'; else if(diffSeg>=3000) clase='tiempo-negro';
  return {texto, clase, sec:diffSeg};
}

function render(){
  const counts = {todos:pedidosCache.length,nuevos:0,enviado:0,en_camino:0,entregado:0,cancelado:0};
  pedidosCache.forEach(p=>{
    if(['nuevo','listo_para_admin','listo'].includes(p.estado)) counts.nuevos++;
    else if(p.estado==='enviado_a_repartidor') counts.enviado++;
    else if(p.estado==='en_camino') counts.en_camino++;
    else if(p.estado==='entregado') counts.entregado++;
    else if(p.estado==='cancelado') counts.cancelado++;
  });
  document.getElementById('c-todos').textContent=counts.todos;
  document.getElementById('c-nuevos').textContent=counts.nuevos;
  document.getElementById('c-enviado').textContent=counts.enviado;
  document.getElementById('c-camino').textContent=counts.en_camino;
  document.getElementById('c-entregado').textContent=counts.entregado;
  document.getElementById('c-cancel').textContent=counts.cancelado;
  bellCount.textContent=counts.todos;

  let filtrados = pedidosCache;
  if(filtro!=='todos'){
    if(filtro==='nuevos') filtrados = pedidosCache.filter(p=>['nuevo','listo_para_admin','listo'].includes(p.estado));
    else if(filtro==='enviado') filtrados = pedidosCache.filter(p=>p.estado==='enviado_a_repartidor');
    else filtrados = pedidosCache.filter(p=>p.estado===filtro);
  }

  if(filtrados.length===0){ lista.innerHTML='<div class="vacio">No hay pedidos en '+filtro+'</div>'; return; }

  lista.innerHTML = filtrados.map(p=>{
    const id = p.codigo || p.id.slice(0,4).toUpperCase();
    const cliente = p.nombre || p.detalles?.nombre || p.clienteNombre || 'Cliente';
    const tel = p.telefono || p.detalles?.telefono || '+52 477 123 4567';
    const rest = p.restaurante?.nombre || p.restauranteNombre || 'La Esquina del Sabor';
    const dirRec = p.restaurante?.direccion || p.direccionRestaurante || 'Calle Independencia #124<br>Col. Centro, Dolores Hidalgo, Gto.';
    const dirEnt = p.detalles?.direccion || p.direccionCliente || 'Av. Hidalgo #256<br>Col. Centro, Dolores Hidalgo, Gto.';
    const productos = p.productos || p.items || [];
    let htmlProd = productos.map(it=>`<div class="product-item"><span>${it.nombre||it.name}</span><span>x${it.cantidad||it.qty||1}</span><span>$${it.precio||it.price||0}</span></div>`).join('') || '<div class="product-item"><span>Producto</span><span>x1</span><span>$65</span></div>';
    const totalProd = p.totales?.costoProductos || 95;
    const envio = p.totales?.costoEnvio || 30;
    const total = p.totales?.total || p.total || 125;
    const notas = p.detalles?.nota || p.notas || 'Sin cebolla, por favor.';
    
    let hora = 'Hoy, 12:34 p.m.'; let tsSec=0;
    if(p.timestampAdmin?.seconds){ tsSec=p.timestampAdmin.seconds; hora = new Date(tsSec*1000).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    else if(p.timestamp?.seconds){ tsSec=p.timestamp.seconds; hora = new Date(tsSec*1000).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    else if(p.listoEn?.seconds){ tsSec=p.listoEn.seconds; hora = new Date(tsSec*1000).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    const tiempo = calcularTiempoReal(tsSec);
    const estadoLabel = p.estado==='listo_para_admin' ? 'Nuevo' : p.estado;

    // Tracking logic
    let step=0; if(['enviado_a_repartidor','en_camino','entregado'].includes(p.estado)) step=1; if(['en_camino','entregado'].includes(p.estado)) step=2; if(p.estado==='entregado') step=3;

    return `
    <div class="card">
      <div class="card-top">
        <div class="card-id"><span class="id-badge">#${id}</span><span class="estado-mini">${estadoLabel}</span></div>
        <div class="card-date">
          <span style="display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${hora}</span>
          <span class="tiempo-real ${tiempo.clase}" data-ts="${tsSec}">${tiempo.texto}</span>
        </div>
      </div>
      <div class="card-grid">
        <div><div class="label">Cliente:</div><div class="value">${cliente}<small>${tel}</small></div></div>
        <div><div class="label">Restaurante / Aliado:</div><div class="value">${rest}</div></div>
        <div><div class="label">Recoger en:</div><div class="value"><small>${dirRec}</small></div></div>
        <div>
          <div class="label">Entregar en:</div><div class="value"><small>${dirEnt}</small></div>
          <div class="tracking">
            <div class="track-item ${step>=1?'active':''}"><div class="track-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${step>=1?'#16a34a':'#94a3b8'}" stroke-width="2"><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect x="2" y="7" width="20" height="14" rx="2"/></svg></div> Recogido</div>
            <div class="track-item ${step>=2?'active':''}"><div class="track-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${step>=2?'#16a34a':'#94a3b8'}" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5.5 17.5L7 10h10l1.5 7.5"/><path d="M7 10V7a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v3"/></svg></div> En camino a entregar</div>
            <div class="track-item ${step>=3?'active':''}"><div class="track-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${step>=3?'#16a34a':'#94a3b8'}" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div> Finalizado</div>
          </div>
        </div>
      </div>
      <div class="card-bottom">
        <div><div class="label">Productos</div>${htmlProd}</div>
        <div class="total-box"><div class="line"><span>Total productos</span><span>$${totalProd}</span></div><div class="line"><span>Envío</span><span>$${envio}</span></div><div class="total-final">Total del pedido<br><b>$${total} MXN</b></div></div>
        <div><div class="label">Notas del cliente</div><div class="value" style="font-weight:400;font-size:12px;color:#64748b">${notas}</div></div>
        <div><div class="label">Datos del restaurante</div><div class="value" style="font-size:12px">
          <div class="icon-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${rest}</div>
          <div class="icon-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> +52 477 123 4567</div>
          <div class="icon-row" style="color:#10b981"><span style="width:8px;height:8px;background:#10b981;border-radius:50%;display:inline-block"></span> Listo para repartidor</div>
        </div></div>
      </div>
      <div class="acciones">
        <button class="btn-rojo" onclick="enviarRepartidor('${p.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar a repartidor</button>
        <button class="btn-gris" onclick="enviarHistorial('${p.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Enviar a historial</button>
        <button class="btn-borde"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver detalles</button>
      </div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); filtro=t.dataset.f; render();
}));

setInterval(()=>{
  document.querySelectorAll('.tiempo-real').forEach(el=>{
    const ts=parseInt(el.dataset.ts||0);
    if(ts){
      const t=calcularTiempoReal(ts);
      el.textContent=t.texto;
      el.className='tiempo-real '+t.clase;
    }
  });
},1000);

onSnapshot(collection(db,"pedidos_admin"), (snap)=>{
  pedidosCache = snap.docs.map(d=>({id:d.id,...d.data()}));
  if(!primerCarga && pedidosCache.length>ultimoTotal) sonar();
  ultimoTotal=pedidosCache.length; 
  primerCarga=false;
  render();
}, (err)=>{
  lista.innerHTML = "<div class='vacio'>Error: "+err.message+"</div>";
});

window.enviarRepartidor = async (id)=>{
  try{
    await updateDoc(doc(db,"pedidos_admin",id),{estado:'enviado_a_repartidor', enviadoARepartidorEn: new Date()});
  }catch(e){ alert(e.message); }
}
window.enviarHistorial = async (id)=>{
  try{
    await updateDoc(doc(db,"pedidos_admin",id),{estado:'entregado', entregadoEn: new Date()});
  }catch(e){ alert(e.message); }
}
window.cancelarPedido = async (id)=>{
  if(confirm('¿Cancelar pedido?')){
    await updateDoc(doc(db,"pedidos_admin",id),{estado:'cancelado'});
  }
}
