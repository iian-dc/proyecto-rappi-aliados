<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración Menú - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh}
:root{--rojo:#C50D1F;--rojo2:#D90A17;--verde:#0ABF7D;--gris:#E5E7EB}
.top-header{background:var(--rojo2);height:78px;display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:10}
.btn-x{width:52px;height:52px;background:white;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-x svg{width:24px;height:24px;stroke:var(--rojo2);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.line{width:1.5px;height:38px;background:rgba(255,255,255,0.4)}
.top-text h1{color:white;font-size:28px;font-weight:800;line-height:1}
.top-text p{color:rgba(255,255,255,0.92);font-size:13.5px;margin-top:4px}
.main{padding:22px}
.card{border:1.5px solid #E9ECF2;border-radius:10px;background:white;padding:18px}
.card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.card-head svg{width:32px;height:32px;stroke:#111827;stroke-width:1.8;fill:none;flex-shrink:0}
.card-head h2{font-size:17px;font-weight:700;color:#111827}
.card-head p{font-size:12.5px;color:#6B7A99;margin-top:2px}
.table-wrap{border:1.5px solid #EEF1F6;border-radius:10px;overflow:hidden}
.t-head{display:grid;grid-template-columns:80px 1fr 180px 100px;background:#F6F8FC;height:44px;align-items:center;padding:0 14px;font-size:12.5px;font-weight:600;color:#111827}
.row{display:grid;grid-template-columns:80px 1fr 180px 100px;align-items:center;padding:0 14px;height:56px;border-top:1px solid #EEF1F6;background:white;cursor:grab;transition:.15s}
.row.dragging{opacity:0.5;background:#FFF5F5}
.drag{width:22px;height:22px;display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;cursor:grab}
.drag span{width:3px;height:3px;background:#111827;border-radius:50%;display:block}
.badge{width:52px;height:28px;background:#F1F7FE;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#111827;font-weight:500}
.name{font-size:13.5px;color:#111827;font-weight:500;text-transform:capitalize}
.estado{display:flex;align-items:center;gap:10px}
.switch{width:44px;height:24px;background:var(--gris);border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--verde)}
.switch:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:white;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on:after{left:22px}
.txt-est{font-size:12.5px;color:#6B7280}
.txt-est.on{color:#111827}
.actions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.btn-del{width:32px;height:32px;border-radius:8px;border:1px solid #fee2e2;background:#fff5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.btn-del:hover{background:#fee2e2}
.btn-del svg{width:16px;height:16px;stroke:#C50D1F;stroke-width:2;fill:none}
.footer{margin-top:24px;border:1.5px solid #EEF1F6;border-radius:10px;background:#FBFCFF;height:88px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 18px}
@media(max-width:600px){.t-head,.row{grid-template-columns:50px 1fr 90px 70px}.footer{flex-direction:column;height:auto;padding:14px}}
.btn-cancel{height:44px;min-width:200px;padding:0 24px;border:1.5px solid #E5E9F0;background:white;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-save{height:44px;min-width:220px;padding:0 24px;border:none;background:var(--rojo2);border-radius:8px;color:white;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-save svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2}
#toast{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:999}
#toast.show{display:flex}
.toast-box{background:white;border-radius:12px;padding:18px 22px;min-width:260px;text-align:center;border-top:4px solid var(--rojo2)}
#modalDel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
#modalDel.show{display:flex}
.modal-box{background:white;border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center}
.modal-box h3{font-size:16px;font-weight:800;margin-bottom:6px}
.modal-box p{font-size:12.5px;color:#6B7280;margin-bottom:16px}
.modal-btns{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div id="toast"><div class="toast-box"><b id="tTitle">Guardado</b><p id="tMsg" style="font-size:12px;color:#6b7280;margin-top:4px">Cambios guardados</p></div></div>
<div id="modalDel"><div class="modal-box"><h3>¿Eliminar categoría?</h3><p id="msgDel">Esta acción no se puede deshacer.</p><div class="modal-btns"><button class="btn-cancel" style="min-width:120px" onclick="cerrarModalDel()">Cancelar</button><button class="btn-save" style="min-width:120px;background:#111" onclick="confirmarEliminar()">Eliminar</button></div></div></div>

<div class="top-header">
  <button class="btn-x" onclick="location.href='panelaliado-menu.html'"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  <div class="line"></div>
  <div class="top-text"><h1>Configuración</h1><p>Ajusta y personaliza la configuración de tu menú.</p></div>
</div>

<div class="main">
  <div class="card">
    <div class="card-head">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <div><h2>Categorías</h2><p id="rutaDebug" style="font-size:11px;color:#94a3b8">Activa o desactiva las categorías completas y ordénalas como prefieras arrastrando.</p></div>
    </div>
    <div class="table-wrap">
      <div class="t-head"><span>Orden</span><span>Categoría</span><span>Estado</span><span style="text-align:right">Acción</span></div>
      <div id="lista"><div style="padding:20px;text-align:center;color:#94a3b8;font-size:13px">Cargando categorías...</div></div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-cancel" onclick="location.href='panelaliado-menu.html'">Cancelar</button>
    <button class="btn-save" id="btnSave" onclick="guardar()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",authDomain:"doloya-aliados.firebaseapp.com",databaseURL:"https://doloya-aliados-default-rtdb.firebaseio.com",projectId:"doloya-aliados",storageBucket:"doloya-aliados.firebasestorage.app",messagingSenderId:"122314467740",appId:"1:122314467740:web:9947a0a9560557e3a00059"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
let cats=[];
let sesion=null;
let catAEliminar=null;

function toast(t,m){document.getElementById('tTitle').textContent=t;document.getElementById('tMsg').textContent=m;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),2000);}
window.cerrarModalDel = ()=>{ document.getElementById('modalDel').classList.remove('show'); catAEliminar=null; }

function render(){
  const cont=document.getElementById('lista');
  if(cats.length===0){
    cont.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8;font-size:13px">No tienes categorías aún. Revisa que tu negocio sea las_tortas_de_migue.</div>';
    return;
  }
  cont.innerHTML='';
  cats.sort((a,b)=>(a.orden??9999)-(b.orden??9999));
  cats.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='row';
    row.draggable=true;
    row.dataset.key=c.key;
    row.dataset.path=c.fullPath;
    row.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px">
        <div class="drag"><span></span><span></span><span></span><span></span></div>
        <div class="badge">${i+1}</div>
      </div>
      <div class="name">${c.nombre}</div>
      <div class="estado">
        <div class="switch ${c.activa!==false?'on':''}" onclick="toggle('${c.key}')"></div>
        <span class="txt-est ${c.activa!==false?'on':''}">${c.activa!==false?'Activa':'Inactiva'}</span>
      </div>
      <div class="actions">
        <button class="btn-del" onclick="pedirEliminar('${c.key}')" title="Eliminar">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    `;
    cont.appendChild(row);
  });
  addDrag();
}

function addDrag(){
  const lista=document.getElementById('lista');
  let dragEl=null;
  lista.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('dragstart',()=>{dragEl=r;setTimeout(()=>r.classList.add('dragging'),0)});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');dragEl=null;reordenar()});
    r.addEventListener('dragover',e=>e.preventDefault());
    r.addEventListener('drop',e=>{
      e.preventDefault();
      if(dragEl && dragEl!==r){
        const rows=[...lista.children];
        const from=rows.indexOf(dragEl);
        const to=rows.indexOf(r);
        if(from<to) r.after(dragEl); else r.before(dragEl);
        reordenar();
      }
    });
  });
}

function reordenar(){
  const keys=[...document.querySelectorAll('.row')].map(r=>r.dataset.key);
  cats.forEach(c=>{c.orden=keys.indexOf(c.key)+1});
  render();
}

window.toggle=function(key){
  const c=cats.find(x=>x.key===key);
  if(c){c.activa=!c.activa;render();}
}
window.pedirEliminar=function(key){
  const c=cats.find(x=>x.key===key);
  if(!c) return;
  catAEliminar=c;
  document.getElementById('msgDel').textContent=`¿Eliminar "${c.nombre}"? Se borrará de ${c.fullPath}`;
  document.getElementById('modalDel').classList.add('show');
}
window.confirmarEliminar=async function(){
  if(!catAEliminar) return;
  try{
    await remove(ref(db, catAEliminar.fullPath));
    cats = cats.filter(c=>c.key!==catAEliminar.key);
    cerrarModalDel();
    toast('Eliminada','Categoría eliminada');
    render();
  }catch(e){ toast('Error', e.message); }
}

async function cargar(){
  sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
  if(!sesion){
    document.getElementById('lista').innerHTML='<div style="padding:20px;text-align:center;color:#E30613">No hay sesión</div>';
    return;
  }
  const idNegocio = normalize(sesion.id || sesion.negocio || sesion.nombre || '');
  const allSnap = await get(ref(db, 'doloya_aliados'));
  if(!allSnap.exists()) return;
  const data = allSnap.val();

  // 1. ENCONTRAR NODO DEL NEGOCIO (como en tu foto las_tortas_de_migue)
  let businessPath = '';
  let businessNode = null;
  for(const key of Object.keys(data)){
    if(normalize(key)===idNegocio || normalize(key).includes(idNegocio) || idNegocio.includes(normalize(key))){
      businessPath = `doloya_aliados/${key}`;
      businessNode = data[key];
      break;
    }
    // buscar dentro de segundo nivel como santillos
    if(typeof data[key]==='object'){
      for(const subKey of Object.keys(data[key])){
        if(normalize(subKey)===idNegocio || normalize(subKey).includes(idNegocio)){
          businessPath = `doloya_aliados/${key}/${subKey}`;
          businessNode = data[key][subKey];
          break;
        }
        // tambien buscar tercer nivel
        const third = data[key][subKey];
        if(third && typeof third==='object'){
          for(const thirdKey of Object.keys(third)){
            if(normalize(thirdKey)===idNegocio){
              businessPath = `doloya_aliados/${key}/${subKey}/${thirdKey}`;
              businessNode = third[thirdKey];
              break;
            }
          }
        }
      }
    }
  }
  if(!businessNode){
    // fallback: usa todo doloya_aliados
    businessNode = data;
    businessPath = 'doloya_aliados';
  }

  document.getElementById('rutaDebug').textContent = `Ruta detectada: ${businessPath} - ID: ${idNegocio}`;

  // 2. BUSCAR CATEGORIAS RECURSIVAMENTE DENTRO DE ESE NEGOCIO
  // Tu estructura: .../categorias/categorias/salchipapas -> {activa, nombre, nombreLower, key}
  cats=[];
  function buscarCategorias(obj, pathActual){
    if(!obj || typeof obj!=='object') return;
    for(const k of Object.keys(obj)){
      const v = obj[k];
      if(v && typeof v==='object'){
        // si parece categoria (tiene nombre y nombreLower)
        if(v.nombre && (v.nombreLower || v.key) && (v.activa!==undefined || v.nombre)){
          // evitar nodos info _info
          if(k.startsWith('_')) continue;
          // asegurarnos que no sea un producto (productos no tienen nombreLower igual a key normalmente, pero tienen precio)
          if(v.precio || v.price) continue;
          cats.push({
            key: k,
            nombre: v.nombre || k,
            nombreLower: v.nombreLower || normalize(v.nombre || k),
            activa: v.activa!==false,
            orden: v.orden ?? v.fecha ?? 9999,
            fecha: v.fecha,
            fullPath: `${pathActual}/${k}`
          });
        } else {
          // seguir bajando, especialmente si es nodo categorias
          if(k==='categorias' || k==='categoria' || k==='categories'){
            buscarCategorias(v, `${pathActual}/${k}`);
          } else if(!k.startsWith('_') && !['banner','carritos','disponibilidad','info','menu','productos'].includes(k)){
            // buscar en otros nodos también
            buscarCategorias(v, `${pathActual}/${k}`);
          } else if(k==='categorias' || k==='carritos' || k==='menu'){
            buscarCategorias(v, `${pathActual}/${k}`);
          }
        }
      }
    }
  }
  buscarCategorias(businessNode, businessPath);

  // eliminar duplicados por key
  const map = new Map();
  cats.forEach(c=>{ if(!map.has(c.key)) map.set(c.key,c); });
  cats = [...map.values()];

  // ordenar por fecha si no hay orden
  cats.forEach((c,i)=>{ if(!c.orden || c.orden===9999) c.orden = c.fecha ? Number(c.fecha) : i+1; });

  render();
}

window.guardar=async function(){
  const btn=document.getElementById('btnSave');
  btn.disabled=true;btn.textContent='Guardando...';
  let updates={};
  cats.forEach(c=>{
    updates[`${c.fullPath}/activa`]=c.activa;
    updates[`${c.fullPath}/orden`]=c.orden;
    updates[`${c.fullPath}/nombre`]=c.nombre;
    updates[`${c.fullPath}/nombreLower`]=c.nombreLower;
  });
  await update(ref(db),updates);
  toast('Guardado','Orden y estado actualizados - disponibilidad vinculada');
  btn.disabled=false;
  btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios`;
  setTimeout(()=>location.href='panelaliado-menu.html',900);
}

cargar();
</script>
</body>
</html>
