<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú / Carta - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#F5F5F7;min-height:100vh}
:root{--rojo:#C50D1F;--rojo2:#E30613;--negro:#11141A}
.top-header{background:var(--rojo);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;height:64px;position:sticky;top:0;z-index:100}
.top-left{display:flex;align-items:center;gap:14px}
.btn-x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:white;border:none;border-radius:50%;color:var(--rojo2)}
.btn-x svg{width:18px;height:18px;stroke:var(--rojo2);stroke-width:3}
.top-left-text h1{color:white;font-size:22px;font-weight:800}
.top-left-text p{color:rgba(255,255,255,0.85);font-size:12px;font-weight:500}
.top-right{display:flex;align-items:center;gap:10px}
.btn-black{background:var(--negro);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.btn-black svg{width:18px;height:18px;stroke:white;fill:none}
.cat-bar{background:var(--negro);padding:10px 18px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{display:flex;align-items:center;gap:8px;background:#1E222C;color:#C8CDD8;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-pill.active{background:var(--rojo2);color:white}
.cat-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.main-wrap{display:flex;min-height:calc(100vh - 108px)}
.products-side{flex:1;padding:16px;background:white}
.tools{display:flex;gap:12px;margin-bottom:14px}
.search-box{flex:1;background:white;border:1.5px solid #E8E9EC;border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px;height:40px}
.search-box input{flex:1;border:none;outline:none;font-size:13px}
.search-box svg{width:16px;height:16px;stroke:#6b7280;stroke-width:2}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.main-wrap{flex-direction:column}}
.card{background:white;border:1.5px solid #EFEFF1;border-radius:12px;overflow:hidden;transition:.2s}
.card.agotado{opacity:0.55;border-color:#E5E7EB;background:#F9FAFB}
.card-img{position:relative;height:132px;background:#111;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge-promo{position:absolute;top:8px;left:8px;background:var(--rojo2);color:white;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.badge-agotado{position:absolute;top:8px;right:8px;background:#111;color:white;font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px;display:none}
.card.agotado .badge-agotado{display:block}
.card-body{padding:10px 8px}
.card-name{font-size:12.5px;font-weight:700;height:28px;overflow:hidden;display:flex;align-items:center;gap:5px}
.card-name svg{width:14px;height:14px;stroke:#6b7280;flex-shrink:0}
.card-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.price{font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px}
.price svg{width:12px;height:12px}
.tag-disc{background:var(--rojo2);color:white;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:3px}
.tag-disc svg{width:10px;height:10px;stroke:white}
.switch-mini{width:34px;height:20px;background:#D1D5DB;border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch-mini.on{background:#22C55E}
.switch-mini::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch-mini.on::after{transform:translateX(14px)}
.card-actions{display:flex;gap:10px;border-top:1px solid #F1F1F3;margin-top:8px;padding-top:7px}
.card-actions button{background:white;border:1px solid #E5E7EB;border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.card-actions button:hover{background:#F3F4F6}
.card-actions svg{width:14px;height:14px;stroke:#111;stroke-width:1.8;fill:none}
.edit-side{width:380px;background:white;border-left:1.5px solid #EFEFF1;display:flex;flex-direction:column}
.edit-header{background:var(--negro);color:white;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.edit-header h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.edit-header h3 svg{width:18px;height:18px;stroke:white}
.btn-guardar{background:var(--rojo2);color:white;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-guardar svg{width:14px;height:14px;stroke:white}
.edit-body{padding:14px;overflow-y:auto;flex:1}
.img-preview{width:120px;height:96px;border-radius:10px;overflow:hidden;background:#111}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.btn-cambiar{background:var(--negro);color:white;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-cambiar svg{width:14px;height:14px;stroke:white}
.label{font-size:11.5px;font-weight:700;color:#374151;margin-bottom:6px;display:block;margin-top:12px;display:flex;align-items:center;gap:5px}
.label svg{width:12px;height:12px;stroke:#6b7280}
.input{width:100%;border:1.5px solid #E5E7EB;border-radius:8px;height:38px;padding:0 12px;font-size:13px;outline:none}
.row2{display:flex;gap:10px}
.promo-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.promo-head b{font-size:12px;display:flex;align-items:center;gap:6px}
.promo-head b svg{width:14px;height:14px}
.switch-red{width:36px;height:20px;background:#E5E7EB;border-radius:999px;position:relative;cursor:pointer}
.switch-red.on{background:var(--rojo2)}
.switch-red::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%;transition:.2s}
.switch-red.on::after{transform:translateX(16px)}
.small-label{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:4px;display:block;margin-top:10px}
.discount-box{display:flex;align-items:center;border:1.5px solid #E5E7EB;border-radius:8px;height:36px;overflow:hidden}
.discount-box input{flex:1;border:none;padding:0 10px;height:100%;outline:none;font-size:13px}
.discount-box span{background:#F3F4F6;padding:0 10px;height:100%;display:flex;align-items:center;font-size:12px;font-weight:700;border-left:1.5px solid #E5E7EB}
#toastOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:none;align-items:center;justify-content:center}
#toastOverlay.show{display:flex}
.toast-card{background:white;border-radius:16px;padding:20px 24px;min-width:280px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);border-top:4px solid #22C55E}
#confirmOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;display:none;align-items:center;justify-content:center}
#confirmOverlay.show{display:flex}
.confirm-card{background:white;border-radius:16px;padding:22px 20px;min-width:320px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,0.3)}
.confirm-btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn-cancel{background:white;border:1.5px solid #E5E7EB;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer}
.btn-confirm{background:var(--rojo2);color:white;border:none;border-radius:8px;padding:8px 18px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="toastOverlay"><div class="toast-card" id="toastCard"><h4 id="toastTitle">Guardado</h4><p id="toastMsg" style="font-size:12px;color:#6b7280;margin-top:4px">Producto actualizado</p></div></div>
<div id="confirmOverlay"><div class="confirm-card"><h4 style="font-size:15px;font-weight:800"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2" style="vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>¿Deseas eliminar este producto?</h4><p id="confirmText" style="font-size:12.5px;color:#6b7280;margin-top:8px">Esta acción no se puede deshacer.</p><div class="confirm-btns"><button class="btn-cancel" onclick="cerrarConfirm()">Cancelar</button><button class="btn-confirm" onclick="confirmarEliminar()">Eliminar</button></div></div></div>

<div class="top-header">
  <div class="top-left">
    <button class="btn-x" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="top-left-text"><h1>Menú / Carta</h1><p>Administra tus productos, precios y promociones en tiempo real.</p></div>
  </div>
  <div class="top-right">
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-aggcategoria.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar categoría</button>
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-aggproducto.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar producto</button>
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-configuracion.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 2 2 0 0 1-2 2 2 2 0 0 1-2-2 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 2 2 0 0 1-2-2 2 2 0 0 1 2-2c.26 0 .5.1.7.28a1.65 1.65 0 0 0 1.8.33c.26-.1.5-.28.7-.5A1.65 1.65 0 0 0 9 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 13.32 4.68c.26 0 .5-.1.7-.28A2 2 0 0 1 16 4a2 2 0 0 1 2 2c0 .26-.1.5-.28.7a1.65 1.65 0 0 0-.33 1.8c.1.26.28.5.5.7.18.18.28.44.28.7a1.65 1.65 0 0 0-.17 1z"/></svg>Configuración</button>
  </div>
</div>
<div class="cat-bar" id="catBar"></div>
<div class="main-wrap">
  <div class="products-side">
    <div class="tools">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg><input id="buscador" placeholder="Buscar producto..."></div>
      <select class="filter-select" id="filtroEstado"><option value="todos">Todos</option><option value="activos">Activos</option><option value="inactivos">Agotados</option></select>
    </div>
    <div class="grid" id="gridProductos"></div>
  </div>
  <div class="edit-side">
    <div class="edit-header"><h3><svg viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Editar producto</h3><button class="btn-guardar" onclick="guardarProducto()"><svg viewBox="0 0 24 24" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Guardar</button></div>
    <div class="edit-body">
      <div class="img-row"><div class="img-preview"><img id="editImg" src=""></div><input type="file" id="inputFileImg" accept="image/*" style="display:none"><button class="btn-cambiar" onclick="document.getElementById('inputFileImg').click()"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.5-3.5a2 2 0 0 0-2.8 0L3 23"/></svg>Cambiar imagen</button></div>
      <label class="label"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Nombre</label><input id="editNombre" class="input">
      <label class="label"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Categoría</label><select id="editCat" class="input"></select>
      <label class="label"><svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h6a3.5 3.5 0 0 1 0 7H6"/></svg>Precio</label><div class="discount-box"><span>$</span><input id="editPrecio" type="number"></div>
      <div class="promo-head"><b><svg viewBox="0 0 24 24" fill="none"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>Promoción / Descuento</b><div class="switch-red on" id="switchPromo"></div></div>
      <div class="row2"><div style="flex:1"><label class="small-label">Tipo de promoción</label><select id="editTipoPromo" class="input"><option value="descuento">Descuento</option><option value="2x1">2x1</option><option value="promo">Promo</option></select></div><div style="flex:1"><label class="small-label">Porcentaje</label><div class="discount-box"><input id="editPorc" type="number" value="10"><span>%</span></div></div></div>
      <label class="small-label">Precio con descuento</label><div class="discount-box"><span>$</span><input id="editPrecioDesc" readonly></div>
      <div style="margin-top:14px"><label class="small-label" style="font-weight:800;color:#111;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>Estado del producto</label><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><div class="switch-mini on" id="switchEstadoProd"></div><span style="font-size:11px;color:#6b7280">Activo (visible en el menú del restaurante)</span></div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059",
  measurementId: "G-5HETSEL4PT"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
let categoriaReal='alitas', idReal='alitas_factory', productos=[], productoEdit=null, productoAEliminar=null, categoriasReales=[];

function toast(t,m){
  document.getElementById('toastTitle').textContent=t;
  document.getElementById('toastMsg').textContent=m;
  document.getElementById('toastOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('toastOverlay').classList.remove('show'),2200);
}
document.getElementById('toastOverlay').onclick=()=>document.getElementById('toastOverlay').classList.remove('show');
function getId(){ return sesion?.id || sesion?.negocio || 'alitas_factory'; }

async function detectarRestaurante(){
  const snap = await get(ref(db,'doloya_aliados'));
  if(!snap.exists()) return;
  const todas=snap.val();
  Object.keys(todas).forEach(cat=>{
    Object.keys(todas[cat]||{}).forEach(key=>{
      if(key===getId()){ categoriaReal=cat; idReal=key; }
    });
  });
  if(todas[getId()]){
    const keys=Object.keys(todas[getId()]);
    if(keys.length>0){ categoriaReal=getId(); idReal=keys[0]; }
  }
}

function renderCategorias(){
  const bar=document.getElementById('catBar');
  const selectEdit=document.getElementById('editCat');
  const cats = [...new Set(productos.map(p=> (p.categoria||'').toLowerCase()).filter(Boolean))];
  categoriasReales = cats.length? cats : ['alitas','burgers','pizzas'];
  bar.innerHTML = `<div class="cat-pill active" data-cat="todas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6z"/></svg>Todas</div>` + categoriasReales.map(c=>`<div class="cat-pill" data-cat="${c}"><svg viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 4 0 0 1 16 0"/></svg>${c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('');
  selectEdit.innerHTML = categoriasReales.map(c=>`<option value="${c}">${c}</option>`).join('');
  bar.querySelectorAll('.cat-pill').forEach(el=>{
    el.addEventListener('click',()=>{
      bar.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); renderProductos();
    });
  });
}

function escucharProductos(){
  const path=`doloya_aliados/${categoriaReal}/${idReal}/menu`;
  onValue(ref(db,path), s=>{
    if(s.exists()){
      const val=s.val();
      productos = Object.keys(val).map(k=>({id:k,...val[k]}));
      renderCategorias();
      renderProductos();
    } else {
      document.getElementById('gridProductos').innerHTML='<p style="padding:20px;color:#6b7280">No hay productos en menu aún</p>';
    }
  });
}

function renderProductos(){
  const grid=document.getElementById('gridProductos');
  const catActive=document.querySelector('.cat-pill.active')?.dataset.cat||'todas';
  const busq=document.getElementById('buscador').value.toLowerCase();
  const filtro=document.getElementById('filtroEstado').value;
  let f=productos;
  if(catActive!=='todas') f=f.filter(p=>(p.categoria||'').toLowerCase()===catActive);
  if(busq) f=f.filter(p=>(p.nombre||'').toLowerCase().includes(busq));
  if(filtro==='activos') f=f.filter(p=>p.activo!==false);
  if(filtro==='inactivos') f=f.filter(p=>p.activo===false);
  grid.innerHTML='';
  f.forEach(p=>{
    const nombre=p.nombre||'Producto';
    const precio=p.precio||0;
    const promo=p.promo||'';
    const img=p.imagen||p.img||'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400';
    const activo=p.activo!==false;
    grid.innerHTML+=`<div class="card ${activo?'':'agotado'}"><div class="card-img"><img src="${img}" onerror="this.src='https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400'">${promo?`<div class="badge-promo"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="vertical-align:middle;margin-right:3px"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>${promo}</div>`:''}<div class="badge-agotado">Agotado</div></div><div class="card-body"><div class="card-name"><svg viewBox="0 0 24 24" fill="none"><path d="M6 13c0 3.87 2.69 7 6 7s6-3.13 6-7-2.69-7-6-7-6 3.13-6 7z"/><path d="M9 13h6"/></svg>${nombre}</div><div class="card-price-row"><div class="price"><svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h6a3.5 3.5 0 0 1 0 7H6"/></svg>$${precio}</div>${promo?`<span class="tag-disc"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="6"/><path d="M15.5 6.5L8 14"/></svg>${promo}</span>`:''}<div class="switch-mini ${activo?'on':''}" data-id="${p.id}" title="${activo?'Disponible':'Agotado'}"></div></div><div class="card-actions"><button class="btn-edit" data-id="${p.id}" title="Editar"><svg viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-delete" data-id="${p.id}" title="Eliminar"><svg viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div></div>`;
  });
  grid.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click',()=>editar(b.dataset.id)));
  grid.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click',()=>abrirConfirmEliminar(b.dataset.id)));
  // BOTON ACTIVO / AGOTADO FUNCIONAL
  grid.querySelectorAll('.switch-mini').forEach(sw=>{
    sw.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id=sw.dataset.id;
      const p=productos.find(x=>x.id===id);
      if(!p) return;
      const nuevoEstado = !sw.classList.contains('on');
      // Guardar en Firebase real
      update(ref(db,`doloya_aliados/${categoriaReal}/${idReal}/menu/${id}`),{ activo: nuevoEstado });
      toast(nuevoEstado?'Disponible':'Agotado', nuevoEstado ? `${p.nombre} ahora es visible en el menú` : `${p.nombre} oculto del menú del restaurante`);
    });
  });
}

function editar(id){
  const p=productos.find(x=>x.id==id); if(!p) return;
  productoEdit=p;
  document.getElementById('editNombre').value=p.nombre||'';
  document.getElementById('editPrecio').value=p.precio||'';
  document.getElementById('editCat').value=(p.categoria||'').toLowerCase();
  document.getElementById('editTipoPromo').value=p.tipoPromo||'descuento';
  document.getElementById('editPorc').value=p.porcentaje||10;
  document.getElementById('editImg').src=p.imagen||p.img||'';
  document.getElementById('switchPromo').className='switch-red '+(p.promoActiva!==false?'on':'');
  document.getElementById('switchEstadoProd').className='switch-mini '+(p.activo!==false?'on':'');
  calcularDesc();
  toast('Producto cargado', p.nombre);
}
function calcularDesc(){
  const precio=parseFloat(document.getElementById('editPrecio').value)||0;
  const porc=parseFloat(document.getElementById('editPorc').value)||0;
  document.getElementById('editPrecioDesc').value=(precio - precio*porc/100).toFixed(2);
}
let timeoutReal=null;
function guardarTiempoReal(){
  if(!productoEdit) return;
  clearTimeout(timeoutReal);
  timeoutReal=setTimeout(()=>{
    const path=`doloya_aliados/${categoriaReal}/${idReal}/menu/${productoEdit.id}`;
    update(ref(db,path),{
      nombre: document.getElementById('editNombre').value,
      precio: parseFloat(document.getElementById('editPrecio').value)||0,
      categoria: document.getElementById('editCat').value,
      tipoPromo: document.getElementById('editTipoPromo').value,
      porcentaje: parseFloat(document.getElementById('editPorc').value)||0,
      promoActiva: document.getElementById('switchPromo').classList.contains('on'),
      activo: document.getElementById('switchEstadoProd').classList.contains('on'),
      precioDescuento: parseFloat(document.getElementById('editPrecioDesc').value)||0,
      promo: document.getElementById('switchPromo').classList.contains('on') ? (document.getElementById('editTipoPromo').value==='descuento'? `-${document.getElementById('editPorc').value}%` : document.getElementById('editTipoPromo').value) : '',
      imagen: document.getElementById('editImg').src
    });
  },400);
}
['editNombre','editPrecio','editCat','editTipoPromo','editPorc'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{ calcularDesc(); guardarTiempoReal(); });
});
document.getElementById('switchPromo').addEventListener('click',function(){ this.classList.toggle('on'); guardarTiempoReal(); toast('Promoción', this.classList.contains('on')?'Promoción activada':'Promoción desactivada'); });
document.getElementById('switchEstadoProd').addEventListener('click',function(){ 
  this.classList.toggle('on'); 
  guardarTiempoReal();
  toast(this.classList.contains('on')?'Disponible':'Agotado', this.classList.contains('on')?'Producto visible en el menú del restaurante':'Producto oculto, no aparecerá en el menú');
});

window.guardarProducto=function(){
  if(!productoEdit){ toast('Error','Selecciona un producto'); return; }
  guardarTiempoReal();
  toast('Guardado','Producto guardado en tiempo real en Firebase');
}
function abrirConfirmEliminar(id){
  productoAEliminar=id;
  const p=productos.find(x=>x.id===id);
  document.getElementById('confirmText').textContent=`¿Deseas eliminar "${p?.nombre||'este producto'}"?`;
  document.getElementById('confirmOverlay').classList.add('show');
}
window.cerrarConfirm=function(){ document.getElementById('confirmOverlay').classList.remove('show'); productoAEliminar=null; }
window.confirmarEliminar=function(){
  if(!productoAEliminar) return;
  remove(ref(db,`doloya_aliados/${categoriaReal}/${idReal}/menu/${productoAEliminar}`));
  document.getElementById('confirmOverlay').classList.remove('show');
  toast('Eliminado','Producto eliminado del menú');
  productoAEliminar=null;
}
document.getElementById('inputFileImg').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('editImg').src=ev.target.result;
    guardarTiempoReal();
    toast('Imagen','Imagen convertida a URL y guardada');
  };
  reader.readAsDataURL(file);
});
document.getElementById('buscador').addEventListener('input',renderProductos);
document.getElementById('filtroEstado').addEventListener('change',renderProductos);

(async()=>{
  if(!sesion){ location.href='index.html'; return; }
  await detectarRestaurante();
  escucharProductos();
})();
</script>
</body>
</html>
