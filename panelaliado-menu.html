<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú / Carta - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#F5F5F7;min-height:100vh}
:root{--rojo:#C50D1F;--rojo2:#E30613;--negro:#11141A}
.top-header{background:var(--rojo);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;height:64px;position:sticky;top:0;z-index:100}
.top-left{display:flex;align-items:center;gap:14px;min-width:0}
.btn-x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:white;border:none;border-radius:50%;color:var(--rojo2);flex-shrink:0}
.btn-x svg{width:18px;height:18px;stroke:var(--rojo2);stroke-width:3}
.top-left-text h1{color:white;font-size:22px;font-weight:800;line-height:1.1}
.top-left-text p{color:rgba(255,255,255,0.85);font-size:12px;font-weight:500;line-height:1.2}
.top-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-black{background:var(--negro);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn-black svg{width:16px;height:16px;stroke:white;stroke-width:2.5;fill:none}
.btn-black .icon-plus-white{width:18px;height:18px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-black .icon-plus-white svg{stroke:#111!important}
.cat-bar{background:var(--negro);padding:10px 18px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{display:flex;align-items:center;justify-content:center;background:#1E222C;color:#C8CDD8;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1.5px solid transparent;text-transform:capitalize}
.cat-pill.active{background:var(--rojo2);color:white}
.main-wrap{display:flex;min-height:calc(100vh - 108px)}
.products-side{flex:1;padding:16px;background:white;min-width:0}
.tools{display:flex;gap:12px;margin-bottom:14px}
.search-box{flex:1;background:white;border:1.5px solid #E8E9EC;border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px;height:40px;min-width:0}
.search-box input{flex:1;border:none;outline:none;font-size:13px;min-width:0}
.filter-select{border:1.5px solid #E8E9EC;border-radius:10px;height:40px;padding:0 10px;font-size:13px;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:white;border:1.5px solid #EFEFF1;border-radius:12px;overflow:hidden;transition:.2s}
.card.agotado{opacity:0.55;border-color:#E5E7EB;background:#F9FAFB}
.card-img{position:relative;height:132px;background:#111;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge-promo{position:absolute;top:8px;left:8px;background:var(--rojo2);color:white;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.badge-agotado{position:absolute;top:8px;right:8px;background:#111;color:white;font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px;display:none}
.card.agotado .badge-agotado{display:block}
.card-body{padding:10px 8px}
.card-name{font-size:12.5px;font-weight:700;max-height:32px;overflow:hidden;line-height:1.25;word-break:break-word}
.card-desc{font-size:10.5px;color:#6B7280;margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:14px;word-break:break-word}
.card-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px;flex-wrap:wrap}
.price{font-size:13px;font-weight:800}
.price-old{font-size:11px;color:#9AA0A6;text-decoration:line-through;font-weight:600}
.price-disc{font-size:11px;color:#E30613;font-weight:800;background:#FFE1E6;padding:2px 6px;border-radius:4px}
.price-new{font-size:13px;font-weight:900;color:#111}
.price-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.switch-mini{width:34px;height:20px;background:#D1D5DB;border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch-mini.on{background:#22C55E}
.switch-mini::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%;transition:.2s}
.switch-mini.on::after{transform:translateX(14px)}
.card-actions{display:flex;gap:10px;border-top:1px solid #F1F1F3;margin-top:8px;padding-top:7px}
.card-actions button{background:white;border:1px solid #E5E7EB;border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card-actions svg{width:14px;height:14px;stroke:#111;stroke-width:1.8;fill:none}
.edit-side{width:380px;background:white;border-left:1.5px solid #EFEFF1;display:flex;flex-direction:column;flex-shrink:0}
.edit-header{background:var(--negro);color:white;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.edit-header h3{font-size:15px;font-weight:800}
.btn-guardar{background:var(--rojo2);color:white;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.edit-body{padding:14px;overflow-y:auto;flex:1}
.img-preview{width:120px;height:96px;border-radius:10px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.btn-cambiar{background:var(--negro);color:white;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.label{font-size:11.5px;font-weight:700;color:#374151;margin-bottom:6px;display:block;margin-top:12px;word-break:break-word}
.input{width:100%;border:1.5px solid #E5E7EB;border-radius:8px;height:38px;padding:0 12px;font-size:13px;outline:none;min-width:0}
.textarea{width:100%;border:1.5px solid #E5E7EB;border-radius:8px;padding:10px 12px;font-size:13px;outline:none;resize:none;min-height:62px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.promo-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:10px}
.promo-head b{font-size:12px;white-space:normal;display:flex;align-items:center;gap:6px;line-height:1.2}
.switch-red{width:36px;height:20px;background:#E5E7EB;border-radius:999px;position:relative;cursor:pointer;flex-shrink:0}
.switch-red.on{background:var(--rojo2)}
.switch-red::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%;transition:.2s}
.switch-red.on::after{transform:translateX(16px)}
.small-label{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:4px;display:block;margin-top:10px;white-space:normal;line-height:1.2}
.discount-box{display:flex;align-items:center;border:1.5px solid #E5E7EB;border-radius:8px;height:36px;overflow:hidden;flex:1;min-width:0}
.discount-box input{flex:1;border:none;padding:0 10px;height:100%;outline:none;font-size:13px;min-width:0}
.discount-box span{background:#F3F4F6;padding:0 10px;height:100%;display:flex;align-items:center;font-size:12px;font-weight:700;border-left:1.5px solid #E5E7EB;flex-shrink:0}
.promo-line{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:8px; }
.promo-line > div{ flex:1; min-width:120px; }
#toastOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
#toastOverlay.show{display:flex}
.toast-card{background:white;border-radius:16px;padding:20px 24px;min-width:280px;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);border-top:4px solid #22C55E}
#confirmOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;display:none;align-items:center;justify-content:center;padding:16px}
#confirmOverlay.show{display:flex}
.confirm-card{background:white;border-radius:16px;padding:22px 20px;min-width:320px;max-width:90vw;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,0.3)}
.confirm-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn-cancel{background:white;border:1.5px solid #E5E7EB;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer}
.btn-confirm{background:var(--rojo2);color:white;border:none;border-radius:8px;padding:8px 18px;font-weight:800;cursor:pointer}
@media(max-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .top-header{height:auto;min-height:56px;padding:8px 10px;flex-wrap:wrap;gap:8px}
  .top-left{gap:10px;flex:1}
  .top-left-text h1{font-size:16px}
  .top-left-text p{font-size:10px;display:block;line-height:1.2}
  .top-right{width:100%;overflow-x:auto;scrollbar-width:none;gap:8px;padding-bottom:2px;justify-content:flex-start}
  .top-right::-webkit-scrollbar{display:none}
  .btn-black{padding:7px 12px;font-size:11.5px}
  .main-wrap{flex-direction:column}
  .products-side{padding:10px}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .edit-side{width:100%;border-left:none;border-top:1.5px solid #EFEFF1}
  .tools{flex-wrap:wrap}
  .promo-line > div{min-width:100px}
}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card-img{height:110px}
  .card-body{padding:8px 6px}
  .card-name{font-size:11.5px;max-height:34px}
  .card-desc{font-size:10px}
  .card-price-row{flex-direction:column;align-items:flex-start;gap:4px}
  .price{font-size:12px}
  .price-old,.price-disc,.price-new{font-size:10.5px}
  .edit-body{padding:12px}
  .img-preview{width:90px;height:72px}
  .label{font-size:11px;margin-top:10px}
  .input,.textarea{font-size:12.5px}
  .cat-bar{padding:8px 10px;gap:8px}
  .cat-pill{padding:6px 12px;font-size:12px}
  .top-left-text h1{font-size:15px}
  .btn-black .icon-plus-white{width:16px;height:16px}
}
@media(max-width:380px){
  .grid{grid-template-columns:1fr 1fr}
  .top-right{gap:6px}
  .btn-black{font-size:11px;padding:6px 10px}
}
</style>
</head>
<body>
<div id="toastOverlay"><div class="toast-card"><h4 id="toastTitle">Guardado</h4><p id="toastMsg" style="font-size:12px;color:#6b7280;margin-top:4px">Producto actualizado</p></div></div>
<div id="confirmOverlay"><div class="confirm-card"><h4 style="font-size:15px;font-weight:800">¿Deseas eliminar este producto?</h4><p id="confirmText" style="font-size:12.5px;color:#6b7280;margin-top:8px">Esta acción no se puede deshacer.</p><div class="confirm-btns"><button class="btn-cancel" onclick="cerrarConfirm()">Cancelar</button><button class="btn-confirm" onclick="confirmarEliminar()">Eliminar</button></div></div></div>
<div class="top-header">
  <div class="top-left">
    <button class="btn-x" onclick="location.href='panelaliado.html'"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="top-left-text"><h1>Menú / Carta</h1><p>Administra tus productos, precios y promociones en tiempo real.</p></div>
  </div>
  <div class="top-right">
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-aggcategoria.html'"><span class="icon-plus-white"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>Agregar categoría</button>
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-aggproducto.html'"><span class="icon-plus-white"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>Agregar producto</button>
    <button class="btn-black" onclick="window.location.href='panelaliado-menu-configuracion.html'"><svg viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 2 2 0 0 1-2 2 2 2 0 0 1-2-2 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 2 2 0 0 1-2-2 2 2 0 0 1 2-2c.26 0 .5.1.7.28a1.65 1.65 0 0 0 1.8.33c.26-.1.5-.28.7-.5A1.65 1.65 0 0 0 9 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 13.32 4.68c.26 0 .5-.1.7-.28A2 2 0 0 1 16 4a2 2 0 0 1 2 2c0 .26-.1.5-.28.7a1.65 1.65 0 0 0-.33 1.8c.1.26.28.5.5.7.18.18.28.44.28.7a1.65 1.65 0 0 0-.17 1z"/></svg>Configuración</button>
  </div>
</div>
<div class="cat-bar" id="catBar"></div>
<div class="main-wrap">
  <div class="products-side">
    <div class="tools">
      <div class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg><input id="buscador" placeholder="Buscar producto..."></div>
      <select class="filter-select" id="filtroEstado"><option value="todos">Todos</option><option value="activos">Activos</option><option value="inactivos">Agotados</option></select>
    </div>
    <div class="grid" id="gridProductos"></div>
  </div>
  <div class="edit-side">
    <div class="edit-header"><h3>Editar producto</h3><button class="btn-guardar" onclick="guardarProducto()">Guardar</button></div>
    <div class="edit-body">
      <div class="img-row"><div class="img-preview"><img id="editImg" src=""></div><input type="file" id="inputFileImg" accept="image/*" style="display:none"><button class="btn-cambiar" onclick="document.getElementById('inputFileImg').click()">Cambiar imagen</button></div>
      <label class="label">Nombre del producto</label><input id="editNombre" class="input">
      <label class="label">Descripción del producto "Opcional"</label><textarea id="editDescripcion" class="textarea" placeholder="Ej: Incluye papas, bebida, salsa especial..."></textarea>
      <label class="label">Categoría</label><select id="editCat" class="input"></select>
      <label class="label">Precio</label><div class="discount-box"><span>$</span><input id="editPrecio" type="number" step="0.01"></div>
      <div class="promo-head"><b>Promoción / Descuento</b><div class="switch-red on" id="switchPromo"></div></div>
      <div class="promo-line">
        <div><label class="small-label">Tipo de promoción</label><select id="editTipoPromo" class="input"><option value="descuento">Descuento</option><option value="2x1">2x1</option><option value="promo">Promo</option></select></div>
        <div><label class="small-label">Porcentaje</label><div class="discount-box"><input id="editPorc" type="number" value="10" step="0.01"><span>%</span></div></div>
      </div>
      <label class="small-label">Precio con descuento</label><div class="discount-box"><span>$</span><input id="editPrecioDesc" readonly></div>
      <div style="margin-top:14px"><label class="small-label" style="font-weight:800;color:#111">Estado del producto</label><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><div class="switch-mini on" id="switchEstadoProd"></div><span style="font-size:11px;color:#6b7280">Activo (visible en el menú del restaurante)</span></div></div>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
let productos=[], productoEdit=null, productoAEliminar=null, categoriasReales=[], categoriasExtra=[], mapaCategorias={};
let businessPath = '';

function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function esInfo(key){
  const k = normalize(key).replace('_','');
  return k==='info' || k==='infos' || k==='informacion' || k==='information';
}

function toast(t,m){
  document.getElementById('toastTitle').textContent=t;
  document.getElementById('toastMsg').textContent=m;
  document.getElementById('toastOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('toastOverlay').classList.remove('show'),2200);
}
document.getElementById('toastOverlay').onclick=()=>document.getElementById('toastOverlay').classList.remove('show');

async function detectarNegocioReal(){
  const s = sesion;
  if(!s) return null;
  const idBuscado = normalize(s.id || s.negocio || s.nombre || '');
  const snap = await get(ref(db, 'doloya_aliados'));
  if(!snap.exists()) return null;
  const data = snap.val();
  for(const key of Object.keys(data)){
    if(normalize(key)===idBuscado || normalize(key).includes(idBuscado) || idBuscado.includes(normalize(key))){
      if(data[key] && typeof data[key]==='object'){
        for(const subKey of Object.keys(data[key])){
          const sub = data[key][subKey];
          if(sub && typeof sub==='object' && (sub.categorias || sub.disponibilidad)){
            businessPath = `doloya_aliados/${key}/${subKey}`;
            return { path: businessPath, node: sub };
          }
        }
      }
      businessPath = `doloya_aliados/${key}`;
      return { path: businessPath, node: data[key] };
    }
    if(typeof data[key]==='object'){
      for(const subKey of Object.keys(data[key])){
        if(normalize(subKey)===idBuscado){
          businessPath = `doloya_aliados/${key}/${subKey}`;
          return { path: businessPath, node: data[key][subKey] };
        }
      }
    }
  }
  for(const key of Object.keys(data)){
    if(typeof data[key]==='object'){
      for(const subKey of Object.keys(data[key])){
        const sub = data[key][subKey];
        if(sub && sub.categorias){
          businessPath = `doloya_aliados/${key}/${subKey}`;
          return { path: businessPath, node: sub };
        }
      }
    }
  }
  return null;
}

function renderCategorias(){
  const bar=document.getElementById('catBar');
  const selectEdit=document.getElementById('editCat');
  let catsActivas = categoriasExtra.filter(c=>{
    if(esInfo(c.key)) return false;
    if(esInfo(c.nombre)) return false;
    if(c.key.startsWith('_')) return false;
    return c.activa!==false;
  });
  catsActivas.sort((a,b)=>(a.orden??99)-(b.orden??99));
  if(catsActivas.length===0){
    bar.innerHTML = `<div class="cat-pill active" data-cat="todas">Todas</div>`;
    selectEdit.innerHTML = `<option value="">Sin categorías</option>`;
    categoriasReales=[];
    return;
  }
  categoriasReales = catsActivas.map(c=> (c.nombreLower||c.key||'').toLowerCase());
  mapaCategorias = {};
  categoriasExtra.forEach(c=>{
    if(esInfo(c.key) || esInfo(c.nombre)) return;
    const key = (c.nombreLower||c.key||'').toLowerCase();
    mapaCategorias[key] = c.activa!==false;
  });
  bar.innerHTML = `<div class="cat-pill active" data-cat="todas">Todas</div>` + catsActivas.map(c=>`<div class="cat-pill" data-cat="${(c.nombreLower||c.key).toLowerCase()}">${c.nombre}</div>`).join('');
  selectEdit.innerHTML = catsActivas.map(c=>`<option value="${(c.nombreLower||c.key).toLowerCase()}">${c.nombre}</option>`).join('');
  bar.querySelectorAll('.cat-pill').forEach(el=>{
    el.addEventListener('click',()=>{
      bar.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); renderProductos();
    });
  });
}

async function escucharProductos(){
  const infoNegocio = await detectarNegocioReal();
  if(!infoNegocio){
    document.getElementById('gridProductos').innerHTML='<p style="padding:20px;color:#6b7280">No se encontró tu negocio.</p>';
    return;
  }
  const pathCategorias = `${infoNegocio.path}/categorias`;
  onValue(ref(db, infoNegocio.path), s=>{
    productos = [];
    categoriasExtra = [];
    if(!s.exists()){
      renderCategorias(); renderProductos(); return;
    }
    const data = s.val();
    let nodoCategorias = data.categorias || {};
    const camposIgnorarProd = ['activa','fecha','key','nombre','nombreLower','orden','_info'];

    Object.keys(nodoCategorias).forEach(k=>{
      if(k.startsWith('_')) return;
      if(esInfo(k)) return;
      const v = nodoCategorias[k];
      if(!v || typeof v!=='object') return;
      if(v.nombre && v.nombreLower){
        if(!esInfo(v.nombre) && !esInfo(v.key||k)){
          categoriasExtra.push({
            id: k, key: v.key || k, nombre: v.nombre || k,
            nombreLower: (v.nombreLower || v.key || k).toLowerCase(),
            activa: v.activa !== false, orden: v.orden ?? v.fecha ?? 99,
            path: `${pathCategorias}/${k}`
          });
        }
      }
      if(k==='categorias' && typeof v==='object'){
        Object.keys(v).forEach(catKey=>{
          if(catKey.startsWith('_')) return;
          if(esInfo(catKey)) return;
          const catObj = v[catKey];
          if(!catObj || typeof catObj!=='object') return;
          if(catObj.nombre && catObj.nombreLower){
            if(esInfo(catObj.nombre) || esInfo(catKey)) return;
            if(!categoriasExtra.find(c=>normalize(c.key)===normalize(catKey))){
              categoriasExtra.push({
                id: catKey, key: catObj.key || catKey, nombre: catObj.nombre || catKey,
                nombreLower: (catObj.nombreLower || catObj.key || catKey).toLowerCase(),
                activa: catObj.activa !== false, orden: catObj.orden ?? catObj.fecha ?? 99,
                path: `${pathCategorias}/categorias/${catKey}`
              });
            }
          }
          Object.keys(catObj).forEach(prodKey=>{
            if(camposIgnorarProd.includes(prodKey)) return;
            if(esInfo(prodKey)) return;
            const prod = catObj[prodKey];
            if(!prod || typeof prod!=='object') return;
            if(prod.nombre && (prod.precio!==undefined || prod.imagen || prod.descripcion!==undefined)){
              productos.push({
                id: prodKey,
                firebasePath: `${pathCategorias}/categorias/${catKey}/${prodKey}`,
                categoriaKey: catKey.toLowerCase(),
                categoriaNombre: catObj.nombre,
                ...prod
              });
            }
          });
        });
      }
    });
    renderCategorias();
    renderProductos();
  });
}

function fmtPrecio(n){ const num = parseFloat(n); if(isNaN(num)) return '0'; return Number.isInteger(num) ? num.toFixed(0) : num.toFixed(2); }
function renderProductos(){
  const grid=document.getElementById('gridProductos');
  const catActive=document.querySelector('.cat-pill.active')?.dataset.cat||'todas';
  const busq=document.getElementById('buscador').value.toLowerCase();
  const filtro=document.getElementById('filtroEstado').value;
  let f=productos;
  f=f.filter(p=>{
    const cat = (p.categoria||p.categoriaKey||'').toLowerCase();
    if(esInfo(cat)) return false;
    if(mapaCategorias[cat]===false) return false;
    return true;
  });
  if(catActive!=='todas') f=f.filter(p=> (p.categoria||p.categoriaKey||'').toLowerCase()===catActive );
  if(busq) f=f.filter(p=>(p.nombre||'').toLowerCase().includes(busq));
  if(filtro==='activos') f=f.filter(p=>p.activo!==false && p.disponibilidad!==false);
  if(filtro==='inactivos') f=f.filter(p=>p.activo===false || p.disponibilidad===false);
  grid.innerHTML='';
  if(f.length===0){
    const catNombre = catActive==='todas' ? 'esta vista' : catActive;
    grid.innerHTML=`<div style="padding:30px 20px;text-align:center;color:#6b7280;width:100%"><p style="font-size:14px;font-weight:600">No hay productos en ${catNombre} aún.</p><p style="font-size:12px;margin-top:6px">Tus productos de Salchipapas aparecerán aquí cuando los agregues.</p></div>`;
    return;
  }
  f.forEach(p=>{
    const nombre=p.nombre||'Producto';
    const descripcion=p.descripcion||'';
    const precio=parseFloat(p.precio||0);
    const porcentaje=parseFloat(p.porcentaje||p.descuento||0);
    const promoActiva = p.promoActiva!==false && porcentaje>0;
    const precioDesc = p.precioDescuento ? parseFloat(p.precioDescuento) : (promoActiva ? (precio - precio*porcentaje/100) : 0);
    const promoTexto=p.promo||'';
    const img=p.imagen||p.img||'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400';
    const activo=p.activo!==false && p.disponibilidad!==false;
    let htmlPrecio = '';
    if(promoActiva && precioDesc>0){
      htmlPrecio = `<div class="price-line"><span class="price-old">$${fmtPrecio(precio)}</span><span class="price-disc">-${fmtPrecio(porcentaje)}%</span><span class="price-new">$${fmtPrecio(precioDesc)}</span></div>`;
    }else{
      htmlPrecio = `<span class="price">$${fmtPrecio(precio)}</span>`;
    }
    grid.innerHTML+=`<div class="card ${activo?'':'agotado'}"><div class="card-img"><img src="${img}"><div class="badge-promo" style="${promoTexto?'':'display:none'}">${promoTexto}</div><div class="badge-agotado">Agotado</div></div><div class="card-body"><div class="card-name">${nombre}</div>${descripcion?`<div class="card-desc">${descripcion}</div>`:''}<div class="card-price-row">${htmlPrecio}<div class="switch-mini ${activo?'on':''}" data-id="${p.id}"></div></div><div class="card-actions"><button class="btn-edit" data-id="${p.id}"><svg viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-delete" data-id="${p.id}"><svg viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div></div></div>`;
  });
  grid.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click',()=>editar(b.dataset.id)));
  grid.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click',()=>abrirConfirmEliminar(b.dataset.id)));
  grid.querySelectorAll('.switch-mini').forEach(sw=>{
    sw.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id=sw.dataset.id;
      const p=productos.find(x=>x.id===id);
      const nuevoEstado = !sw.classList.contains('on');
      update(ref(db,p.firebasePath),{ activo: nuevoEstado, disponibilidad: nuevoEstado });
      toast(nuevoEstado?'Disponible':'Agotado', nuevoEstado ? `${p.nombre} ahora es visible` : `${p.nombre} oculto del menú`);
    });
  });
}
function editar(id){
  const p=productos.find(x=>x.id==id); if(!p) return;
  productoEdit=p;
  document.getElementById('editImg').src = p.imagen||p.img||'';
  document.getElementById('editNombre').value=p.nombre||'';
  document.getElementById('editDescripcion').value=p.descripcion||'';
  document.getElementById('editPrecio').value=p.precio||'';
  document.getElementById('editCat').value=(p.categoria||p.categoriaKey||'').toLowerCase();
  document.getElementById('editTipoPromo').value=p.tipoPromo||'descuento';
  document.getElementById('editPorc').value=p.porcentaje||p.descuento||10;
  document.getElementById('switchPromo').className='switch-red '+(p.promoActiva!==false?'on':'');
  document.getElementById('switchEstadoProd').className='switch-mini '+(p.activo!==false && p.disponibilidad!==false?'on':'');
  calcularDesc();
  toast('Producto cargado', p.nombre);
  if(window.innerWidth<=900){ document.querySelector('.edit-side').scrollIntoView({behavior:'smooth'}); }
}
function calcularDesc(){
  const precio=parseFloat(document.getElementById('editPrecio').value)||0;
  const porc=parseFloat(document.getElementById('editPorc').value)||0;
  const desc = precio - precio*porc/100;
  document.getElementById('editPrecioDesc').value = desc.toFixed(2);
}
let timeoutReal=null;
function guardarTiempoReal(silent=false){
  if(!productoEdit) return;
  clearTimeout(timeoutReal);
  timeoutReal=setTimeout(()=>{
    update(ref(db,productoEdit.firebasePath),{
      nombre: document.getElementById('editNombre').value,
      descripcion: document.getElementById('editDescripcion').value,
      precio: parseFloat(document.getElementById('editPrecio').value)||0,
      categoria: document.getElementById('editCat').value,
      tipoPromo: document.getElementById('editTipoPromo').value,
      porcentaje: parseFloat(document.getElementById('editPorc').value)||0,
      descuento: parseFloat(document.getElementById('editPorc').value)||0,
      promoActiva: document.getElementById('switchPromo').classList.contains('on'),
      activo: document.getElementById('switchEstadoProd').classList.contains('on'),
      disponibilidad: document.getElementById('switchEstadoProd').classList.contains('on'),
      precioDescuento: parseFloat(document.getElementById('editPrecioDesc').value)||0,
      promo: document.getElementById('switchPromo').classList.contains('on') ? (document.getElementById('editTipoPromo').value==='descuento'? `-${document.getElementById('editPorc').value}%` : document.getElementById('editTipoPromo').value) : '',
      imagen: document.getElementById('editImg').src
    });
    if(!silent) toast('Guardando...','Actualización en tiempo real');
  },400);
}
['editNombre','editDescripcion','editPrecio','editCat','editTipoPromo','editPorc'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{ calcularDesc(); guardarTiempoReal(true); });
});
document.getElementById('switchPromo').addEventListener('click',function(){ this.classList.toggle('on'); guardarTiempoReal(); });
document.getElementById('switchEstadoProd').addEventListener('click',function(){ this.classList.toggle('on'); guardarTiempoReal(); toast(this.classList.contains('on')?'Disponible':'Agotado', this.classList.contains('on')?'Visible en menú':'Oculto del menú'); });
function limpiarEditar(){
  productoEdit=null;
  document.getElementById('editImg').src='';
  document.getElementById('editNombre').value='';
  document.getElementById('editDescripcion').value='';
  document.getElementById('editPrecio').value='';
  document.getElementById('editPorc').value=10;
  document.getElementById('editPrecioDesc').value='';
  document.getElementById('editTipoPromo').value='descuento';
  document.getElementById('switchPromo').className='switch-red on';
  document.getElementById('switchEstadoProd').className='switch-mini on';
}
window.guardarProducto=function(){
  if(!productoEdit){ toast('Error','Selecciona un producto'); return; }
  guardarTiempoReal();
  toast('Guardado','Producto guardado correctamente');
  setTimeout(()=>{ limpiarEditar(); }, 600);
}
function abrirConfirmEliminar(id){
  productoAEliminar=id;
  const p=productos.find(x=>x.id===id);
  document.getElementById('confirmText').textContent=`¿Deseas eliminar "${p?.nombre||'este producto'}"?`;
  document.getElementById('confirmOverlay').classList.add('show');
}
window.cerrarConfirm=function(){ document.getElementById('confirmOverlay').classList.remove('show'); productoAEliminar=null; }
window.confirmarEliminar=function(){
  if(!productoAEliminar) return;
  const p = productos.find(x=>x.id===productoAEliminar);
  if(p && p.firebasePath){ remove(ref(db,p.firebasePath)); }
  document.getElementById('confirmOverlay').classList.remove('show');
  toast('Eliminado','Producto eliminado');
  productoAEliminar=null;
}
document.getElementById('inputFileImg').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('editImg').src=ev.target.result;
    guardarTiempoReal(true);
    toast('Imagen','Imagen cambiada');
  };
  reader.readAsDataURL(file);
});
document.getElementById('buscador').addEventListener('input',renderProductos);
document.getElementById('filtroEstado').addEventListener('change',renderProductos);
(()=>{ const s = sesion; if(!s){ location.href='index.html'; return; } escucharProductos(); })();
</script>
