<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de tráfico - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;min-height:100vh}
.header-top{background:white;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.btn-x{width:42px;height:42px;background:#E30613;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.header-top h1{font-size:18px;font-weight:900;text-transform:lowercase}
.main-layout{display:flex;height:calc(100vh - 58px)}
.left-panel{width:380px;background:white;border-right:1px solid #e2e8f0;display:flex;flex-direction:column}
.left-head{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between}
.left-head b{font-size:11px;font-weight:800;text-transform:uppercase;color:#0f172a}
.left-head span{font-size:11px;background:#0a1020;color:white;padding:4px 10px;border-radius:999px}
.lista{flex:1;overflow-y:auto}
.item-ip{padding:14px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s}
.item-ip:hover{background:#f8fafc}
.item-ip.active{background:#0a1020;color:white}
.item-ip .icon-ip{width:36px;height:36px;background:#0a1020;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:900}
.item-ip.active .icon-ip{background:white;color:#0a1020}
.item-ip .info-ip{flex:1;min-width:0}
.item-ip .info-ip b{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-ip .info-ip span{font-size:11px;color:#64748b;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-ip.active .info-ip span{color:rgba(255,255,255,.7)}
.copias{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#fef2f2;color:#B70A1A;border:1px solid #fecaca;margin-left:6px}
.item-ip.active .copias{background:white;color:#0a1020;border-color:white}
.badge-live{width:8px;height:8px;background:#16a34a;border-radius:50%;box-shadow:0 0 0 4px rgba(22,163,74,.2);flex-shrink:0}
.right-panel{flex:1;display:flex;flex-direction:column;background:#f6f8fb}
.mapa-wrap{height:52%;background:#e2e8f0;position:relative;overflow:hidden}
.mapa-wrap iframe{width:100%;height:100%;border:0}
.empty-mapa{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:10px}
.datos-wrap{height:48%;background:white;border-top:1px solid #e2e8f0;overflow-y:auto;padding:16px}
.datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-dato{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:12px}
.card-dato label{font-size:9px;font-weight:800;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.card-dato b{font-size:13px;font-weight:800;color:#0f172a;word-break:break-all}
.card-dato.full{grid-column:1 / -1}
.btn-ruta{width:100%;margin-top:12px;background:#0a1020;color:white;border:none;border-radius:999px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tag{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;display:inline-block}
@media(max-width:900px){
  .main-layout{flex-direction:column;height:auto}
  .left-panel{width:100%;height:45vh}
  .right-panel{height:auto}
  .mapa-wrap{height:300px}
  .datos-wrap{height:auto}
}
</style>
</head>
<body>

<div class="header-top">
  <button class="btn-x" onclick="location.href='paneladmin-pedidos.html'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <h1>control de tráfico</h1>
  <span id="contador" style="margin-left:auto;font-size:11px;background:#f1f5f9;padding:5px 12px;border-radius:999px;font-weight:700">0 rastreos</span>
</div>

<div class="main-layout">
  <div class="left-panel">
    <div class="left-head">
      <b>Lista de IPs - Confirmación</b>
      <span id="liveCount">En vivo</span>
    </div>
    <div class="lista" id="listaIPs">
      <div style="padding:30px;text-align:center;color:#94a3b8;font-size:13px">Cargando rastreos...</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="mapa-wrap" id="mapaWrap">
      <div class="empty-mapa">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <b style="font-size:14px">Selecciona una IP de la lista</b>
        <span style="font-size:12px">Aquí verás el mapa en tiempo real</span>
      </div>
    </div>
    <div class="datos-wrap" id="datosWrap">
      <div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px">
        Selecciona un pedido para ver el rastreo en tiempo real del cliente y del repartidor
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfigConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  databaseURL: "https://doloya-confirmacion-default-rtdb.firebaseio.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};

const app = initializeApp(firebaseConfigConfirmacion);
const dbFS = getFirestore(app);
const dbRT = getDatabase(app);

const listaEl = document.getElementById('listaIPs');
const mapaWrap = document.getElementById('mapaWrap');
const datosWrap = document.getElementById('datosWrap');
const contador = document.getElementById('contador');

let seleccionado = null;
let unsubscribeRT = null;
let lastClientLat = null;
let lastClientLng = null;

// Firestore rastreo en tiempo real
onSnapshot(collection(dbFS, "rastreo"), (snap)=>{
  const docs = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> new Date(b.fechaCreacion||0) - new Date(a.fechaCreacion||0));
  contador.textContent = docs.length + ' rastreos';
  
  if(docs.length===0){
    listaEl.innerHTML = '<div style="padding:30px;text-align:center;color:#94a3b8;font-size:13px">Aún no hay pedidos en rastreo.</div>';
    return;
  }

  // Contar copias por IP
  const ipCounts = {};
  docs.forEach(d=>{
    const ip = d.cliente?.ip || d.ip || '0.0.0.0';
    ipCounts[ip] = (ipCounts[ip] || 0) + 1;
  });

  listaEl.innerHTML = '';
  docs.forEach((item, index)=>{
    const ip = item.cliente?.ip || item.ip || '0.0.0.0';
    const totalCopias = ipCounts[ip];
    const textoCopias = totalCopias > 1 ? `${totalCopias} copias` : `1 copia`;
    const orden = index + 1;

    const div = document.createElement('div');
    div.className = 'item-ip' + (seleccionado===item.numeroPedido ? ' active' : '');
    div.innerHTML = `
      <div class="icon-ip">${orden}</div>
      <div class="info-ip">
        <b style="display:flex;align-items:center">${ip} <span class="copias">${textoCopias}</span></b>
        <span>${item.numeroPedido} • ${item.cliente?.nombre || 'Cliente'} • ${item.restaurante?.nombre || ''}</span>
      </div>
      <div class="badge-live"></div>
    `;
    div.onclick = (e)=> seleccionarPedido(item, e.currentTarget);
    listaEl.appendChild(div);
  });
});

function seleccionarPedido(item, el){
  seleccionado = item.numeroPedido;
  document.querySelectorAll('.item-ip').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');

  const lat = item.cliente?.lat || item.lat;
  const lng = item.cliente?.lng || item.lng;
  lastClientLat = lat; lastClientLng = lng;

  mapaWrap.innerHTML = `<iframe id="mapFrame" src="https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed" loading="lazy"></iframe>`;
  renderDatos(item);

  if(unsubscribeRT) unsubscribeRT();
  const refRT = ref(dbRT, `rastreo/${item.numeroPedido}`);
  unsubscribeRT = onValue(refRT, (snap)=>{
    if(snap.exists()){
      const dataRT = snap.val();
      renderDatos(dataRT);

      // SI EL CLIENTE SE MUEVE, MOVER MAPA EN TIEMPO REAL
      const newLat = dataRT.cliente?.lat || dataRT.lat;
      const newLng = dataRT.cliente?.lng || dataRT.lng;
      if(newLat && newLng && (newLat !== lastClientLat || newLng !== lastClientLng)){
        lastClientLat = newLat; lastClientLng = newLng;
        const frame = document.getElementById('mapFrame');
        if(frame){
          frame.src = `https://maps.google.com/maps?q=${newLat},${newLng}&z=17&output=embed`;
        }
      }
    }
  });
}

function renderDatos(data){
  const cliente = data.cliente || {};
  const tracking = data.trackingRepartidor || {};
  const tieneRepartidor = tracking.lat && tracking.lat!==0;

  datosWrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <b style="font-size:15px;font-weight:900">${data.numeroPedido}</b>
      <span class="tag">${data.estadoPedido || 'nuevo'}</span>
      <span style="margin-left:auto;font-size:11px;color:#64748b">${data.fechaCreacion ? new Date(data.fechaCreacion).toLocaleString() : ''}</span>
    </div>
    <div class="datos-grid">
      <div class="card-dato"><label>IP Cliente</label><b>${cliente.ip || data.ip || '0.0.0.0'}</b></div>
      <div class="card-dato"><label>Número pedido</label><b>${data.numeroPedido}</b></div>
      <div class="card-dato"><label>Cliente</label><b>${cliente.nombre || '-'}</b></div>
      <div class="card-dato"><label>Teléfono</label><b>${cliente.telefono || '-'}</b></div>
      <div class="card-dato full"><label>Dirección cliente</label><b>${cliente.direccion || '-'}</b></div>
      <div class="card-dato"><label>Lat cliente (vivo)</label><b>${cliente.lat || data.lat || 0}</b></div>
      <div class="card-dato"><label>Lng cliente (vivo)</label><b>${cliente.lng || data.lng || 0}</b></div>
      <div class="card-dato"><label>Restaurante</label><b>${data.restaurante?.nombre || '-'}</b></div>
      <div class="card-dato"><label>Total</label><b>$${data.total || 0} MXN</b></div>
      <div class="card-dato full" style="background:#0a1020;color:white;border-color:#0a1020">
        <label style="color:rgba(255,255,255,.6)">Repartidor en tiempo real</label>
        <b style="color:white">${tieneRepartidor ? `📍 ${tracking.lat}, ${tracking.lng} - ${tracking.repartidorNombre || 'Repartidor'} - ${tracking.estado}` : 'Esperando repartidor...'}</b>
        <div style="font-size:10px;color:rgba(255,255,255,.6);margin-top:4px">Última actualización: ${tracking.ultimaActualizacion ? new Date(tracking.ultimaActualizacion).toLocaleTimeString() : cliente.ultimaActualizacion ? new Date(cliente.ultimaActualizacion).toLocaleTimeString() : '-'}</div>
      </div>
    </div>
    <button class="btn-ruta" onclick="window.open('${cliente.googleMapsUrl || `https://www.google.com/maps?q=${cliente.lat},${cliente.lng}` }','_blank')">
      Ver ruta cliente en Maps
    </button>
    ${tieneRepartidor ? `<button class="btn-ruta" style="background:white;color:#0a1020;border:1.5px solid #e2e8f0;margin-top:8px" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${cliente.lat},${cliente.lng}&origin=${tracking.lat},${tracking.lng}','_blank')">Ver ruta repartidor → cliente</button>` : ''}
  `;
}
</script>
</body>
</html>
