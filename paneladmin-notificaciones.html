<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh}
:root{--rojo:#B70A1A}
.main{flex:1;background:#FBFBFD;min-height:100vh}
.header{height:72px;background:white;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:14px}
.btn-x{width:38px;height:38px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer;text-decoration:none;font-size:20px;font-weight:800;flex-shrink:0}
.header h1{font-size:22px;font-weight:800;color:#111}
.header p{font-size:12.5px;color:#6b7280;margin-top:2px}
.h-right{display:flex;align-items:center;gap:12px}
.admin-chip{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:999px;padding:5px 12px 5px 5px}
.admin-avatar{width:32px;height:32px;background:var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.btn-cerrar{background:var(--rojo);color:white;border:none;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer}
.content{padding:20px 24px 40px;max-width:900px;margin:0 auto}
/* ESPACIO ARRIBA PARA TU IMAGEN - IGUAL QUE LOS DEMAS */
.banner-img{width:100%;height:180px;background:#FEF2F2;border:1px dashed #FECACA;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:18px;position:relative}
.banner-img img{width:100%;height:100%;object-fit:cover;display:none}
.banner-img img[src]{display:block}
.banner-img span{font-size:13px;font-weight:700;color:#B70A1A;text-align:center;padding:12px}
.total-box{background:white;border:1px solid #eee;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.total-titulo{font-size:15px;font-weight:800;text-align:center;margin-bottom:14px}
.total-fila{display:flex;align-items:center;justify-content:space-between;gap:16px}
.total-item{display:flex;flex-direction:column;gap:4px}
.total-item span{font-size:12px;color:#6b7280;font-weight:600}
.total-item b{font-size:22px;font-weight:900;color:#111}
.total-num{background:#B70A1A;color:white;min-width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;padding:0 10px}
.enviar-box{background:white;border:1px solid #eee;border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.enviar-box label{font-size:12px;font-weight:800;color:#111;display:block;margin-bottom:8px}
.enviar-box textarea{width:100%;border:1.2px solid #e5eaf0;border-radius:10px;padding:10px;font-size:13px;outline:none;min-height:70px;resize:vertical;font-family:'Inter',sans-serif}
.btn-enviar{width:100%;margin-top:10px;background:#B70A1A;color:white;border:none;border-radius:999px;padding:12px;font-size:13px;font-weight:800;cursor:pointer}
.lista{display:flex;flex-direction:column;gap:12px}
.card-cliente{background:white;border:1px solid #eee;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.avatar-cliente{width:52px;height:52px;background:#B70A1A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:900;flex-shrink:0}
.info-cliente{flex:1;min-width:0}
.info-cliente b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-cliente span{font-size:12px;color:#6b7280;display:block}
.count-visitas{background:#FEF2F2;border:1px solid #FECACA;color:#B70A1A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap;text-align:center}
.empty{text-align:center;padding:60px 20px;color:#9ca3af}
@media(max-width:900px){ .header{padding:0 14px;height:auto;min-height:64px;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px} .header h1{font-size:18px} .card-cliente{flex-wrap:wrap} }
</style>
</head>
<body>
<div class="main">
  <div class="header">
    <div class="header-left">
      <a href="paneladmin.html" class="btn-x">✕</a>
      <div><h1>Notificaciones</h1><p>Clientes registrados para enviarles publicidad.</p></div>
    </div>
    <div class="h-right">
      <div class="admin-chip"><div class="admin-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><div style="line-height:1.1"><b style="font-size:12px;display:block">Administrador</b><small style="font-size:10px;color:#6b7280">DoloYa</small></div></div>
      <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
  <div class="content">
    <!-- AQUI PONES TU IMAGEN - SOLO CAMBIA EL src POR TU IMAGEN, EJEMPLO: BANNER-NOTIFICACIONES.PNG -->
    <div class="banner-img">
      <img id="bannerImg" src="" alt="Banner Notificaciones" onerror="this.style.display='none'">
      <span>ESPACIO PARA TU IMAGEN<br>Sube tu imagen y ponla aquí</span>
    </div>
    <div class="total-box">
      <div class="total-titulo">Total clientes para notificaciones</div>
      <div class="total-fila">
        <div class="total-item"><span>Clientes registrados</span><b id="totalClientes">0</b></div>
        <div class="total-item" style="text-align:right"><span>Ingresos en total</span><b id="totalIngresos">0</b></div>
        <span class="total-num" id="totalCirculo">0</span>
      </div>
    </div>
    <div class="enviar-box">
      <label>Mensaje / Publicidad para enviar a todos</label>
      <textarea id="mensajeNotif" placeholder="Ejemplo: Hoy 2x1 en burgers 🍔 Solo hoy en DoloYa..."></textarea>
      <button class="btn-enviar" id="btnEnviarTodos">Enviar a todos (<span id="countEnviar">0</span>)</button>
    </div>
    <div class="lista" id="listaClientes"><div class="empty">Cargando clientes...</div></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const app = initializeApp(configConfirmacion);
const db = getFirestore(app);
let clientes = [];
function fechaTexto(ts){
  if(!ts) return 'Sin fecha';
  let f = null;
  if(ts?.seconds) f = new Date(ts.seconds*1000);
  else if(ts?.toDate) f = ts.toDate();
  else if(typeof ts === 'string') f = new Date(ts);
  if(!f || isNaN(f)) return 'Sin fecha';
  return f.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + f.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});
}
function render(){
  document.getElementById('totalClientes').textContent = clientes.length;
  document.getElementById('totalCirculo').textContent = clientes.length;
  document.getElementById('countEnviar').textContent = clientes.length;
  const totalIng = clientes.reduce((a,c)=> a + (c.visitas||c.ingresos||1), 0);
  document.getElementById('totalIngresos').textContent = totalIng;
  const lista = document.getElementById('listaClientes');
  if(clientes.length===0){ lista.innerHTML = '<div class="empty">Aún no hay clientes registrados. Cuando den Permitir ubicación en el inicio, aquí van a aparecer.</div>'; return; }
  const orden = [...clientes].sort((a,b)=> (b.visitas||0)-(a.visitas||0));
  lista.innerHTML = orden.map(c=>{
    const inicial = (c.nombre||c.cliente||'C').charAt(0).toUpperCase();
    return `<div class="card-cliente"><div class="avatar-cliente">${inicial}</div><div class="info-cliente"><b>${c.nombre||c.cliente||'Cliente sin nombre'}</b><span>${c.telefono||c.celular||'Sin teléfono'}</span><span>Último ingreso: ${fechaTexto(c.ultimoIngreso||c.ultimaEntrada||c.fechaRegistro)}</span><span>${c.colonia||c.direccion||''}</span></div><div class="count-visitas">${c.visitas||c.ingresos||1} ingresos</div></div>`;
  }).join('');
}
onSnapshot(collection(db,"notificaciones_clientes"), (snap)=>{
  clientes = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  render();
});
document.getElementById('btnEnviarTodos').addEventListener('click', async ()=>{
  const msg = document.getElementById('mensajeNotif').value.trim();
  if(!msg){ alert('Escribe primero tu mensaje / publicidad'); return; }
  if(clientes.length===0){ alert('Aún no hay clientes registrados'); return; }
  if(!confirm('¿Enviar a ' + clientes.length + ' clientes?\n\n' + msg)) return;
  // Se guarda el mensaje para que el siguiente paso lo envie por FCM / push
  try{
    await setDoc(doc(db, "notificaciones_envios", "ultimo"), { mensaje: msg, totalClientes: clientes.length, fecha: serverTimestamp() });
    alert('Listo, mensaje guardado para ' + clientes.length + ' clientes. En el siguiente paso lo conectamos para que les llegue al celular como Rappi.');
    document.getElementById('mensajeNotif').value = '';
  }catch(e){ alert('Error: ' + e.message); }
});
window.cerrarSesion = function(){ localStorage.removeItem('doloya_aliado_sesion'); window.location.href = 'index.html'; };
</script>
</body>
</html>
