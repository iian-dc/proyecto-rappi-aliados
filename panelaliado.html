<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
window.toggleMenu = toggleMenu;

window.cerrarSesion = function(){
  localStorage.removeItem('doloya_aliado_sesion');
  window.location.href='index.html';
}

// PROTEGER Y MOSTRAR NOMBRE REAL DE FIREBASE
const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
if(!sesion){
  window.location.href='index.html';
}else{
  const sub = document.getElementById('subTexto');
  const info = document.getElementById('infoNegocio');

  if(sesion.rol==='administrador'){
    if(sub) sub.textContent='Administrador - Viendo todos los negocios';
    if(info) info.textContent='Sesión: Administrador (admin / 0831)';
  }else{
    const idNegocio = sesion.id || sesion.negocio;
    // Cargar nombre real desde Firebase
    get(ref(db, 'doloya_aliados/'+idNegocio)).then(snap=>{
      let nombreReal = sesion.nombre || idNegocio;
      if(snap.exists()){
        const data = snap.val();
        nombreReal = data.nombre || data.nombreRestaurante || nombreReal;
        // Actualizar sesion con nombre real
        sesion.nombreReal = nombreReal;
        localStorage.setItem('doloya_aliado_sesion', JSON.stringify(sesion));
      }
      if(sub) sub.textContent = 'Negocio: ' + nombreReal;
      if(info) info.textContent = 'Conectado como: aliado / '+(sesion.contraseña||'')+' - '+nombreReal+' | Rol: '+sesion.rol;
    }).catch(()=>{
      if(sub) sub.textContent='Negocio: '+(sesion.nombre||idNegocio);
    });
  }
}
</script>
