<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Resumen Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8fafc;color:#0f172a}
.header{position:sticky;top:0;z-index:30;background:white;border-bottom:1px solid #e2e8f0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:12px}
.btn-back{width:42px;height:42px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.btn-block{padding:10px 18px;border-radius:999px;border:none;font-weight:800;font-size:12px;cursor:pointer}
.bloquear{background:#E30613;color:white}
.desbloquear{background:#16a34a;color:white}
.wrap{max-width:920px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:white;border-radius:18px;border:1px solid #e2e8f0;overflow:hidden}
.card-head{padding:14px 16px;background:#fcfcfc;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
.card-head h2{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.badge{padding:5px 12px;border-radius:999px;font-size:10px;font-weight:900}
.badge-bloq{background:#fee2e2;color:#991b1b}
.badge-ok{background:#dcfce7;color:#166534}
.card-body{padding:10px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border:none}
.row .t{font-size:12px;color:#64748b;font-weight:600}
.row .v{font-size:13px;color:#0f172a;font-weight:700;text-align:right;max-width:62%;word-break:break-word}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:#0f172a;color:white;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:18px;display:block}
.stat label{font-size:9px;opacity:.7;text-transform:uppercase}
.pedido{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:14px;background:white}
.pedido-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.estado{padding:5px 10px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}
.estado-cancelado{background:#fee2e2;color:#991b1b}
.estado-entregado{background:#dcfce7;color:#166534}
.prod-list{margin-top:10px}
.prod{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:12px}
.btn-maps{background:#0f172a;color:white;padding:8px 14px;border-radius:999px;font-size:11px;text-decoration:none;display:inline-flex;margin-top:10px}
.empty{padding:20px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<div class="header">
<div class="left">
<button class="btn-back" onclick="location.href='paneladmin-clientes.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div><h1 id="titulo" style="font-size:14px;font-weight:900">Resumen cliente</h1><p id="sub" style="font-size:11px;color:#64748b">Cargando...</p></div>
</div>
<button id="btnBloq" class="btn-block bloquear" style="display:none"><span id="txtBloq">Bloquear</span></button>
</div>

<div class="wrap">

<div class="card">
<div class="card-head"><h2>Datos del cliente</h2><span id="badge" class="badge badge-ok">ACTIVO</span></div>
<div class="card-body">
<div class="stats">
<div class="stat"><b id="stTotal">0</b><label>Total pedidos</label></div>
<div class="stat"><b id="stEnt">0</b><label>Entregados</label></div>
<div class="stat"><b id="stCan">0</b><label>Cancelados</label></div>
</div>
<div id="datosCliente"></div>
<a id="cMaps" target="_blank" class="btn-maps" style="display:none">Ver ubicación del cliente en mapa</a>
</div>
</div>

<div class="card">
<div class="card-head"><h2>Pedidos del cliente</h2><span id="countP" class="badge" style="background:#f1f5f9">0</span></div>
<div class="card-body" id="listaP">Cargando pedidos...</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(configHistorial);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const valorBusqueda = params.get('tel') || params.get('cel') || params.get('celular') || params.get('id') || params.get('clienteId') || params.get('ip') || "";
let ipReal = params.get('ip') || "";
let clienteIdReal = params.get('id') || params.get('clienteId') || "";
let bloqueado=false;

const $=id=>document.getElementById(id);
$("sub").textContent = "Buscando: " + valorBusqueda;

function addRow(contenedor, titulo, valor){
  if(valor===undefined || valor===null || valor==="" || valor==="undefined") return;
  contenedor.innerHTML+=`<div class="row"><span class="t">${titulo}</span><span class="v">${valor}</span></div>`;
}

async function cargarTodo(){
  if(!valorBusqueda){ $("listaP").innerHTML="Falta ?tel= o ?id= o ?ip="; return; }
  let todos=[];
  try{
    const snapE = await getDocs(collection(db, "pedidos_entregados"));
    snapE.forEach(d=>{ if(JSON.stringify(d.data()).toLowerCase().includes(valorBusqueda.toLowerCase())) todos.push({idDoc:d.id, coleccion:"pedidos_entregados", ...d.data()}); });
  }catch{}
  try{
    const snapC = await getDocs(collection(db, "pedidos_cancelados"));
    snapC.forEach(d=>{ if(JSON.stringify(d.data()).toLowerCase().includes(valorBusqueda.toLowerCase())) todos.push({idDoc:d.id, coleccion:"pedidos_cancelados", ...d.data()}); });
  }catch{}

  $("countP").textContent = todos.length;
  $("stTotal").textContent = todos.length;
  $("stEnt").textContent = todos.filter(p=>p.coleccion==="pedidos_entregados").length;
  $("stCan").textContent = todos.filter(p=>p.coleccion==="pedidos_cancelados").length;

  if(todos.length===0){ $("listaP").innerHTML=`<div class="empty">No se encontró nada con "${valorBusqueda}"</div>`; return; }

  const primero = todos[0];
  const cli = primero.cliente || {};
  const gps = primero.gps || primero.gpsActualCliente || {};
  const ipInfo = primero.ipInfo || {};
  const rest = primero.restaurante || {};

  ipReal = primero.ip || ipReal;
  clienteIdReal = cli.clienteId || clienteIdReal;

  $("titulo").textContent = cli.clienteId || clienteIdReal || valorBusqueda;
  $("sub").textContent = `${todos.length} pedidos encontrados`;

  // DATOS CLIENTE TITULO Y RESPUESTA LIMPIO
  const cont = $("datosCliente");
  cont.innerHTML="";
  addRow(cont,"ID Cliente", cli.clienteId || clienteIdReal);
  addRow(cont,"Nombre cliente", primero.nombre);
  addRow(cont,"Celular", cli.celular);
  addRow(cont,"Teléfono", primero.telefono);
  addRow(cont,"Dirección completa", cli.direccion);
  addRow(cont,"Referencia", primero.referencia);
  addRow(cont,"Piso", primero.piso);
  addRow(cont,"Nombre edificio", primero.nombreEdificio);
  addRow(cont,"Tipo de dirección", primero.tipoDireccion);
  addRow(cont,"IP", primero.ip);
  addRow(cont,"Ciudad", ipInfo.ciudad);
  addRow(cont,"Región", ipInfo.region);
  addRow(cont,"Código postal", ipInfo.postal);
  addRow(cont,"País", ipInfo.pais);
  addRow(cont,"Organización", ipInfo.org);
  addRow(cont,"Latitud", gps.lat || primero.lat);
  addRow(cont,"Longitud", gps.lng || primero.lng);
  addRow(cont,"Precisión GPS", gps.accuracy);
  addRow(cont,"Fecha GPS", gps.timestamp);
  addRow(cont,"Dispositivo plataforma", primero.dispositivo?.plataforma || primero.plataforma);
  addRow(cont,"Conexión", primero.dispositivo?.conexion);
  addRow(cont,"Es móvil", primero.dispositivo?.esMovil ? "Sí" : "No");
  addRow(cont,"Idioma", primero.dispositivo?.idioma);
  addRow(cont,"Pantalla", primero.dispositivo?.pantalla);
  addRow(cont,"Código pedido", primero.codigo);

  if(gps.lat){ const m=$("cMaps"); m.href=`https://www.google.com/maps?q=${gps.lat},${gps.lng}`; m.style.display='inline-flex'; }

  await checkBloq();

  // PEDIDOS
  const lista = $("listaP");
  lista.innerHTML="";
  todos.sort((a,b)=> new Date(b.timestamp||b.fecha||0)-new Date(a.timestamp||a.fecha||0));
  todos.forEach((p,i)=>{
    const c2 = p.cliente||{};
    const g2 = p.gps || p.gpsActualCliente || {};
    const r2 = p.restaurante||{};
    const t2 = p.totales||{};
    const prod = p.productos||[];
    const esCancelado = p.coleccion==="pedidos_cancelados";

    let html = `<div class="pedido">
    <div class="pedido-top"><b style="font-size:13px">Pedido ${i+1} - ${esCancelado?"Cancelado":"Entregado"} - ${p.codigo||p.idDoc.slice(-6)}</b><span class="estado ${esCancelado?'estado-cancelado':'estado-entregado'}">${esCancelado?'Cancelado':'Entregado'}</span></div>`;

    // Detalle limpio titulo respuesta
    html+=`<div class="row"><span class="t">ID Documento</span><span class="v">${p.idDoc}</span></div>`;
    html+=`<div class="row"><span class="t">Fecha pedido</span><span class="v">${p.timestamp||p.fecha||p.fechaCancelacion||''}</span></div>`;
    html+=`<div class="row"><span class="t">Estado</span><span class="v">${p.estado||''}</span></div>`;
    if(esCancelado){
      html+=`<div class="row"><span class="t">Cancelado por</span><span class="v">${p.canceladoPor||''} ${p.canceladoPorNombre||''}</span></div>`;
      html+=`<div class="row"><span class="t">Motivo cancelación</span><span class="v">${p.motivoCancelacion||p.detalleCancelacion||''}</span></div>`;
      html+=`<div class="row"><span class="t">Fecha cancelación</span><span class="v">${p.fechaCancelacion||p.canceladoEn||''}</span></div>`;
    }
    html+=`<div class="row"><span class="t">Nombre cliente</span><span class="v">${p.nombre||''}</span></div>`;
    html+=`<div class="row"><span class="t">Celular</span><span class="v">${c2.celular||''}</span></div>`;
    html+=`<div class="row"><span class="t">Dirección</span><span class="v">${c2.direccion||''}</span></div>`;
    html+=`<div class="row"><span class="t">Restaurante</span><span class="v">${r2.nombre||''}</span></div>`;
    html+=`<div class="row"><span class="t">Categoría restaurante</span><span class="v">${r2.cat||''}</span></div>`;
    html+=`<div class="row"><span class="t">ID Restaurante</span><span class="v">${r2.id||''}</span></div>`;
    html+=`<div class="row"><span class="t">Lat Restaurante</span><span class="v">${r2.lat||''}</span></div>`;
    html+=`<div class="row"><span class="t">Lng Restaurante</span><span class="v">${r2.lng||''}</span></div>`;
    html+=`<div class="row"><span class="t">Método de pago</span><span class="v">${p.metodoPago?.tipo||''}</span></div>`;
    html+=`<div class="row"><span class="t">Instrucciones</span><span class="v">${p.instrucciones||''}</span></div>`;
    html+=`<div class="row"><span class="t">Total producto</span><span class="v">$${t2.costoProductos||''}</span></div>`;
    html+=`<div class="row"><span class="t">Costo envío</span><span class="v">$${t2.costoEnvio||''}</span></div>`;
    html+=`<div class="row"><span class="t">Tarifa</span><span class="v">$${t2.tarifa||t2.costoEnvio||''}</span></div>`;
    html+=`<div class="row"><span class="t">Propina</span><span class="v">$${t2.propina||0}</span></div>`;
    html+=`<div class="row"><span class="t">Costo total</span><span class="v">$${t2.costoTotal||''}</span></div>`;
    if(esCancelado){
      html+=`<div class="row"><span class="t">Valor pedido cancelado</span><span class="v">$${t2.costoProductos||t2.costoTotal||prod.reduce((s,it)=>s+Number(it.precio||0)*Number(it.cantidad||1),0)}</span></div>`;
    }
    html+=`<div class="row"><span class="t">IP cliente</span><span class="v">${p.ip||''}</span></div>`;
    html+=`<div class="row"><span class="t">Ciudad IP</span><span class="v">${p.ipInfo?.ciudad||''}</span></div>`;
    html+=`<div class="row"><span class="t">GPS Cliente Lat</span><span class="v">${g2.lat||''}</span></div>`;
    html+=`<div class="row"><span class="t">GPS Cliente Lng</span><span class="v">${g2.lng||''}</span></div>`;

    if(prod.length){
      html+=`<div style="margin-top:12px;font-size:11px;font-weight:900">PRODUCTOS</div>`;
      prod.forEach(pr=>{
        html+=`<div class="prod"><span>${pr.nombre} x${pr.cantidad}</span><span>$${pr.precio}</span></div>`;
      });
    }

    if(g2.lat) html+=`<a href="https://www.google.com/maps?q=${g2.lat},${g2.lng}" target="_blank" class="btn-maps">Ver ubicación de este pedido</a>`;

    html+=`</div>`;
    lista.innerHTML+=html;
  });
}

async function checkBloq(){
  if(!ipReal) return;
  try{
    const s1 = await getDoc(doc(db, "ips_bloqueadas", ipReal));
    const s2 = await getDoc(doc(db, "bloqueos_ip", ipReal));
    if((s1.exists() && s1.data().bloqueado) || (s2.exists() && s2.data().bloqueado)) bloqueado=true;
  }catch{}
  const badge=$("badge"); const btn=$("btnBloq"); const txt=$("txtBloq");
  btn.style.display='block';
  if(bloqueado){ badge.textContent="BLOQUEADO"; badge.className="badge badge-bloq"; btn.className="btn-block desbloquear"; txt.textContent="Desbloquear"; }
  else { badge.textContent="ACTIVO"; badge.className="badge badge-ok"; btn.className="btn-block bloquear"; txt.textContent="Bloquear"; }
}

$("btnBloq").addEventListener('click', async ()=>{
  if(!ipReal){ ipReal=$("cIp")?.textContent || prompt("IP a bloquear:"); if(!ipReal) return; }
  const nuevo=!bloqueado;
  if(!confirm((nuevo?"Bloquear":"Desbloquear")+" IP "+ipReal+"?")) return;
  try{
    const data={ip:ipReal,bloqueado:nuevo,clienteId:clienteIdReal,fecha:new Date().toISOString()};
    await setDoc(doc(db, "ips_bloqueadas", ipReal), data, {merge:true});
    await setDoc(doc(db, "bloqueos_ip", ipReal), data, {merge:true});
    bloqueado=nuevo; checkBloq(); alert(nuevo?"Bloqueada":"Desbloqueada");
  }catch(e){ alert(e.message); }
});

cargarTodo();
</script>
</body>
</html>
