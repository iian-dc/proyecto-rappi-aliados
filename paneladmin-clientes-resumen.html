<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Resumen Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8fafc;color:#0f172a}
.header{position:sticky;top:0;z-index:30;background:white;border-bottom:1px solid #e2e8f0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:12px}
.btn-back{width:42px;height:42px;background:#E30613;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.btn-block{padding:10px 18px;border-radius:999px;border:none;font-weight:800;font-size:12px;cursor:pointer}
.bloquear{background:#E30613;color:white}
.desbloquear{background:#16a34a;color:white}
.wrap{max-width:920px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:white;border-radius:18px;border:1px solid #e2e8f0;overflow:hidden}
.card-head{padding:14px 16px;background:#fcfcfc;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between}
.card-head h2{font-size:11px;font-weight:900;text-transform:uppercase}
.badge{padding:5px 12px;border-radius:999px;font-size:10px;font-weight:900}
.badge-bloq{background:#fee2e2;color:#991b1b}
.badge-ok{background:#dcfce7;color:#166534}
.card-body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.item{background:#f8fafc;border:1px solid #f1f5f9;border-radius:12px;padding:10px 12px}
.item label{font-size:9px;color:#64748b;font-weight:800;text-transform:uppercase;display:block;margin-bottom:3px}
.item span{font-size:13px;font-weight:600;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#0f172a;color:white;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:16px;display:block}
.stat label{font-size:8px;opacity:.7;text-transform:uppercase}
.pedido{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:14px}
.prod-list{margin-top:10px;background:#f8fafc;border-radius:12px;padding:10px;border:1px solid #f1f5f9}
.prod{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:12px}
pre.json{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px;font-size:10px;overflow:auto;max-height:300px;white-space:pre-wrap;margin-top:8px}
.btn-maps{background:#0f172a;color:white;padding:8px 12px;border-radius:999px;font-size:11px;text-decoration:none;display:inline-flex;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<div class="left">
<button class="btn-back" onclick="location.href='paneladmin-clientes.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div><h1 id="titulo" style="font-size:14px;font-weight:900">Resumen cliente</h1><p id="sub" style="font-size:11px;color:#64748b">Cargando...</p></div>
</div>
<button id="btnBloq" class="btn-block bloquear" style="display:none"><span id="txtBloq">Bloquear</span></button>
</div>

<div class="wrap">
<div class="card"><div class="card-head"><h2>Datos cliente - de pedidos</h2><span id="badge" class="badge badge-ok">ACTIVO</span></div>
<div class="card-body">
<div class="stats"><div class="stat"><b id="stTotal">0</b><label>Pedidos</label></div><div class="stat"><b id="stEnt">0</b><label>Entregados</label></div><div class="stat"><b id="stCan">0</b><label>Cancelados</label></div><div class="stat"><b id="stGast">$0</b><label>Gastado</label></div></div>
<div class="grid2">
<div class="item"><label>ClienteID</label><span id="cId">-</span></div>
<div class="item"><label>IP</label><span id="cIp">-</span></div>
<div class="item"><label>Celular</label><span id="cCel">-</span></div>
<div class="item"><label>Nombre</label><span id="cNom">-</span></div>
<div class="item" style="grid-column:1/-1"><label>Dirección completa</label><span id="cDir">-</span></div>
<div class="item"><label>Ciudad / Región / Postal</label><span id="cCiudad">-</span></div>
<div class="item"><label>País / Org</label><span id="cPais">-</span></div>
<div class="item"><label>GPS Lat Lng Accuracy</label><span id="cGps">-</span><br><a id="cMaps" target="_blank" class="btn-maps" style="display:none">Ver Maps</a></div>
<div class="item"><label>Dispositivo / Plataforma</label><span id="cDisp">-</span></div>
</div>
</div></div>

<div class="card"><div class="card-head"><h2>Pedidos encontrados</h2><span id="countP" class="badge" style="background:#f1f5f9">0</span></div>
<div class="card-body" id="listaP">Iniciando...</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const app = initializeApp(configHistorial);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
// ACEPTA CUALQUIER NOMBRE DE PARAMETRO
const valorBusqueda = params.get('tel') || params.get('cel') || params.get('celular') || params.get('telefono') || params.get('id') || params.get('clienteId') || params.get('clienteid') || params.get('ip') || params.get('cliente') || "";
const ipParam = params.get('ip');
const idParam = params.get('id') || params.get('clienteId');

let ipReal = ipParam || "";
let clienteIdReal = idParam || "";
let bloqueado=false;

const $=id=>document.getElementById(id);

$("sub").textContent = "Buscando: " + valorBusqueda;

async function cargarTodo(){
  if(!valorBusqueda){
    $("listaP").innerHTML = "Falta ?tel= o ?id= o ?ip= - Ejemplo: paneladmin-clientes-resumen.html?tel=546378290";
    return;
  }

  $("listaP").innerHTML = "Descargando colecciones...";
  let todos=[];

  // DESCARGA SIN WHERE - FILTRO LOCAL PARA QUE NO FALLE
  try{
    const snapE = await getDocs(collection(db, "pedidos_entregados"));
    snapE.forEach(d=>{
      const data = d.data();
      const txt = JSON.stringify(data).toLowerCase();
      if(txt.includes(valorBusqueda.toLowerCase())){
        todos.push({idDoc:d.id, coleccion:"pedidos_entregados", ...data});
      }
    });
  }catch(e){ $("listaP").innerHTML += "<br>Error entregados: "+e.message; }

  try{
    const snapC = await getDocs(collection(db, "pedidos_cancelados"));
    snapC.forEach(d=>{
      const data = d.data();
      const txt = JSON.stringify(data).toLowerCase();
      if(txt.includes(valorBusqueda.toLowerCase())){
        todos.push({idDoc:d.id, coleccion:"pedidos_cancelados", ...data});
      }
    });
  }catch(e){ $("listaP").innerHTML += "<br>Error cancelados: "+e.message; }

  $("countP").textContent = todos.length+" encontrados";
  $("stTotal").textContent = todos.length;
  $("stEnt").textContent = todos.filter(p=>p.coleccion==="pedidos_entregados").length;
  $("stCan").textContent = todos.filter(p=>p.coleccion==="pedidos_cancelados").length;

  let total=0;
  todos.forEach(p=> total+= Number(p.totales?.costoProductos||0)+Number(p.totales?.costoEnvio||0));
  $("stGast").textContent = "$"+total.toFixed(2);

  if(todos.length===0){
    $("listaP").innerHTML = `No se encontró nada con "${valorBusqueda}" en pedidos_entregados ni pedidos_cancelados. Revisa que en tu base el celular 546378290 sí exista.`;
    return;
  }

  // TOMAR DATOS DEL PRIMER PEDIDO (ESTRUCTURA REAL DE TUS FOTOS)
  const primero = todos[0];
  const c = primero.cliente || {};
  ipReal = primero.ip || primero.gps?.ip || primero.idOriginal || ipParam || "";
  clienteIdReal = c.clienteId || primero.clienteId || idParam || "";

  $("titulo").textContent = c.clienteId || clienteIdReal || valorBusqueda;
  $("sub").textContent = `Encontrado: ${todos.length} pedidos - IP ${ipReal} Cel ${c.celular||''}`;
  $("cId").textContent = c.clienteId || "-";
  $("cIp").textContent = primero.ip || "-";
  $("cCel").textContent = c.celular || primero.celular || valorBusqueda;
  $("cNom").textContent = primero.nombre || "-";
  $("cDir").textContent = c.direccion || primero.direccion || "-";
  $("cCiudad").textContent = `${primero.ipInfo?.ciudad||''} ${primero.ipInfo?.region||''} ${primero.ipInfo?.postal||''}`;
  $("cPais").textContent = `${primero.ipInfo?.pais||''} ${primero.ipInfo?.org||''}`;
  const gps = primero.gps || primero.gpsActualCliente || {};
  $("cGps").textContent = `${gps.lat||primero.lat||''}, ${gps.lng||primero.lng||''} acc:${gps.accuracy||''}`;
  $("cDisp").textContent = `${primero.dispositivo?.plataforma||primero.plataforma||''} ${primero.dispositivo?.conexion||''}`;
  if(gps.lat){ const m=$("cMaps"); m.href=`https://www.google.com/maps?q=${gps.lat},${gps.lng}`; m.style.display='inline-flex'; }

  // BLOQUEO
  await checkBloq();

  // LISTAR PEDIDOS
  const lista = $("listaP");
  lista.innerHTML="";
  todos.forEach((p,i)=>{
    const cli = p.cliente||{};
    const gps2 = p.gps || p.gpsActualCliente || {};
    const prod = p.productos||[];
    const rest = p.restaurante||{};
    const tot = p.totales||{};
    lista.innerHTML+=`
    <div class="pedido">
      <div style="display:flex;justify-content:space-between"><b>PEDIDO ${i+1} - ${p.coleccion.toUpperCase()} - ${p.idDoc}</b><span style="font-size:10px;background:${p.coleccion==='pedidos_cancelados'?'#fee2e2':'#dcfce7'};padding:4px 8px;border-radius:999px">${p.codigo||''} ${p.estado||''}</span></div>
      <div class="grid2" style="margin-top:10px">
        <div class="item"><label>Dirección</label><span>${cli.direccion||''}</span></div>
        <div class="item"><label>Celular / Nombre</label><span>${cli.celular||''} - ${p.nombre||''}</span></div>
        <div class="item"><label>Restaurante / Cat</label><span>${rest.nombre||''} / ${rest.cat||''}</span></div>
        <div class="item"><label>Total Prod / Envio / Total</label><span>$${tot.costoProductos||''} / $${tot.costoEnvio||''} / $${tot.costoTotal||''}</span></div>
        <div class="item"><label>GPS Cliente</label><span>${gps2.lat||''}, ${gps2.lng||''} acc ${gps2.accuracy||''}</span></div>
        <div class="item"><label>Metodo Pago / Motivo Cancel</label><span>${p.metodoPago?.tipo||''} / ${p.motivoCancelacion||''}</span></div>
        <div class="item"><label>IP / Ciudad / Org</label><span>${p.ip||''} ${p.ipInfo?.ciudad||''} ${p.ipInfo?.org||''}</span></div>
        <div class="item"><label>Cancelado Por / Fecha</label><span>${p.canceladoPor||''} ${p.canceladoEn||p.timestamp||''}</span></div>
      </div>
      ${prod.length?`<div class="prod-list">${prod.map(pr=>`<div class="prod"><span>${pr.nombre} x${pr.cantidad}</span><span>$${pr.precio}</span></div>`).join('')}</div>`:''}
      <pre class="json">${JSON.stringify(p,null,2)}</pre>
    </div>`;
  });
}

async function checkBloq(){
  if(!ipReal) return;
  try{
    const s1 = await getDoc(doc(db, "ips_bloqueadas", ipReal));
    const s2 = await getDoc(doc(db, "bloqueos_ip", ipReal));
    if((s1.exists() && s1.data().bloqueado) || (s2.exists() && s2.data().bloqueado)) bloqueado=true;
  }catch{}
  const badge=$("badge"); const btn=$("btnBloq"); const txt=$("txtBloq");
  btn.style.display='block';
  if(bloqueado){ badge.textContent="BLOQUEADO"; badge.className="badge badge-bloq"; btn.className="btn-block desbloquear"; txt.textContent="Desbloquear"; }
  else { badge.textContent="ACTIVO"; badge.className="badge badge-ok"; btn.className="btn-block bloquear"; txt.textContent="Bloquear"; }
}

$("btnBloq").addEventListener('click', async ()=>{
  if(!ipReal){ alert("No hay IP, bloquea por IP del pedido: "+$("cIp").textContent); ipReal=$("cIp").textContent; if(!ipReal) return; }
  const nuevo = !bloqueado;
  if(!confirm((nuevo?"Bloquear":"Desbloquear")+" IP "+ipReal+"?")) return;
  try{
    const data={ip:ipReal,bloqueado:nuevo,clienteId:clienteIdReal,fecha:new Date().toISOString()};
    await setDoc(doc(db, "ips_bloqueadas", ipReal), data, {merge:true});
    await setDoc(doc(db, "bloqueos_ip", ipReal), data, {merge:true});
    bloqueado=nuevo; checkBloq(); alert(nuevo?"Bloqueada":"Desbloqueada");
  }catch(e){ alert(e.message); }
});

cargarTodo();
</script>
</body>
</html>
