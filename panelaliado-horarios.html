<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f9f9fb;min-height:100vh}
:root{--rojo:#C8102E}
.header{height:56px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:10}
.btn-x{width:34px;height:34px;border-radius:50%;background:var(--rojo);border:none;color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;text-decoration:none;flex-shrink:0}
.header h2{font-size:16px;font-weight:800;color:#111}
.content{max-width:520px;margin:0 auto;padding:18px 14px 90px}
.subtitulo{font-size:13px;color:#6b7280;line-height:1.4;margin-bottom:16px}
.card{background:white;border-radius:16px;padding:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid #f0f0f0}
.dia{padding:14px 0;border-bottom:1px solid #f1f1f1}
.dia:last-child{border-bottom:none}
.dia-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dia-top b{font-size:14px;color:#111}
.dia-top span{font-size:11px;color:#6b7280;font-weight:600}
.horas{display:flex;align-items:center;gap:8px}
.campo{flex:1}
.campo label{font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:4px}
.campo input{width:100%;height:42px;border:1.5px solid #e5e7eb;border-radius:10px;padding:0 10px;font-size:14px;font-weight:600;color:#111;outline:none;background:white}
.campo input:focus{border-color:var(--rojo)}
.guion{font-weight:800;color:#9ca3af;padding-top:18px}
.switch{width:44px;height:26px;background:#e5e7eb;border-radius:999px;position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.switch.on{background:#22c55e}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;background:white;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.3s}
.switch.on::after{transform:translateX(18px)}
.cerrado .horas{opacity:.35;pointer-events:none}
.btn-guardar{position:fixed;left:14px;right:14px;bottom:14px;max-width:492px;margin:0 auto;height:52px;background:var(--rojo);color:white;border:none;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(200,16,46,.35)}
.btn-guardar:active{transform:scale(.98)}
.btn-guardar:disabled{opacity:.6}
.msg{text-align:center;font-size:13px;font-weight:600;color:#15803d;margin-top:12px;min-height:18px}
</style>
</head>
<body>

<div class="header">
  <a href="panelaliado.html" class="btn-x">✕</a>
  <h2>Horarios</h2>
</div>

<div class="content">
  <p class="subtitulo" id="subNegocio">Configura el horario de apertura y cierre de tu negocio para cada día de la semana.</p>
  <div class="card" id="listaHorarios"></div>
  <div class="msg" id="msg"></div>
</div>

<button class="btn-guardar" id="btnGuardar">Guardar horarios</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const configAliados = { apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ", authDomain: "doloya-aliados.firebaseapp.com", databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com", projectId: "doloya-aliados", storageBucket: "doloya-aliados.firebasestorage.app", messagingSenderId: "122314467740", appId: "1:122314467740:web:9947a0a9560557e3a00059" };
const appAliados = initializeApp(configAliados, "aliados");
const dbAliados = getDatabase(appAliados);

function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion')||'null');
if(!sesion){ window.location.href='index.html'; }

const idNegocio = (sesion?.id || sesion?.negocio || 'alitas_factory').toLowerCase();
document.getElementById('subNegocio').textContent = 'Horarios de ' + (sesion?.nombre || idNegocio) + ' - Lunes a Domingo';

const dias = [
  {id:'lunes', nombre:'Lunes'},
  {id:'martes', nombre:'Martes'},
  {id:'miercoles', nombre:'Miércoles'},
  {id:'jueves', nombre:'Jueves'},
  {id:'viernes', nombre:'Viernes'},
  {id:'sabado', nombre:'Sábado'},
  {id:'domingo', nombre:'Domingo'},
];

const lista = document.getElementById('listaHorarios');
const msg = document.getElementById('msg');

dias.forEach(d=>{
  const div = document.createElement('div');
  div.className = 'dia';
  div.id = 'dia-'+d.id;
  div.innerHTML = `
    <div class="dia-top">
      <div><b>${d.nombre}</b> <span id="txt-${d.id}">Abierto</span></div>
      <div class="switch on" id="sw-${d.id}"></div>
    </div>
    <div class="horas">
      <div class="campo"><label>Hora de inicio</label><input type="time" id="inicio-${d.id}" value="09:00"></div>
      <div class="guion">—</div>
      <div class="campo"><label>Hora de fin</label><input type="time" id="fin-${d.id}" value="22:00"></div>
    </div>
  `;
  lista.appendChild(div);
  const sw = div.querySelector('#sw-'+d.id);
  sw.addEventListener('click', ()=>{
    sw.classList.toggle('on');
    const abierto = sw.classList.contains('on');
    div.classList.toggle('cerrado', !abierto);
    div.querySelector('#txt-'+d.id).textContent = abierto ? 'Abierto' : 'Cerrado';
  });
});

let pathBaseNegocio = `doloya_aliados/${idNegocio}`;

// ==== BUSCA LA RUTA REAL DEL RESTAURANTE, IGUAL QUE PANELALIADO.HTML ====
get(ref(dbAliados, 'doloya_aliados')).then(allSnap=>{
  if(allSnap.exists()){
    const todas = allSnap.val();
    const target = normalize(idNegocio);
    let encontrado = false;
    // 1. Ruta nueva: doloya_aliados/valhalla
    for(const k of Object.keys(todas)){
      if(normalize(k) === target){ pathBaseNegocio = `doloya_aliados/${k}`; encontrado = true; break; }
    }
    // 2. Ruta vieja: doloya_aliados/alitas/valhalla
    if(!encontrado){
      for(const cat of Object.keys(todas)){
        const nivel = todas[cat];
        if(typeof nivel !== 'object' || !nivel) continue;
        for(const key of Object.keys(nivel)){
          if(normalize(key) === target){ pathBaseNegocio = `doloya_aliados/${cat}/${key}`; encontrado = true; break; }
        }
        if(encontrado) break;
      }
    }
  }
  // Ya con la ruta correcta, carga los horarios de ESE restaurante
  return get(ref(dbAliados, `${pathBaseNegocio}/horarios`));
}).then(snap=>{
  if(!snap || !snap.exists()) return;
  const data = snap.val();
  dias.forEach(d=>{
    const h = data[d.id];
    if(!h) return;
    if(h.inicio) document.getElementById('inicio-'+d.id).value = h.inicio;
    if(h.fin) document.getElementById('fin-'+d.id).value = h.fin;
    const abierto = h.abierto !== false;
    const sw = document.getElementById('sw-'+d.id);
    const div = document.getElementById('dia-'+d.id);
    if(!abierto){ sw.classList.remove('on'); div.classList.add('cerrado'); div.querySelector('#txt-'+d.id).textContent='Cerrado'; }
  });
});

document.getElementById('btnGuardar').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  const horarios = {};
  dias.forEach(d=>{
    horarios[d.id] = {
      abierto: document.getElementById('sw-'+d.id).classList.contains('on'),
      inicio: document.getElementById('inicio-'+d.id).value,
      fin: document.getElementById('fin-'+d.id).value
    };
  });
  try{
    // GUARDA SOLO EN ESE RESTAURANTE, NO EN GENERAL
    await update(ref(dbAliados, pathBaseNegocio), { horarios });
    msg.textContent = 'Horarios guardados en ' + idNegocio;
    setTimeout(()=>{ window.location.href='panelaliado.html'; }, 800);
  }catch(e){
    msg.textContent = 'Error al guardar, intenta de nuevo';
    msg.style.color = '#C8102E';
    btn.disabled = false; btn.textContent = 'Guardar horarios';
  }
});
</script>
</body>
</html>
