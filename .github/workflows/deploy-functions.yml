name: Deploy Functions DoloYa
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Guardar llave de Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/service-account.json
      - run: firebase deploy --only functions --project doloya-confirmacion --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.home }}/service-account.json
