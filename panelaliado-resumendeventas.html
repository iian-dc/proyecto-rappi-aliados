<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Ventas - Aliado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;color:#0f172a}
.header-top{background:white;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.btn-x{width:34px;height:34px;background:#E30613;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header-top h1{font-size:15px;font-weight:800}
.top-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
@media(max-width:900px){.top-cards{grid-template-columns:repeat(2,1fr)}}
.tcard{background:white;border-radius:12px;border:1px solid #eef2f7;padding:12px}
.tcard label{font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px}
.tcard b{font-size:14px;font-weight:800;display:block}
.tcard span{font-size:10px;color:#64748b}
.tcard.pago-verde{border:2px solid #00ff6a;background:#f0fdf4;box-shadow:0 0 10px rgba(0,255,106,.4)}
.tcard.pago-rojo{border:2px solid #E30613;background:#fef2f2}
.box{background:white;border-radius:12px;border:1px solid #eef2f7;overflow:hidden;margin:0 12px 20px}
.filters{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.filters input{padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0;font-size:11px}
.table-head{background:#0a1020;color:white;display:grid;grid-template-columns:70px 85px 1fr .55fr .6fr .7fr .6fr;padding:8px 10px;font-size:8.5px;font-weight:700;text-transform:uppercase;align-items:center}
.table-row{display:grid;grid-template-columns:70px 85px 1fr .55fr .6fr .7fr .6fr;padding:8px 10px;border-bottom:1px solid #f1f5f9;align-items:center;font-size:10px}
.badge{padding:3px 8px;border-radius:999px;font-size:8.5px;font-weight:700;display:inline-block}
.badge-pagado{background:#dcfce7;color:#166534;border:1px solid #16a34a}
.badge-pend{background:#fef9c3;color:#854d0e;border:1px solid #f59e0b}
.btn{padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;border:none}
.btn-ver{border:1px solid #0f172a;background:white;color:#0f172a}
.btn-fact{border:1px solid #16a34a;background:#dcfce7;color:#166534}
.btn-pago{background:#00ff6a;color:#065f29;box-shadow:0 0 8px rgba(0,255,106,.6)}
.btn-pend{background:#E30613;color:white}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-box{background:white;border-radius:12px;padding:16px;max-width:420px;width:100%}
</style>
</head>
<body>
<div class="header-top">
<button class="btn-x" onclick="location.href='panelaliado.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div style="width:2px;height:16px;background:#E30613"></div>
<h1>Resumen de ventas</h1>
<span id="nombreNegocio" style="margin-left:8px;font-size:11px;color:#0f172a;font-weight:700"></span>
</div>

<div class="top-cards">
<div class="tcard"><label>Total ingresos restaurante (90% - cancelados)</label><b id="kIngresos">$ 0.00</b><span id="kSubIngresos">0 entregados</span></div>
<div class="tcard" style="border-left:4px solid #E30613"><label>Pérdidas por cancelados</label><b id="kPerdidas" style="color:#E30613">- $ 0.00</b><span id="kSubPerd">0 cancelados</span></div>
<div class="tcard"><label>Total pedidos</label><b id="kTotalPed">0</b><span id="kNombreSpan">De este negocio</span></div>
<div class="tcard" id="cardEstadoPago"><label>Resumen de pago</label><b id="kEstadoPago">Cargando...</b><span id="kDetallePago">...</span><div style="margin-top:8px"><button id="btnEstadoPago" class="btn btn-pend">...</button></div></div>
</div>

<div class="box">
<div class="filters">
<input id="buscar" placeholder="Buscar pedido..." onkeyup="filtrar()" style="flex:1">
<input type="date" id="fechaDesde"><input type="date" id="fechaHasta"><button class="btn btn-ver" onclick="filtrar()">Filtrar</button>
</div>
<div class="table-head">
<span>Fecha / Hora</span>
<span>Pedido</span>
<span>Cliente</span>
<span>Venta total</span>
<span>90% / 50%</span>
<span>Estado / Pago</span>
<span>Factura</span>
</div>
<div id="listaPedidos"><div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Cargando tus ventas...</div></div>
</div>

<div class="modal" id="modalFactura">
<div class="modal-box">
<h3 style="font-size:13px;font-weight:800;margin-bottom:8px">Factura de pago</h3>
<div id="contFactura" style="font-size:11px;line-height:1.6"></div>
<button class="btn btn-ver" style="margin-top:12px;width:100%" onclick="document.getElementById('modalFactura').style.display='none'">Cerrar</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const appHis = initializeApp(configHistorial, "hisApp");
const dbHis = getFirestore(appHis);

// ESTE ES EL ID DEL RESTAURANTE LOGUEADO EN panelaliado.html
let restauranteId = localStorage.getItem('restauranteId') || localStorage.getItem('aliadoId') || localStorage.getItem('idRestaurante') || localStorage.getItem('restaurantId') || new URLSearchParams(location.search).get('id') || "";
let restauranteNombre = localStorage.getItem('restauranteNombre') || localStorage.getItem('nombreRestaurante') || localStorage.getItem('nombreNegocio') || restauranteId;

let pedidos = [];
let pagos = [];
let filtrados = [];

function limpiarNombre(s){ return (s||"").replace(/_/g," ").replace(/-/g," ").trim(); }
function fechaCorta(f){ try{ let d=new Date(f); if(isNaN(d.getTime())) d=new Date(Number(f)); if(isNaN(d.getTime())) return "-"; return `<span style="font-size:7px">${d.toLocaleDateString('es-MX')}</span><br><span style="font-size:6.5px;color:#64748b">${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span>`; }catch{ return "-"; } }

function esDeEsteRestaurante(data){
  if(!restauranteId && !restauranteNombre) return false;
  const idBaja = (restauranteId||"").toLowerCase().trim();
  const nombreBaja = (restauranteNombre||"").toLowerCase().trim();
  const r = data.restaurante || {};
  const valores = [
    r.id, r.nombre, 
    data.restauranteId, data.restauranteNombre,
    data.idRestaurante, data.restaurante_id,
    data.restaurante?.id, data.restaurante?.nombre
  ].filter(Boolean).map(v=> v.toString().toLowerCase().trim());
  return valores.some(v=> v===idBaja || v===nombreBaja);
}

async function cargar(){
  if(!restauranteId){
    document.getElementById('listaPedidos').innerHTML='<div style="padding:20px;text-align:center;color:#E30613;font-size:11px">No se detectó tu restaurante.<br>Entra desde panelaliado.html para que se guarde tu sesión.</div>';
    return;
  }
  document.getElementById('nombreNegocio').textContent = "- " + limpiarNombre(restauranteNombre);
  document.getElementById('kNombreSpan').textContent = limpiarNombre(restauranteNombre);

  // Trae SOLO de este restaurante
  const snapE = await getDocs(collection(dbHis, "pedidos_entregados"));
  snapE.forEach(d=>{
    const data=d.data();
    if(!esDeEsteRestaurante(data)) return;
    const venta = Number(data.totales?.costoProductos || data.total || data.monto || 0);
    pedidos.push({ id:d.id, tipo:"entregado", fecha: data.timestamp || data.fecha || data.creado || data.actualizadoEn || Date.now(), venta: venta, gana: venta*0.9, cliente: data.cliente?.nombre || data.clienteNombre || data.nombreCliente || "Cliente" });
  });
  const snapC = await getDocs(collection(dbHis, "pedidos_cancelados"));
  snapC.forEach(d=>{
    const data=d.data();
    if(!esDeEsteRestaurante(data)) return;
    const venta = Number(data.totales?.costoProductos || data.total || data.monto || 0);
    pedidos.push({ id:d.id, tipo:"cancelado", fecha: data.timestamp || data.canceladoEn || data.fecha || data.creado || Date.now(), venta: venta, gana: venta*0.5, cliente: data.cliente?.nombre || data.clienteNombre || "Cliente" });
  });
  const snapP = await getDocs(collection(dbHis, "pagos_aliados"));
  snapP.forEach(d=>{
    const data=d.data();
    const id = (data.restauranteId || data.restauranteNombre || "").toLowerCase().trim();
    if(id !== restauranteId.toLowerCase().trim() && id !== restauranteNombre.toLowerCase().trim()) return;
    pagos.push({ id:d.id, monto:Number(data.montoPagado||data.monto||0), fecha:data.fechaPago||data.fecha||data.timestamp, factura:data.facturaId||d.id });
  });

  pedidos.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  filtrados=[...pedidos];
  render();
}

function render(){
  const total90 = pedidos.filter(p=>p.tipo==="entregado").reduce((s,p)=>s+p.gana,0);
  const totalCancPagar = pedidos.filter(p=>p.tipo==="cancelado").reduce((s,p)=>s+p.gana,0);
  const totalIngresosNeto = total90 - totalCancPagar;
  const totalPerdidas = pedidos.filter(p=>p.tipo==="cancelado").reduce((s,p)=>s+p.venta,0);
  const countEnt = pedidos.filter(p=>p.tipo==="entregado").length;
  const countCanc = pedidos.filter(p=>p.tipo==="cancelado").length;
  const totalPagado = pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const pendiente = Math.max(0, totalIngresosNeto - totalPagado);

  document.getElementById('kIngresos').textContent = "$ "+totalIngresosNeto.toFixed(2);
  document.getElementById('kSubIngresos').textContent = countEnt+" entregados - "+countCanc+" cancelados descontados";
  document.getElementById('kPerdidas').textContent = "- $ "+totalPerdidas.toFixed(2);
  document.getElementById('kSubPerd').textContent = countCanc+" cancelados";
  document.getElementById('kTotalPed').textContent = pedidos.length;

  const card = document.getElementById('cardEstadoPago');
  const btn = document.getElementById('btnEstadoPago');
  const kEst = document.getElementById('kEstadoPago');
  const kDet = document.getElementById('kDetallePago');
  if(pedidos.length===0){
    kEst.textContent="Sin pedidos"; kDet.textContent="0 pedidos para "+limpiarNombre(restauranteNombre);
    card.className="tcard"; btn.className="btn btn-ver"; btn.textContent="Sin datos";
  } else if(pendiente <= 1){
    card.className="tcard pago-verde";
    kEst.textContent="Pago"; kEst.style.color="#166534";
    kDet.textContent = pagos.length+" factura(s) - Pagado $ "+totalPagado.toFixed(2);
    btn.className="btn btn-pago"; btn.textContent="Pago";
  }else{
    card.className="tcard pago-rojo";
    kEst.textContent="Pendiente por pagar"; kEst.style.color="#991b1b";
    kDet.textContent = "Pendiente $ "+pendiente.toFixed(2);
    btn.className="btn btn-pend"; btn.textContent="Pendiente";
  }

  const cont = document.getElementById('listaPedidos');
  if(filtrados.length===0){ cont.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8">No hay pedidos para '+limpiarNombre(restauranteNombre)+' en DoloYa-Historial</div>'; return; }
  cont.innerHTML="";
  filtrados.forEach(p=>{
    const esCanc = p.tipo==="cancelado";
    const col90 = esCanc ? `<span style="color:#E30613;font-weight:700">50% $ ${p.gana.toFixed(2)}</span><br><span style="font-size:6.5px">por pedido cancelado</span>` : `<span style="color:#16a34a;font-weight:700">$ ${p.gana.toFixed(2)}</span><br><span style="font-size:6.5px">90%</span>`;
    const estadoPedido = esCanc ? '<span class="badge" style="background:#fee2e2;color:#991b1b;border:1px solid #E30613;font-size:7.5px">Cancelado</span>' : '<span class="badge badge-pagado" style="font-size:7.5px">Entregado</span>';
    const resumenPago = pagos.length>0 ? '<span class="badge badge-pagado" style="font-size:7.5px">Pagado</span>' : '<span class="badge badge-pend" style="font-size:7.5px">Pendiente por pagar</span>';
    const btnFactura = pagos.length>0 ? `<button class="btn btn-fact" style="font-size:8.5px" onclick="verFactura('${pagos[0].id}')">Ver factura</button>` : `<span style="font-size:7.5px;color:#94a3b8">Sin factura</span>`;
    cont.innerHTML+=`
    <div class="table-row" style="${esCanc?'background:#fff1f2':''}">
      <span style="line-height:1.1">${fechaCorta(p.fecha)}</span>
      <span style="font-weight:800;font-size:9px">#${p.id.slice(-6).toUpperCase()}</span>
      <span style="font-size:9px">${p.cliente}</span>
      <span style="font-size:9px">$ ${p.venta.toFixed(2)}</span>
      <span style="font-size:9px">${col90}</span>
      <span style="display:flex;flex-direction:column;gap:2px">${estadoPedido}${resumenPago}</span>
      <span>${btnFactura}</span>
    </div>`;
  });
}

window.filtrar = ()=>{
  const txt = document.getElementById('buscar').value.toLowerCase();
  const d = document.getElementById('fechaDesde').value;
  const h = document.getElementById('fechaHasta').value;
  filtrados = pedidos.filter(p=>{
    const matchTxt = p.id.toLowerCase().includes(txt) || p.cliente.toLowerCase().includes(txt);
    let matchFecha = true;
    if(d && h){
      try{
        let fd = new Date(d); fd.setHours(0,0,0,0);
        let fh = new Date(h); fh.setHours(23,59,59,999);
        let fp = new Date(p.fecha); if(isNaN(fp.getTime())) fp=new Date(Number(p.fecha));
        matchFecha = fp>=fd && fp<=fh;
      }catch{}
    }
    return matchTxt && matchFecha;
  });
  render();
};

window.verFactura = (idPago)=>{
  const pago = pagos.find(p=>p.id===idPago) || pagos[0];
  if(!pago) return;
  document.getElementById('contFactura').innerHTML=`
    <b>Negocio:</b> ${limpiarNombre(restauranteNombre)}<br>
    <b>Factura:</b> ${pago.factura}<br>
    <b>Fecha pago:</b> ${pago.fecha ? new Date(pago.fecha).toLocaleString('es-MX') : "-"}<br>
    <b>Monto:</b> $ ${Number(pago.monto).toFixed(2)}<br>
    <b>Estado:</b> <span class="badge badge-pagado">Pagada</span><br><br>
    <div style="background:#f8fafc;padding:8px;border-radius:8px;border:1px dashed #e2e8f0">Factura de ${limpiarNombre(restauranteNombre)} desde pagos_aliados</div>
  `;
  document.getElementById('modalFactura').style.display='flex';
};

cargar();
</script>
</body>
</html>
