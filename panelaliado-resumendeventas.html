<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Ventas - Aliado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f8fb;color:#0f172a}
.header-top{background:white;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.btn-x{width:34px;height:34px;background:#E30613;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.header-top h1{font-size:15px;font-weight:800;flex:1}
.top-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
.tcard{background:white;border-radius:12px;border:1px solid #eef2f7;padding:12px}
.tcard label{font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px;line-height:1.2}
.tcard b{font-size:14px;font-weight:800;display:block}
.tcard span{font-size:10px;color:#64748b}
.tcard.pago-verde{border:2px solid #00ff6a;background:#f0fdf4;box-shadow:0 0 10px rgba(0,255,106,.4)}
.tcard.pago-rojo{border:2px solid #E30613;background:#fef2f2}
.box{background:white;border-radius:12px;border:1px solid #eef2f7;overflow:hidden;margin:0 12px 20px}
.filters{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.filters input{padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0;font-size:11px;min-width:0}
.table-head{background:#0a1020;color:white;display:grid;grid-template-columns:60px 75px 1fr .6fr .6fr .5fr .5fr .6fr .6fr;padding:8px 8px;font-size:7.5px;font-weight:700;text-transform:uppercase;align-items:center;gap:2px}
.table-row{display:grid;grid-template-columns:60px 75px 1fr .6fr .6fr .5fr .5fr .6fr .6fr;padding:8px 8px;border-bottom:1px solid #f1f5f9;align-items:center;font-size:9px;gap:2px;word-break:break-word}
.badge{padding:3px 8px;border-radius:999px;font-size:8px;font-weight:700;display:inline-block}
.badge-pagado{background:#dcfce7;color:#166534;border:1px solid #16a34a}
.badge-pend{background:#fef9c3;color:#854d0e;border:1px solid #f59e0b}
.btn{padding:5px 10px;border-radius:999px;font-size:9px;font-weight:700;cursor:pointer;border:none}
.btn-ver{border:1px solid #0f172a;background:white;color:#0f172a}
.btn-pago{background:#00ff6a;color:#065f29;box-shadow:0 0 8px rgba(0,255,106,.6)}
.btn-pend{background:#E30613;color:white}
.btn-graf{background:#0a1020;color:white;border:1px solid #0a1020;font-size:7.5px;padding:4px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-box{background:white;border-radius:12px;padding:16px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal-grafica .modal-box{max-width:520px}
.resumen-grafica{margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.resumen-grafica div{display:flex;justify-content:space-between;padding:5px 0;font-size:10.5px;border-bottom:1px dashed #e2e8f0}

/* ===== SOLO ARREGLO: RESUMEN A LO LARGO EN CELULAR ===== */
@media(max-width:900px){
  .top-cards{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap:10px;
    padding:10px 10px 12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .top-cards::-webkit-scrollbar{display:none}
  .tcard{
    min-width:165px;
    max-width:165px;
    flex:0 0 165px;
    padding:10px 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .tcard b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media(max-width:700px){
  .header-top{padding:8px 10px}
  .header-top h1{font-size:13px}
  .box{margin:0 8px 12px;border-radius:10px}
  .filters{padding:8px;gap:6px}
  .filters input{font-size:12px;padding:9px 10px}
  .filters input#buscar{flex:1 1 100%}
  .table-head{display:none}
  #listaPedidos{display:flex;flex-direction:column;gap:10px;padding:10px}
  .table-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    padding:0;
    border:1px solid #e2e8f0;
    border-radius:12px;
    overflow:hidden;
    background:white;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .table-row span{
    font-size:11px!important;
    padding:8px 10px;
    border-bottom:1px solid #f1f5f9;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .table-row span:nth-child(1)::before{content:'Fecha / Hora';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(2)::before{content:'Pedido';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(3)::before{content:'Cliente';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(4)::before{content:'Venta total';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(5)::before{content:'Cancelado';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(6)::before{content:'Pagado';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(7)::before{content:'Pendiente';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(8)::before{content:'Estado';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(9)::before{content:'Gráfica';font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
  .table-row span:nth-child(1){background:#f8fafc}
  .table-row span:nth-child(2){background:#f8fafc}
  .table-row span:nth-child(9){grid-column:1 / -1; align-items:center; justify-content:center; background:#f8fafc; border-bottom:none}
  .btn-graf{font-size:11px!important;padding:8px 16px!important;width:100%;justify-content:center;display:flex}
}
@media(max-width:380px){
  .tcard{min-width:150px;max-width:150px;flex:0 0 150px}
}
</style>
</head>
<body>
<div class="header-top">
<button class="btn-x" onclick="location.href='panelaliado.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div style="width:2px;height:16px;background:#E30613"></div>
<h1>Resumen de ventas</h1>
<span id="nombreNegocio" style="display:none"></span>
</div>

<div class="top-cards">
<div class="tcard"><label>Total ingresos restaurante</label><b id="kIngresos">$ 0.00</b><span id="kSubIngresos">0 pedidos</span></div>
<div class="tcard" style="border-left:4px solid #E30613"><label>Pérdida por cancelación</label><b id="kPerdidas" style="color:#E30613">- $ 0.00</b><span id="kSubPerd">0 cancelados</span></div>
<div class="tcard"><label>Total pedidos</label><b id="kTotalPed">0</b><span id="kNombreSpan">De este negocio</span></div>
<div class="tcard" id="cardEstadoPago"><label>Resumen de pago de facturas</label><b id="kEstadoPago">0 facturas</b><span id="kDetallePago">Sin pagos</span><div style="margin-top:8px"><button id="btnEstadoPago" class="btn btn-pend">Pendiente</button></div></div>
</div>

<div class="box">
<div class="filters">
<input id="buscar" placeholder="Buscar ST- o cliente..." onkeyup="filtrar()" style="flex:1">
<input type="date" id="fechaDesde"><input type="date" id="fechaHasta"><button class="btn btn-ver" onclick="filtrar()">Filtrar</button>
</div>
<div class="table-head">
<span>Fecha / Hora</span><span>Pedido</span><span>Cliente</span><span>Venta total</span><span>Pedido cancelado</span><span>Pagado</span><span>Pendiente</span><span>Estado</span><span>Gráfica</span>
</div>
<div id="listaPedidos"><div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Cargando tus ventas...</div></div>
</div>

<div class="modal modal-grafica" id="modalGraficaPedido">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<h3 id="tituloGraficaPedido" style="font-size:13px;font-weight:800">Gráfica del pedido</h3>
<button class="btn btn-ver" onclick="document.getElementById('modalGraficaPedido').style.display='none'">X</button>
</div>
<div style="height:190px"><canvas id="chartPedido"></canvas></div>
<div class="resumen-grafica" id="resumenGraficaPedido"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const appHis = initializeApp(configHistorial, "hisApp");
const dbHis = getFirestore(appHis);
let restauranteIdReal = "";
let restauranteNombreReal = "";
let pedidos = [];
let pagos = [];
let filtrados = [];
let chartPedidoInstance = null;
function fechaCorta(f){ try{ let d=new Date(f); if(isNaN(d.getTime())) d=new Date(Number(f)); if(isNaN(d.getTime())) return "-"; return `<span style="font-size:7px">${d.toLocaleDateString('es-MX')}</span><br><span style="font-size:6.5px;color:#64748b">${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span>`; }catch{ return "-"; } }
function obtenerSesionAliado(){ try{ const sesionRaw = localStorage.getItem('doloya_aliado_sesion'); if(!sesionRaw) return null; return JSON.parse(sesionRaw); }catch{ return null; } }
async function cargar(){
  const sesion = obtenerSesionAliado();
  if(!sesion){ document.getElementById('listaPedidos').innerHTML='<div style="padding:20px;text-align:center;color:#E30613">No hay sesión. Entra desde el login de aliados.</div>'; return; }
  restauranteIdReal = (sesion.negocio || sesion.id || "").toLowerCase().trim();
  restauranteNombreReal = sesion.nombre || sesion.negocio || restauranteIdReal;
  const snapP = await getDocs(collection(dbHis, "pagos_aliados"));
  snapP.forEach(d=>{
    const data=d.data();
    const id = (data.restauranteId || data.restaurante?.id || "").toLowerCase().trim();
    if(id !== restauranteIdReal) return;
    pagos.push({ id:d.id, monto:Number(data.montoPagado||data.monto||0), fecha:data.fechaPago||data.fecha||data.timestamp, facturaId:data.facturaId||d.id });
  });
  const rawPedidos = [];
  const snapE = await getDocs(collection(dbHis, "pedidos_entregados"));
  snapE.forEach(d=>{
    const data=d.data();
    const rid = (data.restaurante?.id || "").toLowerCase().trim();
    if(rid !== restauranteIdReal) return;
    const venta = Number(data.totales?.costoProductos || data.total || 0);
    rawPedidos.push({ id:d.id, tipo:"entregado", fecha: data.timestampEnvio || data.timestampAdmin || data.fecha || Date.now(), venta: venta, valorCancelado:0, gana: venta*0.9, cliente: data.cliente?.nombre || "Cliente" });
  });
  const snapC = await getDocs(collection(dbHis, "pedidos_cancelados"));
  snapC.forEach(d=>{
    const data=d.data();
    const rid = (data.restaurante?.id || "").toLowerCase().trim();
    if(rid !== restauranteIdReal) return;
    const venta = Number(data.totales?.costoProductos || data.total || 0);
    const gana50 = venta*0.5;
    rawPedidos.push({ id:d.id, tipo:"cancelado", fecha: data.timestampEnvio || data.timestampAdmin || data.fecha || Date.now(), venta: venta, valorCancelado:gana50, gana: gana50, cliente: data.cliente?.nombre || "Cliente" });
  });
  rawPedidos.sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  rawPedidos.forEach((p, idx)=>{ p.numeroReal = idx+1; p.codigo = "ST-"+String(idx+1); });
  pedidos = [...rawPedidos].sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  filtrados=[...pedidos];
  render();
}
function render(){
  const totalPagadoGlobal = pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const ingresosEntregados = pedidos.filter(p=>p.tipo==="entregado").reduce((s,p)=>s+p.venta,0);
  const ingresosEntregadosMenos10 = ingresosEntregados * 0.9;
  const ingresosCancelados = pedidos.filter(p=>p.tipo==="cancelado").reduce((s,p)=>s+p.valorCancelado,0);
  const totalIngresosReal = ingresosEntregadosMenos10 + ingresosCancelados;
  const canceladosPerdida40 = pedidos.filter(p=>p.tipo==="cancelado").reduce((s,p)=>s+(p.venta * 0.4),0);
  const countCanc = pedidos.filter(p=>p.tipo==="cancelado").length;
  const countEnt = pedidos.filter(p=>p.tipo==="entregado").length;
  document.getElementById('kIngresos').textContent = "$ "+totalIngresosReal.toFixed(2);
  document.getElementById('kSubIngresos').textContent = countEnt+" entregados + "+countCanc+" cancelados (50%)";
  document.getElementById('kPerdidas').textContent = "- $ "+canceladosPerdida40.toFixed(2);
  document.getElementById('kSubPerd').textContent = countCanc+" cancelados - pérdida 40%";
  document.getElementById('kTotalPed').textContent = pedidos.length;
  document.getElementById('kNombreSpan').textContent = countEnt+" entregados, "+countCanc+" cancelados";
  const totalGana = pedidos.reduce((s,p)=>s+p.gana,0);
  const pendienteGlobal = Math.max(0, totalGana - totalPagadoGlobal);
  const card = document.getElementById('cardEstadoPago');
  const btn = document.getElementById('btnEstadoPago');
  const kEst = document.getElementById('kEstadoPago');
  const kDet = document.getElementById('kDetallePago');
  if(pedidos.length===0){
    kEst.textContent="0 facturas"; kDet.textContent="Sin pedidos"; card.className="tcard"; btn.className="btn btn-ver"; btn.textContent="Sin datos";
  }else if(pagos.length===0){
    kEst.textContent = "0 facturas pagadas"; kDet.textContent = pedidos.length+" pendientes - $ "+totalGana.toFixed(2); card.className="tcard pago-rojo"; btn.className="btn btn-pend"; btn.textContent= pedidos.length+" pendientes";
  }else if(pendienteGlobal <= 1){
    kEst.textContent = pagos.length+" factura(s)"; kDet.textContent = "Pagado $ "+totalPagadoGlobal.toFixed(2); card.className="tcard pago-verde"; btn.className="btn btn-pago"; btn.textContent="Al día";
  }else{
    kEst.textContent = pagos.length+" pagadas"; kDet.textContent = "Pagado $ "+totalPagadoGlobal.toFixed(2)+" - Pendiente $ "+pendienteGlobal.toFixed(2); card.className="tcard pago-rojo"; btn.className="btn btn-pend"; btn.textContent= "Queda $ "+pendienteGlobal.toFixed(2);
  }
  const cont = document.getElementById('listaPedidos');
  if(filtrados.length===0){ cont.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8">No hay pedidos<br><small>ID: '+restauranteIdReal+'</small></div>'; return; }
  cont.innerHTML="";
  filtrados.forEach(p=>{
    const esCanc = p.tipo==="cancelado";
    const ventaTotal = `$ ${p.venta.toFixed(2)}`;
    const colCancelado = esCanc ? `$ ${p.valorCancelado.toFixed(2)} <br><span style="font-size:6.5px;color:#E30613">50% de $${p.venta.toFixed(0)}</span>` : `<span style="color:#94a3b8">-</span>`;
    let pagadoRow = pagos.length>0 ? `$ ${p.gana.toFixed(2)}` : "$ 0.00";
    let pendienteRow = pagos.length>0 ? "$ 0.00" : `$ ${p.gana.toFixed(2)}`;
    const estadoBadge = esCanc ? '<span class="badge" style="background:#fee2e2;color:#991b1b;border:1px solid #E30613;font-size:7px">Cancelado</span>' : '<span class="badge badge-pagado" style="font-size:7px">Entregado</span>';
    cont.innerHTML+=`<div class="table-row" style="${esCanc?'background:#fff1f2':''}"><span>${fechaCorta(p.fecha)}</span><span style="font-weight:800;font-size:8px">${p.codigo}</span><span style="font-size:8.5px">${p.cliente}</span><span style="font-size:8.5px;font-weight:600">${ventaTotal}</span><span style="font-size:8.5px">${colCancelado}</span><span style="font-size:8.5px;color:#16a34a;font-weight:700">${pagadoRow}</span><span style="font-size:8.5px;color:#E30613;font-weight:700">${pendienteRow}</span><span>${estadoBadge}</span><span><button class="btn btn-graf" onclick="abrirGraficaPedido('${p.id}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="margin-right:2px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Gráfica</button></span></div>`;
  });
}
window.filtrar = ()=>{
  const txt = document.getElementById('buscar').value.toLowerCase();
  const d = document.getElementById('fechaDesde').value;
  const h = document.getElementById('fechaHasta').value;
  filtrados = pedidos.filter(p=>{
    const matchTxt = p.id.toLowerCase().includes(txt) || p.codigo.toLowerCase().includes(txt) || p.cliente.toLowerCase().includes(txt);
    let matchFecha = true;
    if(d && h){
      try{
        let fd = new Date(d); fd.setHours(0,0,0,0);
        let fh = new Date(h); fh.setHours(23,59,59,999);
        let fp = new Date(p.fecha); if(isNaN(fp.getTime())) fp=new Date(Number(p.fecha));
        matchFecha = fp>=fd && fp<=fh;
      }catch{}
    }
    return matchTxt && matchFecha;
  });
  render();
};
window.abrirGraficaPedido = (idPedido)=>{
  const p = pedidos.find(x=>x.id===idPedido);
  if(!p) return;
  document.getElementById('modalGraficaPedido').style.display='flex';
  document.getElementById('tituloGraficaPedido').textContent = "Gráfica del pedido";
  const valorProducto = p.venta;
  const valorProductoMenos10 = valorProducto * 0.9;
  const totalPagadoGlobal = pagos.reduce((s,pa)=>s+Number(pa.monto||0),0);
  const estaPagado = pagos.length>0 && totalPagadoGlobal>0;
  let ingresosPedido = estaPagado ? p.gana : 0;
  let pendientePedido = estaPagado ? 0 : p.gana;
  const perdida40Real = valorProducto * 0.4;
  let labels, data, colors, resumenHtml, totalTexto, colorTotal;
  if(p.tipo==="cancelado"){
    labels = ['Valor producto', 'Ingresos', 'Pérdida 40%', 'Pendiente'];
    data = [valorProductoMenos10, ingresosPedido, perdida40Real, pendientePedido];
    colors = ['#3b82f6', '#16a34a', '#E30613', '#f59e0b'];
    const totalCancel = ingresosPedido - valorProducto;
    totalTexto = totalCancel;
    colorTotal = totalCancel < 0 ? '#E30613' : '#16a34a';
    resumenHtml = `
      <div><span style="color:#3b82f6">● Valor producto menos 10%</span><b>$ ${valorProductoMenos10.toFixed(2)}</b></div>
      <div><span style="color:#16a34a">● Ingresos</span><b>$ ${ingresosPedido.toFixed(2)}</b></div>
      <div><span style="color:#E30613">● Pérdida por cancelación 40%</span><b>$ ${perdida40Real.toFixed(2)}</b></div>
      <div><span style="color:#f59e0b">● Pendiente por pagar</span><b>$ ${pendientePedido.toFixed(2)}</b></div>
      <div style="border-top:2px solid #0f172a;margin-top:6px;padding-top:8px;font-weight:800"><span>Total</span><b style="font-size:13px;color:${colorTotal}">$ ${totalTexto.toFixed(2)}</b></div>
    `;
  }else{
    labels = ['Valor producto', 'Ingresos', 'Pendiente'];
    data = [valorProductoMenos10, ingresosPedido, pendientePedido];
    colors = ['#3b82f6', '#16a34a', '#f59e0b'];
    totalTexto = ingresosPedido;
    colorTotal = '#16a34a';
    resumenHtml = `
      <div><span style="color:#3b82f6">● Valor producto menos 10%</span><b>$ ${valorProductoMenos10.toFixed(2)}</b></div>
      <div><span style="color:#16a34a">● Ingresos</span><b>$ ${ingresosPedido.toFixed(2)}</b></div>
      <div><span style="color:#f59e0b">● Pendiente por pagar</span><b>$ ${pendientePedido.toFixed(2)}</b></div>
      <div style="border-top:2px solid #0f172a;margin-top:6px;padding-top:8px;font-weight:800"><span>Total</span><b style="font-size:13px;color:${colorTotal}">$ ${totalTexto.toFixed(2)}</b></div>
    `;
  }
  const ctx = document.getElementById('chartPedido').getContext('2d');
  if(chartPedidoInstance) chartPedidoInstance.destroy();
  chartPedidoInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderRadius: 6, barThickness: 20 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks:{font:{size:9}} }, x:{ticks:{font:{size:8}}} } }
  });
  document.getElementById('resumenGraficaPedido').innerHTML = resumenHtml;
};
cargar();
</script>
</body>
</html>
