<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Producto - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;min-height:100vh}
:root{--rojo:#C50D1F;--rojo2:#D90A17}
.top-header{background:var(--rojo);height:72px;display:flex;align-items:center;padding:0 22px;gap:18px;position:sticky;top:0;z-index:100}
.btn-x{width:48px;height:48px;background:white;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn-x svg{width:22px;height:22px;stroke:var(--rojo2);stroke-width:3.5;fill:none;stroke-linecap:round}
.divider{width:2px;height:36px;background:rgba(255,255,255,0.35);flex-shrink:0}
.top-text h1{color:white;font-size:26px;font-weight:800;line-height:1}
.top-text p{color:rgba(255,255,255,0.9);font-size:13.5px;font-weight:400;margin-top:4px}
.main{padding:22px;display:flex;justify-content:center}
.card-form{width:100%;max-width:980px;background:white;border:1.5px solid #E8E9F0;border-radius:12px;overflow:hidden}
.form-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:800px){.form-body{grid-template-columns:1fr}}
.label-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.label-row svg{width:22px;height:22px;stroke:#111;stroke-width:2;fill:none}
.label-row b{font-size:13.5px;font-weight:700;color:#111827}
.label-row span{color:#E30613}
.upload-box{border:1.5px dashed #D1D5DB;border-radius:10px;background:#F8FAFF;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;overflow:hidden;position:relative}
.upload-box:hover{border-color:#9CA3AF;background:#F3F6FF}
.upload-box img.preview{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none}
.upload-box.has-img{border-style:solid}
.upload-box.has-img img.preview{display:block}
.upload-icon{width:64px;height:64px;background:#E5E7EB;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.upload-icon svg{width:44px;height:44px;stroke:#9AA0B6;stroke-width:1.6;fill:none}
.upload-box p.main-t{font-size:13px;color:#6B7280;font-weight:500}
.upload-box p.sub-t{font-size:11.5px;color:#6B7280;margin-top:6px}
.input-select{width:100%;height:44px;border:1.5px solid #E5E9F0;border-radius:8px;padding:0 36px 0 12px;font-size:13.5px;color:#111827;outline:none;background:white;appearance:none}
.select-wrap{position:relative}
.select-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#6B7280;pointer-events:none}
.full-row{grid-column:1 / -1}
.textarea-wrap{position:relative}
.textarea{width:100%;min-height:120px;border:1.5px solid #E5E9F0;border-radius:8px;padding:12px;font-size:13.5px;outline:none;resize:none;color:#111}
.textarea::placeholder{color:#9CA3AF}
.input-text{width:100%;height:44px;border:1.5px solid #E5E9F0;border-radius:8px;padding:0 12px;font-size:13.5px;outline:none;color:#111}
.input-text::placeholder{color:#9CA3AF}
.char-count{position:absolute;right:10px;bottom:8px;font-size:11px;color:#6B7280}
.input-price{width:100%;height:44px;border:1.5px solid #E5E9F0;border-radius:8px;padding:0 12px;font-size:13.5px;outline:none;color:#111}
.input-price::placeholder{color:#9CA3AF}
.footer{border-top:1.5px solid #F0F5;padding:18px 22px;display:flex;gap:16px;justify-content:flex-end;background:white}
@media(max-width:600px){.footer{flex-direction:column}}
.btn-cancel{flex:1;max-width:420px;height:48px;border:1.5px solid #E5E9F0;background:white;border-radius:10px;font-size:14px;font-weight:600;color:#111827;cursor:pointer}
.btn-save{flex:1;max-width:420px;height:48px;border:none;background:var(--rojo2);border-radius:10px;font-size:14px;font-weight:700;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-save svg{width:20px;height:20px;stroke:white;stroke-width:2;fill:none}
.btn-save:disabled{opacity:0.6;cursor:not-allowed}
#toastOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:none;align-items:center;justify-content:center}
#toastOverlay.show{display:flex}
.toast-card{background:white;border-radius:16px;padding:20px 24px;min-width:280px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);border-top:4px solid #E30613}
</style>
</head>
<body>
<div id="toastOverlay"><div class="toast-card"><h4 id="toastTitle">Guardado</h4><p id="toastMsg" style="font-size:12px;color:#6b7280;margin-top:4px">Producto agregado</p></div></div>

<div class="top-header">
  <button class="btn-x" onclick="window.location.href='panelaliado-menu.html'"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  <div class="divider"></div>
  <div class="top-text"><h1>Agregar Producto</h1><p>Completa la información para añadir un nuevo producto a tu menú.</p></div>
</div>

<div class="main">
  <div class="card-form">
    <div class="form-body">
      <div>
        <div class="label-row">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 14l2-2 3 3"/><circle cx="9" cy="8" r="1.5"/></svg>
          <b>Imagen del producto *</b>
        </div>
        <input type="file" id="inputImg" accept="image/png,image/jpeg,image/webp" style="display:none">
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('inputImg').click()">
          <img class="preview" id="imgPreview" src="">
          <div id="uploadContent" style="display:flex;flex-direction:column;align-items:center">
            <div class="upload-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="8" r="2"/><path d="M3 16l5-5 4 4 3-2 6 6"/></svg></div>
            <p class="main-t">Haz clic para subir una imagen</p>
            <p class="sub-t">PNG, JPG o WEBP (máx. 2 MB)</p>
          </div>
        </div>
      </div>

      <div>
        <div class="label-row">
          <svg viewBox="0 0 24 24"><path d="M12 2l8 5v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-5z"/><path d="M9 12l2 2 4-4"/></svg>
          <b>Categoría *</b>
        </div>
        <div class="select-wrap">
          <select id="selectCat" class="input-select"><option value="">Cargando categorías...</option></select>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div style="margin-top:18px">
          <div class="label-row">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <b>Nombre del producto *</b>
          </div>
          <input id="txtNombre" class="input-text" placeholder="Ej. Alitas BBQ x10">
        </div>
      </div>

      <div class="full-row">
        <div class="label-row">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
          <b>Descripción del producto *</b>
        </div>
        <div class="textarea-wrap">
          <textarea id="txtDesc" class="textarea" placeholder="Describe brevemente el producto..." maxlength="500"></textarea>
          <div class="char-count" id="charCount">0/500</div>
        </div>
      </div>

      <div class="full-row">
        <div class="label-row">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          <b>Precio del producto *</b>
        </div>
        <input id="txtPrecio" class="input-price" type="number" step="0.01" placeholder="Ej. $65.00">
      </div>
    </div>

    <div class="footer">
      <button class="btn-cancel" onclick="window.location.href='panelaliado-menu.html'">Cancelar</button>
      <button class="btn-save" id="btnGuardar" onclick="guardarProducto()">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar producto
      </button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let imagenBase64 = '';

function getIdRestaurante(){
  try{
    const sesion = JSON.parse(localStorage.getItem('doloya_aliado_sesion'));
    return sesion.id || sesion.negocio || 'santillos';
  }catch{
    return 'santillos';
  }
}

function toast(t,m){
  document.getElementById('toastTitle').textContent=t;
  document.getElementById('toastMsg').textContent=m;
  document.getElementById('toastOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('toastOverlay').classList.remove('show'),2500);
}

// ORGANIZADO: UNA SOLA RUTA PARA TODOS - doloya_aliados/{negocio}/categorias/{categoria}
async function cargarCategorias(){
  const idRest = getIdRestaurante();
  const sel = document.getElementById('selectCat');
  sel.innerHTML = '<option value="">Cargando categorías de '+idRest+'...</option>';

  try{
    const snap = await get(ref(db, `doloya_aliados/${idRest}/categorias`));
    if(!snap.exists()){
      sel.innerHTML = '<option value="">No hay categorías registradas</option>';
      return;
    }
    const data = snap.val();
    let opciones = [];
    let vistos = new Set();

    for(const key in data){
      if(key.startsWith('_')) continue;
      if(['carritos','categoria','info','disponibilidad','banner','banners','likes','perfil','direccion'].includes(key)) continue;
      const val = data[key];
      if(!val || typeof val !== 'object') continue;
      if(val.precio !== undefined) continue; // es producto, no categoria

      // Caso 1: estructura legacy categorias/categorias/boneles - lo convertimos a ruta unica
      if(key === 'categorias' && typeof val === 'object'){
        for(const subKey in val){
          if(subKey.startsWith('_')) continue;
          const subVal = val[subKey];
          if(!subVal || typeof subVal !== 'object') continue;
          if(subVal.precio !== undefined) continue;
          if(vistos.has(subKey.toLowerCase())) continue;
          const nombreMostrar = subVal.nombre || subKey;
          opciones.push({keyOriginal: subKey, nombre: nombreMostrar});
          vistos.add(subKey.toLowerCase());
        }
        continue;
      }

      // Caso 2: estructura organizada categorias/boneles
      if(vistos.has(key.toLowerCase())) continue;
      const nombreMostrar = val.nombre || key.replace(/_/g,' ');
      opciones.push({keyOriginal: key, nombre: nombreMostrar});
      vistos.add(key.toLowerCase());
    }

    if(opciones.length === 0){
      sel.innerHTML = '<option value="">No hay categorías registradas</option>';
    }else{
      opciones.sort((a,b)=> a.nombre.localeCompare(b.nombre));
      sel.innerHTML = '<option value="">Selecciona una categoría ('+idRest+')</option>' + opciones.map(o=>`<option value="${o.keyOriginal}">${o.nombre}</option>`).join('');
    }
  }catch(e){
    console.log(e);
    sel.innerHTML = '<option value="">Error cargando categorías</option>';
  }
}

document.getElementById('txtDesc').addEventListener('input', e=>{
  document.getElementById('charCount').textContent = e.target.value.length + '/500';
});

document.getElementById('inputImg').addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>2*1024*1024){ toast('Error','Imagen muy pesada, máx 2 MB'); return; }
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=800;
      let w=img.width, h=img.height;
      if(w>max){ h=h*(max/w); w=max; }
      if(h>max){ w=w*(max/h); h=max; }
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      imagenBase64 = canvas.toDataURL('image/jpeg',0.7);
      document.getElementById('imgPreview').src=imagenBase64;
      document.getElementById('imgPreview').style.display='block';
      document.getElementById('uploadBox').classList.add('has-img');
      document.getElementById('uploadContent').style.display='none';
      toast('Imagen','Imagen cargada');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

window.guardarProducto=async function(){
  const idRest = getIdRestaurante();
  const nombre=document.getElementById('txtNombre').value.trim();
  const categoriaKeyOriginal=document.getElementById('selectCat').value.trim();
  const categoriaKey=categoriaKeyOriginal.toLowerCase();
  const categoriaTexto=document.getElementById('selectCat').options[document.getElementById('selectCat').selectedIndex]?.text || categoriaKey;
  const descripcion=document.getElementById('txtDesc').value.trim();
  const precioVal=document.getElementById('txtPrecio').value.trim();
  const precio=parseFloat(precioVal);

  if(!imagenBase64){ toast('Falta imagen','Sube la imagen del producto'); return; }
  if(!categoriaKeyOriginal){ toast('Falta categoría','Selecciona una categoría'); return; }
  if(!nombre){ toast('Falta nombre','Escribe el nombre del producto'); return; }
  if(!descripcion){ toast('Falta descripción','Describe el producto'); return; }
  if(!precioVal || isNaN(precio) || precio<=0){ toast('Falta precio','Ingresa el precio'); return; }

  const btn=document.getElementById('btnGuardar');
  btn.disabled=true;
  btn.textContent='Guardando...';

  try{
    const idProducto = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'') + '_' + Date.now();

    // RUTA UNICA ORGANIZADA PARA TODOS - YA NO MAS categorias/categorias
    const rutaUnica = `doloya_aliados/${idRest}/categorias/${categoriaKeyOriginal}/${idProducto}`;

    await set(ref(db, rutaUnica),{
      id: idProducto,
      nombre: nombre,
      descripcion: descripcion,
      categoria: categoriaKey,
      categoriaNombre: categoriaTexto,
      categoriaKeyOriginal: categoriaKeyOriginal,
      precio: precio,
      imagen: imagenBase64,
      disponibilidad: true,
      activo: true,
      descuento: 0,
      fecha: Date.now()
    });

    toast('Producto guardado', `${nombre} en ${idRest}/${categoriaTexto}`);
    setTimeout(()=>{ window.location.href='panelaliado-menu.html'; },1200);
  }catch(e){
    console.error(e);
    toast('Error', e.message);
    btn.disabled=false;
    btn.textContent='Guardar producto';
  }
}

cargarCategorias();
</script>
</body>
</html>
